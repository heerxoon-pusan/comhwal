{"id": "S2-011", "t": "01 입력·서식·참조", "q": "다음 중 채우기 핸들을 이용하여 데이터를 입력하는 방법으로 옳지 않은 것은?", "c": ["인접한 셀의 내용으로 현재 셀을 빠르게 입력하려면 위쪽 셀의 내용은 [Ctrl]+[D], 왼쪽 셀의 내용은 [Ctrl]+[R]을 누른다.", "숫자와 문자가 혼합된 문자열이 입력된 셀의 채우기 핸들을 아래쪽으로 끌면 문자는 복사되고 숫자는 1씩 증가한다.", "숫자가 입력된 셀의 채우기 핸들을 [Ctrl]을 누른 채 아래쪽으로 끌면 똑같은 내용이 복사되어 입력된다.", "날짜가 입력된 셀의 채우기 핸들을 아래쪽으로 끌면 기본적으로 1일 단위로 증가하여 자동 채우기가 된다."], "a": 2, "e": "숫자 셀은 기본적으로 복사되지만, [Ctrl]을 누른 채 끌면 1씩 증가합니다.", "tip": "숫자: 기본 복사, Ctrl 누르면 증가.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 채우기 핸들 · 기출 24-02, 25-05"},
{"id": "S2-012", "t": "01 입력·서식·참조", "q": "다음 중 아래 워크시트의 [A1] 셀에서 10.1을 입력한 후 [Ctrl]을 누르고 자동 채우기 핸들을 아래로 드래그한 경우 [A4] 셀에 입력되는 값은?", "c": ["10.1", "10.4", "13.1", "13.4"], "a": 2, "e": "숫자는 기본 드래그 시 복사되지만 [Ctrl]을 누르고 끌면 1씩 증가하므로 [A4]는 10.1 + 3 = 13.1입니다.", "tip": "숫자 + Ctrl = 1씩 증가.", "w": ["[Ctrl]을 누르지 않았을 때의 값입니다.", "증가 단위는 0.1이 아니라 1입니다.", "", "증가 단위가 1이므로 3칸 아래는 13.1입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 채우기 핸들 · 기출 24-03, 25-03"},
{"id": "S2-013", "t": "01 입력·서식·참조", "q": "다음 중 날짜 데이터를 자동 채우기 옵션 단추를 이용하여 데이터를 채운 경우, 채울 수 있는 값에 해당하지 않는 것은?", "c": ["평일로만 일 단위 증가되는 날짜를 채울 수 있다.", "주 단위로 증가되는 날짜를 채울 수 있다.", "월 단위로 증가되는 날짜를 채울 수 있다.", "연 단위로 증가되는 날짜를 채울 수 있다."], "a": 1, "e": "날짜 채우기 옵션에는 일 단위, 평일 단위, 월 단위, 연 단위가 있으며 주 단위는 없습니다.", "tip": "일·평일·월·연 (주 단위 없음).", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 자동 채우기 옵션 · 기출 24-02"},
{"id": "S2-014", "t": "01 입력·서식·참조", "q": "다음 중 [A1:D1] 영역을 선택한 후 채우기 핸들을 이용하여 아래쪽으로 드래그하였을 때, 데이터가 변하지 않고 같은 데이터로 채워지는 것은? (A1 '가', B1 '갑', C1 '월', D1 '자')", "c": ["가", "갑", "월", "자"], "a": 0, "e": "'갑'은 갑을병정…, '월'은 월화수목…, '자'는 자축인묘… 등 기본 제공 목록이어서 증가합니다. '가'는 목록에 없어 복사됩니다.", "tip": "기본 목록(갑을병·월화수·자축인)은 증가.", "w": ["", "'갑'은 갑·을·병… 목록으로 채워집니다.", "'월'은 월·화·수… 목록으로 채워집니다.", "'자'는 자·축·인… 목록으로 채워집니다."], "p": "2과목 › 데이터 입력·서식·참조 › 채우기 핸들 · 기출 24-04"},
{"id": "S2-015", "t": "01 입력·서식·참조", "q": "다음 중 셀의 이동과 복사에 대한 설명으로 옳지 않은 것은?", "c": ["이동하고자 하는 셀 영역을 선택한 후 잘라내기 바로 가기 키인 [Ctrl]+[X]를 누르면 선택 영역 주위에 점선이 표시된다.", "클립보드에는 최대 24개 항목이 저장 가능하므로 여러 데이터를 클립보드에 복사해 두었다가 다른 곳에 한 번에 붙여넣을 수 있다.", "선택된 셀 영역을 이동할 위치로 드래그하는 동안에는 선택된 셀 영역의 테두리만 표시된다.", "[Shift]를 누른 채 선택 영역의 테두리를 클릭하여 원하는 위치로 드래그하면 선택 영역이 복사된다."], "a": 3, "e": "복사하려면 [Ctrl]을 누른 채 드래그합니다. [Shift]를 누른 채 드래그하면 기존 셀 사이에 끼워 넣는 이동이 됩니다.", "tip": "Ctrl = 복사, Shift = 삽입 이동.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 입력·서식·참조 › 셀 이동·복사 · 기출 24-02, 25-06"},
{"id": "S2-016", "t": "01 입력·서식·참조", "q": "다음 중 [셀 서식] 대화상자에서 [맞춤] 탭의 기능으로 옳지 않은 것은?", "c": ["'셀 병합'은 선택 영역에서 데이터 값이 여러 개인 경우 마지막 셀의 내용만 남기고 모두 지운다.", "'셀에 맞춤'은 입력 데이터의 길이가 셀의 너비보다 긴 경우 글자 크기를 자동으로 줄인다.", "'방향'은 데이터를 세로 방향으로 설정하거나 가로의 회전 각도를 지정하여 방향을 설정한다.", "'자동 줄 바꿈'은 텍스트의 길이가 셀의 너비보다 긴 경우 자동으로 줄을 나누어 표시한다."], "a": 0, "e": "셀 병합 시 데이터가 여러 개이면 왼쪽 위(첫 번째) 셀의 내용만 남기고 나머지는 지워집니다.", "tip": "병합 = 왼쪽 위 값만 남음.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 셀 서식 맞춤 · 기출 24-01"},
{"id": "S2-017", "t": "01 입력·서식·참조", "q": "다음 중 입력 데이터에 주어진 표시 형식으로 지정한 경우 그 결과가 옳지 않은 것은?\n① 입력 7.5 / 서식 #.00 / 결과 7.50\n② 입력 44.398 / 서식 ???.??? / 결과 044.398\n③ 입력 12,200,000 / 서식 #,##0, / 결과 12,200\n④ 입력 상공상사 / 서식 @\"귀중\" / 결과 상공상사 귀중", "c": ["① 7.5에 #.00 → 7.50", "② 44.398에 ???.??? → 044.398", "③ 12,200,000에 #,##0, → 12,200", "④ 상공상사에 @\"귀중\" → 상공상사 귀중"], "a": 1, "e": "?는 자릿수 자리를 공백으로 채우는 기호이므로 44.398은 '44.398' 그대로 표시됩니다(0으로 채우는 것은 0 서식).", "tip": "? = 공백 채움, 0 = 0 채움.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 표시 형식 · 기출 26-03"},
{"id": "S2-018", "t": "01 입력·서식·참조", "q": "다음 중 입력 데이터에 주어진 표시 형식으로 지정한 경우 그 결과가 옳지 않은 것은?\n① 서식 @\"귀중\" / 입력 강광희 / 결과 강광희 귀중\n② 서식 #.00 / 입력 7.5 / 결과 7.50\n③ 서식 #\"Kg\" / 입력 0 / 결과 0Kg\n④ 서식 ?/? / 입력 1.25 / 결과 5/4", "c": ["① @\"귀중\" : 강광희 → 강광희 귀중", "② #.00 : 7.5 → 7.50", "③ #\"Kg\" : 0 → 0Kg", "④ ?/? : 1.25 → 5/4"], "a": 2, "e": "#은 의미 없는 0을 표시하지 않으므로 입력 0은 'Kg'만 표시됩니다. '0Kg'으로 표시하려면 0\"Kg\" 서식을 사용합니다.", "tip": "# = 무의미한 0 생략, 0 = 0 표시.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 표시 형식 · 기출 24-03, 25-04"},
{"id": "S2-019", "t": "01 입력·서식·참조", "q": "다음은 표시 형식, 입력 데이터, 결과 순으로 표시한 것이다. 결과가 잘못 표현된 것은?\n① 서식 [>5]\"▲\";\"▼\" / 입력 2 / 결과 ▼\n② 서식 @\"판매량\" / 입력 5월 / 결과 5월 판매량\n③ 서식 ?/? / 입력 1.25 / 결과 5/4\n④ 서식 #.# / 입력 12 / 결과 12.0", "c": ["① [>5]\"▲\";\"▼\" : 2 → ▼", "② @\"판매량\" : 5월 → 5월 판매량", "③ ?/? : 1.25 → 5/4", "④ #.# : 12 → 12.0"], "a": 3, "e": "#.#에서 12는 소수점 이하가 없으므로 '12.'으로 표시됩니다. '12.0'으로 표시하려면 0.0 서식을 사용합니다.", "tip": "#.# → '12.' 으로 표시.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 입력·서식·참조 › 표시 형식 · 기출 26-02"},
{"id": "S2-020", "t": "01 입력·서식·참조", "q": "다음 중 원본 데이터를 지정된 서식으로 설정하였을 때 결과가 옳지 않은 것은?\n① 원본 314826 / 서식 #,##0, / 결과 314,826,\n② 원본 281476 / 서식 #,##0.0 / 결과 281,476.0\n③ 원본 12:00:00 AM / 서식 0 / 결과 0\n④ 원본 2018-03-25 / 서식 yyyy-mmmm / 결과 2018-March", "c": ["① 314826 : #,##0, → 314,826,", "② 281476 : #,##0.0 → 281,476.0", "③ 12:00:00 AM : 0 → 0", "④ 2018-03-25 : yyyy-mmmm → 2018-March"], "a": 0, "e": "서식 끝의 쉼표(,)는 천 단위를 생략하는 기호이므로 314826은 '315'로 표시됩니다.", "tip": "끝 쉼표 = 천 단위 생략.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 표시 형식 · 기출 24-02"},
{"id": "S2-021", "t": "01 입력·서식·참조", "q": "다음은 자료의 화면 표시 형식을 지정한 것이다. 그 결과가 옳은 것은?\n① 입력 2021-8-1 / 서식 yyyy.mmm / 결과 2021.Aug\n② 입력 5 / 서식 #.#0 / 결과 5.00\n③ 입력 1234567 / 서식 0.0E+00 / 결과 1.23E+8\n④ 입력 2234543 / 서식 #,###,\"천원\" / 결과 2,234천원", "c": ["① 2021-8-1 : yyyy.mmm → 2021.Aug", "② 5 : #.#0 → 5.00", "③ 1234567 : 0.0E+00 → 1.23E+8", "④ 2234543 : #,###,\"천원\" → 2,234천원"], "a": 0, "e": "mmm은 월의 영문 약어를 표시하므로 8월은 Aug입니다.", "tip": "mmm = Aug, mmmm = August.", "w": ["", "#.#0은 5.0으로 표시됩니다.", "0.0E+00은 1.2E+06으로 표시됩니다.", "끝 쉼표로 반올림되어 2,235천원으로 표시됩니다."], "p": "2과목 › 데이터 입력·서식·참조 › 표시 형식 · 기출 25-01"},
{"id": "S2-022", "t": "01 입력·서식·참조", "q": "다음 중 원본 데이터를 지정된 서식으로 설정하였을 때, 결과가 옳지 않은 것은?\n① 원본 5054.2 / 서식 ### / 결과 5054\n② 원본 대한민국 / 서식 @\"화이팅\" / 결과 대한민국화이팅\n③ 원본 15:30:22 / 서식 hh:mm:ss AM/PM / 결과 3:30:22 PM\n④ 원본 2013-02-01 / 서식 yyyy-mm-ddd / 결과 2013-02-Fri", "c": ["① 5054.2 : ### → 5054", "② 대한민국 : @\"화이팅\" → 대한민국화이팅", "③ 15:30:22 : hh:mm:ss AM/PM → 3:30:22 PM", "④ 2013-02-01 : yyyy-mm-ddd → 2013-02-Fri"], "a": 2, "e": "hh는 두 자리로 표시하므로 결과는 '03:30:22 PM'이어야 합니다.", "tip": "hh = 두 자리 시, h = 한 자리.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 표시 형식 · 기출 25-02"},
{"id": "S2-023", "t": "01 입력·서식·참조", "q": "다음 중 원본 데이터에 사용자 지정 서식을 적용하였을 때의 표시 결과가 옳은 것은?\n① 원본 6000000 / 서식 #,###,\"백만원\" / 표시 6백만원\n② 원본 kim / 서식 @\"daehan.go.kr\" / 표시 kim@daehan.go.kr\n③ 원본 2021/03/29 / 서식 dddd, mmm dd yyyy / 표시 Monday, Mar 29 2021\n④ 원본 16:08:15 / 서식 h:m:s AM/PM / 표시 4:08:15 PM", "c": ["① 6000000 : #,###,\"백만원\" → 6백만원", "② kim : @\"daehan.go.kr\" → kim@daehan.go.kr", "③ 2021/03/29 : dddd, mmm dd yyyy → Monday, Mar 29 2021", "④ 16:08:15 : h:m:s AM/PM → 4:08:15 PM"], "a": 2, "e": "dddd는 요일 전체 이름, mmm은 월 약어, dd는 두 자리 일을 의미해 'Monday, Mar 29 2021'로 표시됩니다.", "tip": "dddd = Monday, mmm = Mar.", "w": ["끝 쉼표가 천 단위를 생략하므로 6,000백만원으로 표시됩니다.", "@ 뒤에 붙인 문자열만 이어지므로 'kimdaehan.go.kr'로 표시됩니다.", "", "h:m:s는 분·초를 한 자리로 표시하므로 4:8:15 PM으로 표시됩니다."], "p": "2과목 › 데이터 입력·서식·참조 › 표시 형식 · 기출 25-06"},
{"id": "S2-024", "t": "01 입력·서식·참조", "q": "입력된 값이 10,000 이상일 때 ○만○○○○원으로 표시하고자 한다. 올바르게 지정된 셀 서식 형식은?\n표시 예 : 13546 → 1만3456원, 123 → 123원", "c": ["#\"만\"#\"원\"", "[>=10000]#\"만\"#\"원\";#\"원\"", "[<10000]#\"만\"####\"원\";#\"원\"", "[>=10000]#\"만\"####\"원\";#\"원\""], "a": 3, "e": "조건 [>=10000]일 때 #\"만\"####\"원\"으로 표시하고(13546 → 1만3546원), 그렇지 않으면 #\"원\"으로 표시합니다.", "tip": "조건부 서식 형식: [조건]서식;서식.", "w": ["조건 없이 '만'과 '원'만 붙이면 123도 '123만원'처럼 표시됩니다.", "'만' 뒤에 네 자리(####)가 없어 1만3546 형태를 만들 수 없습니다.", "조건이 반대로 [<10000]이어서 10000 이상일 때 형식이 맞지 않습니다.", ""], "p": "2과목 › 데이터 입력·서식·참조 › 표시 형식 · 기출 24-04, 25-05"},
{"id": "S2-025", "t": "01 입력·서식·참조", "q": "다음 중 셀 참조에 대한 설명으로 옳지 않은 것은?", "c": ["같은 통합 문서 내의 다른 시트의 셀은 참조할 수 있으나 다른 통합 문서의 셀은 참조할 수 없다.", "나누는 수가 빈 셀을 참조하고 있을 때는 #DIV/0! 라는 오류값이 표시된다.", "자주 사용하는 셀이나 셀의 범위에 이름을 지정하여 수식이나 함수에 활용할 수 있다.", "절대 참조 방식은 참조하는 셀의 위치에 상관없이 참조되는 셀의 위치가 고정되어 있는 방식이다."], "a": 0, "e": "다른 통합 문서의 셀도 [통합 문서이름]시트이름!셀주소 형식으로 참조할 수 있습니다.", "tip": "다른 통합 문서 = [파일명] 형식.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 셀 참조 · 기출 25-04"},
{"id": "S2-026", "t": "01 입력·서식·참조", "q": "다음 중 \"2020년 매출 실적\" 파일의 \"상품 재고\" 시트 [B2] 셀을 참조하려고 한다. 다음 중 옳은 것은?", "c": ["\"2020년 매출 실적\"상품 재고!B2", "'[2020년 매출 실적]상품 재고'!B2", "[2020년 매출 실적]상품 재고/B2", "\"2020년 매출 실적!상품 재고\"B2"], "a": 1, "e": "다른 통합 문서는 대괄호 [ ]로 파일 이름을 묶고, 시트 이름과 셀 주소는 느낌표(!)로 구분합니다. 공백이 있으면 전체를 작은따옴표로 묶습니다.", "tip": "'[파일]시트'!셀.", "w": ["큰따옴표로 묶는 방식은 쓰지 않습니다.", "", "시트와 셀은 슬래시(/)가 아닌 느낌표(!)로 구분합니다.", "큰따옴표 위치와 느낌표 위치가 모두 맞지 않습니다."], "p": "2과목 › 데이터 입력·서식·참조 › 외부 참조 · 기출 25-03, 25-05"},
{"id": "S2-027", "t": "01 입력·서식·참조", "q": "다음 중 참조의 대상 범위로 사용하는 이름에 대한 설명으로 옳은 것은?", "c": ["이름 정의 시 첫 글자는 반드시 숫자로 시작해야 한다.", "하나의 통합 문서 내에서 시트가 다르면 동일한 이름을 지정할 수 있다.", "이름 정의 시 영문자는 대소문자를 구분하므로 주의하여야 한다.", "이름은 기본적으로 절대 참조로 대상 범위를 참조한다."], "a": 3, "e": "이름은 기본적으로 절대 참조로 범위를 참조합니다.", "tip": "이름 = 절대 참조.", "w": ["이름의 첫 글자는 문자, 밑줄(_), 역슬래시(\\)로 시작해야 하며 숫자로 시작할 수 없습니다.", "같은 통합 문서 안에서는 시트가 달라도 동일한 이름을 중복해서 지정할 수 없습니다.", "이름은 대소문자를 구분하지 않습니다.", ""], "p": "2과목 › 데이터 입력·서식·참조 › 이름 정의 · 기출 24-02, 24-03, 25-01, 26-01", "h": 1},
{"id": "S2-028", "t": "01 입력·서식·참조", "q": "다음 중 참조의 대상 범위로 사용하는 이름 정의 시 이름의 지정 방법에 대한 설명으로 옳지 않은 것은?", "c": ["첫 문자는 반드시 문자나 밑줄( _ )로 시작해야 한다.", "이름에 공백을 포함할 수 없다.", "시트가 다르면 동일한 이름을 사용할 수 있다.", "대/소문자는 구분하지 않는다."], "a": 2, "e": "같은 통합 문서에서는 시트가 달라도 이름은 중복될 수 없습니다.", "tip": "이름은 통합 문서에서 유일.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 이름 정의 · 기출 26-02"},
{"id": "S2-029", "t": "01 입력·서식·참조", "q": "다음 중 셀 또는 셀 범위에 대한 이름 정의 시 구문 규칙에 대한 설명으로 옳은 것은?", "c": ["이름은 최대 255자까지 지정할 수 있다.", "이름의 첫 자는 반드시 문자나 밑줄(_) 또는 슬래시(/)로 시작해야 한다.", "이름의 일부로 공백을 사용할 수 있다.", "Excel에서는 이름의 대문자와 소문자를 구별한다."], "a": 0, "e": "이름은 최대 255자까지 지정할 수 있습니다.", "tip": "이름 최대 길이 255자.", "w": ["", "첫 자는 문자, 밑줄(_) 또는 역슬래시(\\)이며 슬래시(/)는 사용할 수 없습니다.", "공백은 이름에 사용할 수 없습니다.", "대문자와 소문자를 구분하지 않습니다."], "p": "2과목 › 데이터 입력·서식·참조 › 이름 정의 · 기출 24-01"},
{"id": "S2-030", "t": "01 입력·서식·참조", "q": "다음 중 [텍스트 나누기] 기능에 대한 설명으로 옳지 않은 것은?", "c": ["한 셀에 입력되어 있는 데이터를 여러 셀로 분리시킬 수 있다.", "텍스트 나누기 수행 시 데이터 형식의 변환 및 셀 서식 변경이 가능하다.", "열의 데이터 서식을 '일반'으로 지정하면 숫자 값은 숫자로, 날짜 값은 날짜로, 모든 나머지 값은 텍스트로 변환된다.", "탭, 세미콜론, 쉼표, 공백 등의 구분 기호가 기본으로 제공되며, 사용자가 원하는 한 가지만 선택할 수 있다."], "a": 3, "e": "구분 기호는 여러 개를 동시에 선택할 수 있고, 기타 문자를 직접 지정할 수도 있습니다.", "tip": "구분 기호는 복수 선택 가능.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 입력·서식·참조 › 텍스트 나누기 · 기출 25-02, 25-05"},
{"id": "S2-031", "t": "01 입력·서식·참조", "q": "다음 시트에서 [A1] 셀에 있는 텍스트를 쉼표(,)를 기준으로 [A1:D1] 영역에 분리하여 표시하려고 할 때 사용할 적합한 기능은? (A1 셀: 서울,1,국어,2008)", "c": ["레코드 관리", "텍스트 나누기", "자동 개요", "유효성 검사"], "a": 1, "e": "한 셀의 텍스트를 구분 기호(쉼표 등)를 기준으로 여러 셀로 나누는 기능은 [텍스트 나누기]입니다.", "tip": "구분 기호로 분리 = 텍스트 나누기.", "w": ["레코드 관리는 데이터 목록의 레코드를 다루는 기능입니다.", "", "자동 개요는 데이터 그룹에 개요 기호를 설정하는 기능입니다.", "유효성 검사는 입력 가능한 값의 범위를 제한하는 기능입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 텍스트 나누기 · 기출 25-04"},
{"id": "S2-032", "t": "02 수식·함수", "q": "아래 워크시트에서 [B2:D6] 영역을 참조하여 [C8] 셀에 표시된 바코드에 대한 단가를 [C9] 셀에 표시하였다. 다음 중 [C9] 셀의 수식으로 옳은 것은?\nB1:D1 = 바코드, 상품명, 단가 / B2:D6 = (351, CD, 1000), (352, 칫솔, 1500), (353, 치약, 2500), (354, 종이쪽, 800), (355, 케이스, 1100) / C8 = 352", "c": ["=VLOOKUP(C8, $B$2:$D$6, 3, 0)", "=HLOOKUP(C8, $B$2:$D$6, 3, 0)", "=VLOOKUP($B$1:$D$6, C8, 3, 1)", "=HLOOKUP($B$1:$D$6, C8, 3, 1)"], "a": 0, "e": "바코드가 범위의 첫 열에 세로로 나열되어 있으므로 VLOOKUP을 쓰고, 단가는 3번째 열, 정확히 일치하는 값이므로 옵션은 0(FALSE)입니다.", "tip": "세로 표 = VLOOKUP, 정확히 = 0.", "w": ["", "HLOOKUP은 첫 행에서 찾는 함수라 세로로 나열된 표에는 맞지 않습니다.", "인수 순서가 틀렸습니다(찾을값, 범위, 열 번호, 옵션 순).", "인수 순서가 틀리고 HLOOKUP을 사용했습니다."], "p": "2과목 › 수식·함수 › VLOOKUP · 기출 25-06, 26-03"},
{"id": "S2-033", "t": "02 수식·함수", "q": "다음 중 [C10] 셀에 판매량이 판매량 평균 이상인 지점의 개수를 구하는 수식으로 올바른 것은? (판매량 C2:C8 = 125, 85, 94, 108, 75, 12, 98)", "c": ["=COUNTIF(C2:C8, \">=\"&AVERAGE($C$2:$C$8))", "=COUNTIF(\">=\"&AVERAGE($C$2:$C$8))", "=COUNTIF(C2:C8, \">=AVERAGE($C$2:$C$8)\")", "=COUNTIF(\">=\"&AVERAGE($C$2:$C$8), C2:C8)"], "a": 0, "e": "COUNTIF(범위, 조건)에서 조건에 함수 결과를 사용할 때는 \">=\"&AVERAGE(범위)처럼 연산자와 &로 연결합니다. 평균 85.28 이상은 4개입니다.", "tip": "조건식 = \">=\"&함수().", "w": ["", "범위 인수가 없습니다.", "함수를 큰따옴표 안에 넣으면 문자열로 인식되어 함수가 계산되지 않습니다.", "인수 순서가 반대입니다(범위, 조건 순)."], "p": "2과목 › 수식·함수 › COUNTIF · 기출 24-01, 25-03, 26-03", "h": 1},
{"id": "S2-034", "t": "02 수식·함수", "q": "다음 중 평균 매출량을 초과하는 지점의 개수를 구하는 수식으로 알맞은 것은? (매출량 B2:B6)", "c": ["=COUNTIF(\">\"&AVERAGE(B2:B6))", "=COUNTIF(B2:B6, \">\"&AVERAGE(B2:B6))", "=COUNTIF(\">\"&AVERAGE(B2:B6), B2:B6)", "=COUNTIF(B2:B6, \">AVERAGE(B2:B6)\")"], "a": 1, "e": "범위를 먼저, 조건을 나중에 쓰며 조건은 \">\"&AVERAGE(...) 형태로 연결합니다.", "tip": "범위 → 조건 순서.", "w": ["범위 인수가 빠졌습니다.", "", "인수 순서가 반대입니다.", "함수가 문자열 안에 들어 있어 계산되지 않습니다."], "p": "2과목 › 수식·함수 › COUNTIF · 기출 24-04, 26-01"},
{"id": "S2-035", "t": "02 수식·함수", "q": "다음 중 환자번호[C2:C5]를 이용하여 성별[D2:D5]을 표시하기 위해 [D2] 셀에 입력할 수식으로 옳지 않은 것은? (단, 환자번호의 4번째 문자가 'M'이면 '남', 'F'이면 '여'임. 코드표 [A8:B9] = M-남, F-여)", "c": ["=IF(MID(C2, 4, 1)=\"M\", \"남\", \"여\")", "=INDEX($A$8:$B$9, MATCH(MID(C2, 4, 1), $A$8:$A$9, 0), 2)", "=VLOOKUP(MID(C2, 4, 1), $A$8:$B$9, 2, FALSE)", "=IFERROR(IF(SEARCH(C2, \"M\"), \"남\"), \"여\")"], "a": 3, "e": "SEARCH의 인수 순서가 틀렸습니다. SEARCH(찾을 텍스트, 문자열)이므로 SEARCH(\"M\", C2)로 써야 합니다. 현재 수식은 오류가 나 항상 '여'가 표시됩니다.", "tip": "SEARCH(찾을것, 대상).", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 수식·함수 › IF·MID 함수 · 기출 26-03"},
{"id": "S2-036", "t": "02 수식·함수", "q": "그림과 같이 D4 셀에 올해 1월 대비 재고비용의 증감률을 표시하고자 한다. 다음 중 바르게 입력된 수식은 어느 것인가? (단, 전년 1월 재고비용은 '1월' 시트의 E4 셀에 위치하고 있다.)\n※ 증감률 = (올해 재고비용 - 작년 재고비용) / 작년 재고비용 × 100\n올해 재고비용은 C4 셀", "c": ["=(C4-[1월]!E4)/[1월]!E4*100", "=(C4-1월!E4)/1월!E4*100", "=(C4-[1월]!E4)/C4*100", "=(C4-1월!E4)/C4*100"], "a": 1, "e": "다른 시트의 셀은 시트이름!셀주소로 참조합니다. 대괄호 [ ]는 다른 통합 문서의 이름에 사용하며, 분모는 작년 재고비용(1월!E4)이어야 합니다.", "tip": "다른 시트 = 시트!셀, 다른 파일 = [파일].", "w": ["'1월'은 통합 문서 이름이 아니라 시트 이름이므로 대괄호를 쓰지 않습니다.", "", "분모가 작년 재고비용이 아니라 올해 재고비용입니다.", "분모가 올해 재고비용이어서 증감률 공식과 맞지 않습니다."], "p": "2과목 › 수식·함수 › 재고비용 증감률 · 기출 26-03"},
{"id": "S2-037", "t": "02 수식·함수", "q": "다음 중 함수식에 대한 결과가 옳은 것은?", "c": ["=COUNT(1, \"참\", TRUE, \"1\") → 1", "=COUNTA(1, \"거짓\", TRUE, \"1\") → 2", "=MAX(TRUE, \"10\", 8, 3) → 10", "=ROUND(215.143, -2) → 215.14"], "a": 2, "e": "수식에 직접 쓴 논리값(TRUE=1)과 숫자 텍스트(\"10\"=10)는 숫자로 계산되어 MAX는 10입니다.", "tip": "직접 입력한 TRUE·\"숫자\"는 계산에 포함.", "w": ["COUNT는 숫자·TRUE·\"1\"을 세어 3이 됩니다.", "COUNTA는 비어 있지 않은 4개를 모두 세어 4가 됩니다.", "", "ROUND(215.143, -2)는 200입니다."], "p": "2과목 › 수식·함수 › 함수 결과 · 기출 24-02"},
{"id": "S2-038", "t": "02 수식·함수", "q": "다음 중 함수식에 대한 결과가 옳지 않은 것은?", "c": ["=MOD(9, 2) → 1", "=COLUMN(C5) → 3", "=TRUNC(8.73) → 8", "=POWER(5, 3) → 15"], "a": 3, "e": "POWER(5, 3)은 5의 3제곱이므로 125입니다.", "tip": "POWER(a, b) = a의 b제곱.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 수식·함수 › 함수 결과 · 기출 24-03, 25-02"},
{"id": "S2-039", "t": "02 수식·함수", "q": "다음 중 수식의 실행 결과가 옳은 것은?", "c": ["=MOD(-7, 4) ⇒ -3", "=POWER(2, 3) ⇒ 9", "=INT(-7.4) ⇒ -8", "=TRUNC(-8.6) ⇒ -7"], "a": 2, "e": "INT는 소수점 이하를 버려 가장 가까운 작은 정수로 내림하므로 -7.4는 -8이 됩니다.", "tip": "INT(음수) = 더 작은 정수.", "w": ["MOD(-7, 4)는 1입니다.", "POWER(2, 3)은 8입니다.", "", "TRUNC(-8.6)은 -8입니다."], "p": "2과목 › 수식·함수 › 함수 결과 · 기출 25-04"},
{"id": "S2-040", "t": "02 수식·함수", "q": "다음 중 함수의 결과가 잘못된 것은?", "c": ["=ROUND(12.34, 1) → 12.4", "=LEFT(\"KOREA\", 2) → KO", "=MID(\"대한상공회의소\", 3, 2) → 상공", "=TRUNC(-8.6) → -8"], "a": 0, "e": "ROUND(12.34, 1)은 소수 둘째 자리에서 반올림하므로 12.3입니다.", "tip": "반올림 = 지정 자리 다음 숫자 기준.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 수식·함수 › 함수 결과 · 기출 24-04, 25-01"},
{"id": "S2-041", "t": "02 수식·함수", "q": "다음 수식의 결과가 나머지와 다른 것은?", "c": ["=LEFT(123.654, 6)", "=ROUND(123.654, 2)", "=ROUNDUP(123.654, 2)", "=ROUNDDOWN(123.654, 2)"], "a": 2, "e": "①은 123.65, ②는 123.65, ③은 올림하여 123.66, ④는 내림하여 123.65이므로 ③만 다릅니다.", "tip": "ROUNDUP = 올림.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 수식·함수 › 수식 결과 비교 · 기출 25-05, 26-02"},
{"id": "S2-042", "t": "02 수식·함수", "q": "다음과 같이 수식을 입력할 경우 결과로 표시되는 것은?\n=LEFT(MID(LOWER(\"GOOD MORNING\"), 3, 6), 2)", "c": ["GOOD", "GO", "od", "morn"], "a": 2, "e": "LOWER → \"good morning\", MID(…, 3, 6) → \"od mor\", LEFT(…, 2) → \"od\"입니다.", "tip": "안쪽 함수부터 차례로 계산.", "w": ["GOOD이 될 수 없는 계산입니다.", "GO는 소문자 변환 후 3번째부터 추출하므로 나올 수 없습니다.", "", "morn은 MID의 시작 위치·개수와 맞지 않습니다."], "p": "2과목 › 수식·함수 › LEFT·MID·LOWER · 기출 24-03, 25-04"},
{"id": "S2-043", "t": "02 수식·함수", "q": "아래 그림과 같이 '총점' 필드를 이용하여 순위[E2:E4]를 계산하였다. 다음 중 [E4] 셀의 수식으로 옳은 것은? (총점 D2:D4 = 160, 162, 183 / 순위 = 3, 2, 1)", "c": ["=RANK.EQ($D$4, $D$2:$D$4)", "=RANK.EQ($D$2:$D$4, D4)", "=RANK.EQ(D4, D2:D4)", "=RANK.EQ(D4, $D$2:$D$4)"], "a": 3, "e": "RANK.EQ(순위를 구할 값, 범위)에서 범위는 아래로 복사해도 변하지 않도록 절대 참조($D$2:$D$4)로 고정하고 값은 상대 참조(D4)로 둡니다.", "tip": "값 = 상대, 범위 = 절대.", "w": ["값까지 절대 참조라 모든 셀이 같은 순위를 구합니다.", "인수 순서가 반대입니다.", "범위가 상대 참조라 복사하면 범위가 어긋납니다.", ""], "p": "2과목 › 수식·함수 › RANK.EQ · 기출 24-01"},
{"id": "S2-044", "t": "02 수식·함수", "q": "아래 그림과 같이 '기록(초)' 필드를 이용하여 순위[C2:C5]를 계산하였다. 다음 중 [C2] 셀의 수식으로 옳은 것은? (기록 B2:B5 = 12, 15, 10, 11 / 순위 = 3, 4, 1, 2)", "c": ["=RANK.EQ(B1, $C$2:$C$5)", "=RANK.EQ(B2, $A$2:$A$5)", "=RANK.EQ(B2, $B$2:$B$5, 0)", "=RANK.EQ(B2, $B$2:$B$5, 1)"], "a": 3, "e": "기록이 작을수록 높은 순위이므로 오름차순(옵션 1)으로 순위를 구합니다.", "tip": "작은 값이 1등 = 옵션 1.", "w": ["값 위치와 범위가 모두 틀렸습니다.", "순위를 구할 값이 들어 있는 열(B)이 아닌 A열을 범위로 지정했습니다.", "옵션 0은 내림차순(큰 값이 1등)이므로 순위가 반대로 나옵니다.", ""], "p": "2과목 › 수식·함수 › RANK.EQ · 기출 26-02"},
{"id": "S2-045", "t": "02 수식·함수", "q": "다음 중 시스템의 현재 날짜에서 년도를 구하는 수식으로 가장 올바른 것은?", "c": ["=YEAR(DAY( ))", "=YEAR(DAYS( ))", "=YEAR(DATE( ))", "=YEAR(TODAY( ))"], "a": 3, "e": "TODAY()는 시스템의 오늘 날짜를 반환하므로 =YEAR(TODAY())로 현재 연도를 구합니다.", "tip": "오늘 날짜 = TODAY().", "w": ["DAY는 날짜에서 일을 추출하는 함수입니다.", "DAYS는 두 날짜 사이의 일수를 구하는 함수입니다.", "DATE는 연·월·일 값을 인수로 받아 날짜를 만드는 함수입니다.", ""], "p": "2과목 › 수식·함수 › TODAY·YEAR · 기출 26-02"},
{"id": "S2-046", "t": "02 수식·함수", "q": "[A1] 셀에 '851010-1234567'과 같이 주민등록번호가 입력되어 있을 때, 이 셀의 값을 이용하여 [B1] 셀에 성별을 '남' 또는 '여'로 표시하고자 한다. 다음 중 이를 위한 수식으로 옳은 것은? (단, 주민등록번호의 8번째 글자가 1이면 남자, 2이면 여자임)", "c": ["=CHOOSE(MID(A1, 8, 1), \"남\", \"여\")", "=HLOOKUP(A1, 8, B1)", "=INDEX(A1, B1, 8)", "=IF(RIGHT(A1, 8)=\"1\", \"남\", \"여\")"], "a": 0, "e": "MID(A1, 8, 1)로 8번째 글자를 추출하고, CHOOSE가 1이면 '남', 2이면 '여'를 반환합니다.", "tip": "CHOOSE(번호, 값1, 값2).", "w": ["", "HLOOKUP 인수 구성이 올바르지 않습니다.", "INDEX 인수 구성이 올바르지 않습니다.", "RIGHT(A1, 8)은 오른쪽 8글자를 추출하므로 '1'과 같을 수 없습니다."], "p": "2과목 › 수식·함수 › CHOOSE·MID · 기출 25-02"},
{"id": "S2-047", "t": "02 수식·함수", "q": "다음 중 아래 워크시트의 [A2] 셀에 수식을 작성하는 경우 수식의 결과가 다른 하나는? (A1 셀: 대한상공대학교)", "c": ["=MID(A1, SEARCH(\"대\", A1)+2, 5)", "=RIGHT(A1, LEN(A1)-2)", "=RIGHT(A1, FIND(\"대\", A1)+5)", "=MID(A1, FIND(\"대\", A1)+2, 5)"], "a": 2, "e": "①②④는 '상공대학교'이고, ③은 FIND(\"대\")가 1이므로 오른쪽 6글자인 '한상공대학교'가 되어 다릅니다.", "tip": "함수를 단계별로 계산해 비교.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 수식·함수 › 문자열 함수 · 기출 24-01"},
{"id": "S2-048", "t": "02 수식·함수", "q": "다음 중 입력한 수식에서 발생한 오류 메시지와 그 발생 원인으로 옳지 않은 것은?", "c": ["#VALUE! : 잘못된 인수나 피연산자를 사용했을 때", "#DIV/0! : 특정 값(셀)을 0 또는 빈 셀로 나누었을 때", "#NAME? : 함수 이름을 잘못 입력하거나 인식할 수 없는 텍스트를 수식에 사용했을 때", "#REF! : 숫자 인수가 필요한 함수에 다른 인수를 지정했을 때"], "a": 3, "e": "#REF!는 수식이 참조하는 셀이 삭제되거나 유효하지 않을 때 나타납니다. 숫자 인수 문제는 #VALUE!입니다.", "tip": "#REF! = 잘못된 셀 참조.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 수식·함수 › 오류 값 · 기출 25-06, 26-02"},
{"id": "S2-049", "t": "02 수식·함수", "q": "다음 중 수식에 잘못된 인수나 피연산자를 사용할 때 표시되는 오류 메시지로 옳은 것은?", "c": ["#NUM!", "#DIV/0!", "#NAME?", "#VALUE!"], "a": 3, "e": "잘못된 인수나 피연산자를 사용했을 때는 #VALUE! 오류가 표시됩니다.", "tip": "인수 형식 오류 = #VALUE!.", "w": ["#NUM!은 숫자 값이 잘못되었을 때 나타납니다.", "#DIV/0!은 0으로 나눌 때 나타납니다.", "#NAME?은 함수 이름이나 이름 정의를 인식할 수 없을 때 나타납니다.", ""], "p": "2과목 › 수식·함수 › 오류 값 · 기출 26-01"},
{"id": "S2-050", "t": "02 수식·함수", "q": "다음 중 수식이 =SUM(A3:A9)와 같이 범위 참조의 콜론(:)이 생략된 =SUM(A3A9)인 경우 나타나는 오류 메시지로 옳은 것은?", "c": ["#NULL!", "#N/A", "#NAME?", "#REF!"], "a": 2, "e": "A3A9는 올바른 셀 주소나 이름이 아니므로 인식할 수 없는 이름으로 판단하여 #NAME? 오류가 나타납니다.", "tip": "인식 불가한 텍스트 = #NAME?.", "w": ["#NULL!은 교차 연산자 사용 시 교차 지점이 없을 때 나타납니다.", "#N/A는 찾는 값이 없을 때 나타납니다.", "", "#REF!는 잘못된 셀 참조일 때 나타납니다."], "p": "2과목 › 수식·함수 › 오류 값 · 기출 25-02"},
{"id": "S2-051", "t": "02 수식·함수", "q": "다음 중 [D1] 셀에 입력된 수식 '=A$1+$B1'을 복사하여 [D3] 셀에 붙여넣을 경우 결과로 옳은 것은? (A1:C4 = 1행: 80, 60, 70 / 2행: 70, 90, 75 / 3행: 85, 70, 75 / 4행: 75, 77, 85)", "c": ["140", "170", "150", "157"], "a": 2, "e": "[D3]으로 복사하면 행 고정(A$1)은 그대로 A1(80)이고, 열 고정($B1)은 행만 바뀌어 $B3(70)이 되므로 80 + 70 = 150입니다.", "tip": "$가 붙은 쪽은 고정, 없는 쪽은 이동.", "w": ["[D1]에서의 결과입니다(80 + 60).", "$B1이 $B2(90)가 된 경우의 결과가 아닙니다.", "", "$B3이 아닌 다른 셀을 참조한 값입니다."], "p": "2과목 › 수식·함수 › 상대/혼합 참조 · 기출 25-03"},
{"id": "S2-052", "t": "02 수식·함수", "q": "'성적1' 필드와 '성적2' 필드의 값이 모두 90 이상이면 '진급여부' 필드에 \"진급\"을, 둘 중 하나만 90 이상이면 \"대기\", 나머지는 공백으로 표시하는 수식으로 옳은 것은?", "c": ["=IF(COUNTIFS(B2:C2, \">=90\")=1, \"진급\", IF(COUNTIFS(B2:C2, \">=90\")=2, \"대기\", \"\"))", "=IF(COUNTIF(B2:C2, \">=90\")=2, \"진급\", IF(COUNTIF(B2:C2, \">=90\")=1, \"대기\", \"\"))", "=IF(COUNTIFS(\">=90\", B2:C2)>=1, \"진급\", IF(COUNTIFS(\">=90\", B2:C2)=1, \"대기\", \"\"))", "=IF(COUNTIF(B2:C2, \">=90\")>=1, \"진급\", IF(COUNTIF(B2:C2, \">=90\")=1, \"대기\", \"\"))"], "a": 1, "e": "90 이상인 개수가 2이면 '진급', 1이면 '대기', 0이면 공백으로 처리하는 중첩 IF입니다.", "tip": "개수 2 = 진급, 1 = 대기.", "w": ["개수가 1이면 진급, 2이면 대기로 조건이 반대입니다.", "", "COUNTIFS 인수 순서(조건, 범위)가 반대이고 >=1을 진급 조건으로 사용했습니다.", "개수가 1 이상이면 진급이 되어 '대기' 조건에 도달하지 못합니다."], "p": "2과목 › 수식·함수 › 성적 판정 함수 · 기출 25-04, 25-06"},
{"id": "S2-053", "t": "02 수식·함수", "q": "아래 워크시트는 수량과 상품코드별 단가를 이용하여 금액을 산출한 것이다. 다음 중 [D2] 셀에 사용된 수식으로 옳은 것은? (단, 금액 = 수량 × 단가)\n매장 표: A2:D5 (매장명, 상품코드 B, 수량 C, 금액 D) / 단가표: B8:C10 (상품코드, 단가)", "c": ["=C2 * VLOOKUP(B2, $B$8:$C$10, 2)", "=C2 * VLOOKUP($B$8:$C$10, 2, B2, FALSE)", "=C2 * VLOOKUP(B2, $B$8:$C$10, 2, FALSE)", "=C2 * VLOOKUP($B$8:$C$10, 2, B2)"], "a": 2, "e": "단가표의 상품코드가 정렬되어 있지 않으므로 정확히 일치(FALSE)로 찾아야 합니다. 인수 순서는 (찾을값, 범위, 열 번호, 옵션)입니다.", "tip": "정렬 안 된 표 = FALSE(정확히 일치).", "w": ["옵션이 생략되어 근사값(TRUE)으로 찾으므로 정렬되지 않은 표에서 잘못된 값을 가져옵니다.", "인수 순서가 틀렸습니다.", "", "인수 순서가 틀렸고 옵션도 생략되었습니다."], "p": "2과목 › 수식·함수 › 상품별 금액 계산 · 기출 25-05"},
{"id": "S2-054", "t": "02 수식·함수", "q": "다음 중 아래의 워크시트를 참조하여 작성한 수식 '=VLOOKUP(LARGE(A2:A9, 4), A2:F9, 5, 0)'의 결과로 옳은 것은? (A열 번호 1~8, 5행: 한공주 78, 80, 88, 246 / 열 순서: 번호, 이름, 국어, 영어, 수학, 합계)", "c": ["90", "95", "88", "74"], "a": 2, "e": "LARGE(A2:A9, 4)는 4번째로 큰 번호인 5이고, 번호 5인 행(한공주)의 5번째 열(수학)은 88입니다.", "tip": "LARGE → VLOOKUP 순서로 계산.", "w": ["90은 이 행의 값이 아닙니다.", "95는 이 행의 값이 아닙니다.", "", "74는 다른 행의 값입니다."], "p": "2과목 › 수식·함수 › VLOOKUP·LARGE · 기출 24-02, 25-01"},
{"id": "S2-055", "t": "02 수식·함수", "q": "다음 중 조건부 서식을 이용하여 [A2:C5] 영역에 EXCEL과 ACCESS 점수의 합계가 170 이하인 행 전체에 셀 배경색을 지정하기 위한 수식으로 옳은 것은? (B열 EXCEL, C열 ACCESS)", "c": ["=B$2+C$2<=170", "=$B2+$C2<=170", "=B2+C2<=170", "=$B$2+$C$2<=170"], "a": 1, "e": "행 전체에 서식을 적용하려면 열은 고정($B, $C)하고 행은 상대 참조(2)로 두어야 합니다.", "tip": "행 전체 = 열만 절대.", "w": ["행이 고정(B$2)되어 모든 행이 2행 기준으로 판단됩니다.", "", "열이 고정되지 않아 오른쪽 셀로 갈수록 참조가 바뀝니다.", "모두 절대 참조라 모든 셀이 같은 값으로 판단됩니다."], "p": "2과목 › 수식·함수 › 조건부 서식 수식 · 기출 24-01, 26-03"},
{"id": "S2-056", "t": "02 수식·함수", "q": "다음 중 [A2:D5] 영역에 대해 성명이 '남'으로 시작하는 행 전체에 조건부 서식을 적용하는 수식으로 옳은 것은? (성명은 A열)", "c": ["=LEFT($A2, 1) = \"남\"", "=RIGHT($A2, 1) = \"남\"", "=MID(A2, 1, 1) = \"남\"", "=INDEX(A2:D5, 1, 1) = \"남\""], "a": 0, "e": "LEFT($A2, 1)로 성명의 첫 글자를 추출하고, 열은 고정($A)·행은 상대 참조로 하여 행 전체에 적용합니다.", "tip": "시작 글자 = LEFT.", "w": ["", "RIGHT는 마지막 글자를 추출합니다.", "열이 고정되지 않아 다른 열의 값을 판단하게 됩니다.", "INDEX(A2:D5, 1, 1)은 항상 A2 셀만 가리킵니다."], "p": "2과목 › 수식·함수 › 조건부 서식 수식 · 기출 24-02"},
{"id": "S2-057", "t": "01 입력·서식·참조", "q": "다음 중 데이터가 입력된 셀에서 [Delete]를 눌렀을 때의 상황에 대한 설명으로 옳지 않은 것은?", "c": ["셀에 설정된 노트는 지워지지 않는다.", "셀에 설정된 내용과 서식이 함께 지워진다.", "[홈] → [편집] → [지우기] → [내용 지우기]를 실행한 것과 동일한 결과가 발생한다.", "바로 가기 메뉴에서 [내용 지우기]를 실행한 것과 동일한 결과가 발생한다."], "a": 1, "e": "[Delete]는 셀의 내용만 지우고 서식은 그대로 유지합니다.", "tip": "Delete = 내용만 삭제.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 내용 지우기 · 기출 24-03, 26-01, 26-03", "h": 1},
{"id": "S2-058", "t": "01 입력·서식·참조", "q": "다음 중 아래 시트에서 [C2:C5] 영역에 수행한 결과가 다르게 나타나는 것은? (C2:C5 영역이 선택된 상태)", "c": ["키보드의 [Backspace]를 누른다.", "마우스의 오른쪽 버튼을 눌러서 나온 바로 가기 메뉴에서 [내용 지우기]를 선택한다.", "[홈] → [편집] → [지우기] 메뉴에서 [내용 지우기]를 선택한다.", "키보드의 [Delete]를 누른다."], "a": 0, "e": "[Backspace]는 선택 영역 중 활성 셀의 내용만 지우고 편집 상태가 됩니다. 나머지는 선택 영역 전체의 내용을 지웁니다.", "tip": "Backspace = 활성 셀만.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 내용 지우기 · 기출 24-02"},
{"id": "S2-059", "t": "03 데이터 관리·분석", "q": "다음 중 정렬에 대한 설명으로 옳은 것은?", "c": ["최대 24개의 열을 기준으로 정렬할 수 있다.", "글꼴 색을 기준으로 정렬할 수 있다.", "정렬 대상 범위에 병합된 셀이 포함되어 있어도 정렬할 수 있다.", "숨겨진 행은 정렬 결과에 포함되나 숨겨진 열은 정렬 결과에 포함되지 않는다."], "a": 1, "e": "정렬 기준으로 셀 색, 글꼴 색, 조건부 서식 아이콘을 사용할 수 있습니다.", "tip": "정렬 기준: 값·셀 색·글꼴 색·아이콘.", "w": ["최대 64개의 열을 기준으로 정렬할 수 있습니다.", "", "병합된 셀의 크기가 서로 다르면 정렬할 수 없습니다.", "숨겨진 행과 열은 모두 정렬에 포함되지 않습니다."], "p": "2과목 › 데이터 관리·분석 › 정렬 · 기출 24-03, 25-03, 25-05", "h": 1},
{"id": "S2-060", "t": "03 데이터 관리·분석", "q": "다음 중 데이터 정렬에 대한 설명으로 옳지 않은 것은?", "c": ["사용자 지정 목록을 사용하면 사용자가 정의한 순서대로 정렬할 수 있다.", "색상별 정렬이 가능하여 글꼴 색 또는 셀 색을 기준으로 정렬할 수도 있다.", "정렬 옵션을 이용하면 데이터를 열 방향 또는 행 방향으로 선택하여 정렬할 수 있다.", "표에 병합된 셀들이 포함되어 있는 경우 병합된 셀들은 맨 아래쪽으로 정렬된다."], "a": 3, "e": "병합된 셀이 포함되어 있고 셀 크기가 서로 다르면 정렬 자체가 되지 않습니다.", "tip": "병합 셀 = 정렬 제한.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 관리·분석 › 정렬 · 기출 24-04, 25-04"},
{"id": "S2-061", "t": "03 데이터 관리·분석", "q": "다음 중 정렬에 관한 설명으로 옳지 않은 것은?", "c": ["특정 글꼴 색이 적용된 셀을 포함한 행이 위에 표시되도록 정렬할 수 있다.", "사용자 지정 목록을 사용하여 사용자가 정의한 순서대로 정렬할 수 있다.", "최대 64개의 열을 기준으로 정렬할 수 있다.", "위쪽에서 아래쪽으로 정렬 시 숨겨진 행도 포함하여 정렬할 수 있다."], "a": 3, "e": "숨겨진 행이나 열은 정렬에 포함되지 않습니다.", "tip": "숨겨진 행·열은 정렬 제외.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 관리·분석 › 정렬 · 기출 24-01"},
{"id": "S2-062", "t": "03 데이터 관리·분석", "q": "다음 중 필터에 대한 설명으로 옳지 않은 것은?", "c": ["필터 기능을 이용하면 워크시트에 입력된 자료들 중 특정한 조건에 맞는 자료들만을 워크시트에 표시할 수 있다.", "자동 필터에서 여러 필드에 조건을 지정하는 경우 각 조건들은 AND 조건으로 설정된다.", "고급 필터를 실행하는 경우 조건을 만족하는 데이터를 다른 곳에 추출할 수 있다.", "고급 필터가 적용된 결과표를 정렬할 경우 숨겨진 레코드도 정렬에 포함된다."], "a": 3, "e": "정렬 시 숨겨진 행(고급 필터로 숨겨진 레코드 포함)은 정렬에 포함되지 않습니다.", "tip": "숨겨진 레코드는 정렬 제외.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 관리·분석 › 필터 · 기출 25-04, 26-03"},
{"id": "S2-063", "t": "03 데이터 관리·분석", "q": "다음 중 데이터 관리 기능인 자동 필터에 대한 설명으로 옳지 않은 것은?", "c": ["자동 필터는 데이터 영역에 표시되는 목록 단추를 이용하여 쉽고 빠르게 데이터를 추출할 수 있다.", "필터는 필요한 데이터 추출을 위해 조건을 만족하지 않는 데이터를 잠시 숨기는 것이므로 목록 자체의 내용은 변경되지 않는다.", "자동 필터를 사용하여 추출한 데이터는 레코드(행) 단위로 표시된다.", "여러 필드를 대상으로 조건을 지정할 수 없다."], "a": 3, "e": "여러 필드에 조건을 지정할 수 있으며, 이때 각 조건은 AND로 결합됩니다.", "tip": "자동 필터 여러 필드 = AND.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 관리·분석 › 자동 필터 · 기출 24-02, 26-01"},
{"id": "S2-064", "t": "03 데이터 관리·분석", "q": "다음 중 자동 필터에 대한 설명으로 옳지 않은 것은?", "c": ["자동 필터에서 여러 필드에 조건을 지정하는 경우 각 조건들은 AND 조건으로 설정된다.", "정렬 시 영문 대·소문자를 구분한다.", "자동 필터된 데이터만 선택하여 복사할 수 있다.", "필터링된 데이터 그대로 복사, 찾기, 편집, 인쇄 등의 작업을 수행할 수 있다."], "a": 1, "e": "정렬은 기본적으로 영문 대·소문자를 구분하지 않으며 [정렬 옵션]에서 지정해야 구분합니다.", "tip": "대/소문자 구분은 옵션 설정 시에만.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 관리·분석 › 자동 필터 · 기출 25-06"},
{"id": "S2-065", "t": "03 데이터 관리·분석", "q": "다음 중 아래와 같이 조건을 설정한 고급 필터의 실행 결과에 대한 설명으로 옳은 것은?\n조건 범위 : 소속 열에 <>영업팀, 근무경력 열에 >=30 (같은 행)", "c": ["소속이 '영업팀'이 아니면서 근무경력이 30년 이상인 사원 정보", "소속이 '영업팀'이면서 근무경력이 30년 이상인 사원 정보", "소속이 '영업팀'이 아니거나 근무경력이 30년 이상인 사원 정보", "소속이 '영업팀'이거나 근무경력이 30년 이상인 사원 정보"], "a": 0, "e": "같은 행에 쓴 조건은 AND이고, <>영업팀은 '영업팀이 아닌'이라는 뜻이므로 ①이 됩니다.", "tip": "같은 행 = AND, 다른 행 = OR.", "w": ["", "<>는 '같지 않다'이므로 영업팀인 사원이 아닙니다.", "같은 행에 입력한 조건은 AND로 결합됩니다(OR가 아님).", "같은 행에 입력한 조건은 AND로 결합되며 <>영업팀은 영업팀이 아닌 경우입니다."], "p": "2과목 › 데이터 관리·분석 › 고급 필터 · 기출 24-01, 24-04, 25-01", "h": 1},
{"id": "S2-066", "t": "03 데이터 관리·분석", "q": "다음과 같이 고급 필터를 수행했을 때 추출되는 이름이 아닌 것은?\n데이터(이름 / 직급 / 근무년수) : 김소리 과장 15, 박진정 대리 20, 최향진 부장 25, 유민정 대리 17, 성인호 차장 15\n조건 : 1행 이름 '김*' / 2행 직급 '대리', 근무년수 '<=20'", "c": ["김소리", "박진정", "유민정", "성인호"], "a": 3, "e": "조건이 서로 다른 행이라 OR입니다. 이름이 '김*'이거나 (직급이 대리이면서 근무년수 20 이하)인 행이 추출됩니다. 성인호(차장, 15)는 둘 다 해당하지 않습니다.", "tip": "다른 행 = OR 조건.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 관리·분석 › 고급 필터 · 기출 24-03, 25-05"},
{"id": "S2-067", "t": "03 데이터 관리·분석", "q": "고급 필터에서 다음과 같은 조건을 적용하였을 때 선택되는 데이터로 올바른 것은?\n조건 : 1행 제품명 '냉장고', 금액 '<650000' / 2행 수량 '>5'", "c": ["제품명이 냉장고이고 금액이 650000 미만인 제품과 수량이 6 이상인 제품", "금액이 650000 미만이고 수량이 5 이상인 제품", "제품명이 냉장고이거나 금액이 650000 미만인 제품이면서 수량은 6 이상인 제품", "수량은 5 이상이며 제품명이 냉장고이거나 금액이 650000 이상인 제품"], "a": 0, "e": "(제품명 = 냉장고 AND 금액 < 650000) OR (수량 > 5)입니다. 수량 > 5는 6 이상입니다.", "tip": "한 행 AND, 행 사이 OR.", "w": ["", "두 행의 조건은 AND가 아니라 OR이며 수량은 5 초과(6 이상)입니다.", "제품명·금액 조건과 수량 조건은 서로 다른 행이므로 OR로 묶입니다.", "수량 조건이 별도 행이라 AND가 아니며 금액 조건도 '이상'이 아닙니다."], "p": "2과목 › 데이터 관리·분석 › 고급 필터 · 기출 25-03"},
{"id": "S2-068", "t": "03 데이터 관리·분석", "q": "다음 중 아래와 같이 조건을 설정한 고급 필터의 실행 결과로 추출되는 행으로 옳은 것은?\n데이터(이름 / 직책 / 경력 / 부서 / TOEIC) : 3행 김상공 대리 4 마케팅 460, 4행 이한국 대리 2 관리 450, 5행 박대한 사원 3 기획 540\n조건 : 1행 직책 '대리', 경력 '>=4' / 2행 TOEIC '>=500', TOEIC '<700'", "c": ["3행", "3, 5행", "4, 5행", "3, 4, 5행"], "a": 1, "e": "(직책 = 대리 AND 경력 >= 4) OR (TOEIC >= 500 AND TOEIC < 700)이므로 김상공(3행)과 박대한(5행, TOEIC 540)이 추출됩니다.", "tip": "행 안은 AND, 행끼리는 OR.", "w": ["박대한(TOEIC 540)도 두 번째 행 조건을 만족해 추출됩니다.", "", "이한국은 경력 2이고 TOEIC 450이라 두 조건 모두 만족하지 않아 제외됩니다.", "이한국은 경력 2이고 TOEIC 450이라 제외됩니다."], "p": "2과목 › 데이터 관리·분석 › 고급 필터 · 기출 26-02"},
{"id": "S2-069", "t": "03 데이터 관리·분석", "q": "다음 중 아래 그림의 표에서 조건 범위로 [A9:B11] 영역을 선택하여 고급 필터를 실행한 결과의 레코드 수는 얼마인가?\n데이터(성명 / 이론 / 실기 / 합계) : 김진아 47 45 92, 이은경 38 47 85, 장영주 46 48 94, 김시내 35 30 65, 홍길동 49 48 97, 박승수 37 43 80\n조건 범위 [A9:B11] : 10행 합계 '<96', 합계 '>90' / 11행 합계 '<70'", "c": ["0", "3", "4", "6"], "a": 1, "e": "(합계 < 96 AND 합계 > 90)은 92, 94의 2명, 합계 < 70은 65의 1명이므로 모두 3개입니다.", "tip": "한 행 AND(2명) + 다른 행 OR(1명).", "w": ["조건을 만족하는 레코드가 있으므로 0이 될 수 없습니다.", "", "(합계 90 초과 96 미만 = 92, 94) + (합계 70 미만 = 65)로 3개이며 4개는 아닙니다.", "6은 전체 레코드 수이며 조건에 맞지 않는 85, 80까지 포함한 값입니다."], "p": "2과목 › 데이터 관리·분석 › 고급 필터 · 기출 26-01"},
{"id": "S2-070", "t": "03 데이터 관리·분석", "q": "다음 중 부분합에 대한 설명으로 옳지 않은 것은?", "c": ["부분합을 실행하면 각 부분합에 대한 정보 행을 표시하고 숨길 수 있도록 목록에 윤곽이 자동으로 설정된다.", "부분합은 한번에 한 개의 함수만 계산할 수 있으므로 두 개 이상의 함수를 이용하려면 함수의 개수만큼 부분합을 중첩해서 삽입해야 한다.", "'새로운 값으로 대치'를 선택하면 이전의 부분합의 결과는 제거되고 새로운 부분합의 결과로 변경한다.", "그룹화할 항목으로 선택된 필드는 자동으로 오름차순 정렬하여 부분합이 계산된다."], "a": 3, "e": "부분합은 자동 정렬되지 않으므로 그룹화할 필드를 미리 정렬한 후 실행해야 합니다.", "tip": "부분합 전 정렬은 직접.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 관리·분석 › 부분합 · 기출 24-02, 24-04, 25-03", "h": 1},
{"id": "S2-071", "t": "03 데이터 관리·분석", "q": "다음 중 이미 부분합이 계산되어 있는 상태에서 새로운 부분합을 추가하고자 할 때 수행해야 할 작업으로 옳은 것은?", "c": ["[모두 제거] 단추를 클릭", "'새로운 값으로 대치' 설정을 해제", "'그룹 사이에 페이지 나누기'를 설정", "'데이터 아래에 요약 표시' 설정을 해제"], "a": 1, "e": "기존 부분합을 유지하면서 추가하려면 '새로운 값으로 대치'를 해제합니다.", "tip": "추가 = '새로운 값으로 대치' 해제.", "w": ["[모두 제거]를 누르면 기존 부분합이 모두 삭제됩니다.", "", "그룹 사이 페이지 나누기는 인쇄용 설정입니다.", "요약 행의 위치만 바뀔 뿐 부분합이 추가되지 않습니다."], "p": "2과목 › 데이터 관리·분석 › 부분합 · 기출 24-01, 26-01"},
{"id": "S2-072", "t": "03 데이터 관리·분석", "q": "다음 중 [부분합] 대화상자의 각 항목 설정에 대한 설명으로 옳지 않은 것은?", "c": ["'그룹화할 항목'에서 선택할 필드를 기준으로 미리 오름차순 또는 내림차순으로 정렬한 후 부분합을 실행해야 한다.", "부분합 실행 전 상태로 되돌리려면 부분합 대화상자의 [모두 제거] 단추를 클릭한다.", "세부 정보가 있는 행 아래에 요약 행을 지정하려면 '데이터 아래에 요약 표시'를 선택하여 체크 표시한다.", "이미 작성된 부분합을 유지하면서 부분합 계산 항목을 추가할 경우에는 '새로운 값으로 대치'를 선택하여 체크한다."], "a": 3, "e": "부분합을 유지하며 추가하려면 '새로운 값으로 대치'를 해제해야 합니다. 체크하면 기존 부분합이 대치됩니다.", "tip": "유지하며 추가 = 대치 해제.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 관리·분석 › 부분합 · 기출 25-01"},
{"id": "S2-073", "t": "03 데이터 관리·분석", "q": "다음 중 데이터 통합에 대한 설명으로 옳지 않은 것은?", "c": ["참조 영역은 최대 3개까지만 추가가 가능하다.", "지정한 영역에 계산될 요약 함수는 '함수'에서 선택하며, 요약 함수로는 합계, 개수, 평균, 최대, 최소 등이 있다.", "통합할 여러 데이터의 순서와 위치가 동일할 경우 위치를 기준으로 통합할 수 있다.", "사용할 데이터의 형태가 다르더라도 같은 이름표를 사용하면 항목을 기준으로 통합할 수 있다."], "a": 0, "e": "통합할 참조 영역의 개수는 기본적으로 제한이 없습니다(메모리 한도 내).", "tip": "참조 영역 개수 제한 없음.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 관리·분석 › 데이터 통합 · 기출 25-02, 25-04, 26-03", "h": 1},
{"id": "S2-074", "t": "03 데이터 관리·분석", "q": "다음 중 데이터 통합에 관한 설명으로 옳지 않은 것은?", "c": ["데이터 통합은 위치를 기준으로 통합할 수도 있고, 영역의 이름을 정의하여 통합할 수도 있다.", "'원본 데이터에 연결' 기능은 통합할 데이터가 있는 워크시트와 통합 결과가 작성될 워크시트가 같은 통합 문서에 있는 경우에만 적용할 수 있다.", "다른 원본 영역의 레이블과 일치하지 않는 레이블이 있는 경우에 통합하면 별도의 행이나 열이 만들어진다.", "여러 시트에 있는 데이터나 다른 통합 문서에 입력되어 있는 데이터를 통합할 수 있다."], "a": 1, "e": "'원본 데이터에 연결'은 원본과 결과가 서로 다른 워크시트에 있을 때 사용할 수 있으며, 다른 통합 문서의 데이터와도 연결할 수 있습니다.", "tip": "원본 연결은 다른 통합 문서도 가능.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 관리·분석 › 데이터 통합 · 기출 24-04, 25-03, 25-05, 25-06, 26-02", "h": 1},
{"id": "S2-075", "t": "03 데이터 관리·분석", "q": "다음 중 피벗 테이블에 대한 설명으로 옳지 않은 것은?", "c": ["원본의 자료가 변경되면 [모두 새로 고침] 기능을 이용하여 피벗 테이블에 반영할 수 있다.", "작성된 피벗 테이블을 삭제하면 함께 작성한 피벗 차트도 삭제된다.", "피벗 테이블을 삭제하려면 피벗 테이블 전체를 범위로 지정하고 [Delete]를 누른다.", "피벗 테이블 보고서에서는 값 영역에 표시된 데이터를 삭제하거나 수정할 수 없다."], "a": 1, "e": "피벗 테이블을 삭제하면 피벗 차트는 삭제되지 않고 일반 차트로 변경됩니다.", "tip": "피벗 삭제 → 피벗 차트는 일반 차트로.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 관리·분석 › 피벗 테이블 · 기출 24-02, 24-03, 25-01, 26-03", "h": 1},
{"id": "S2-076", "t": "03 데이터 관리·분석", "q": "다음 중 피벗 테이블에 대한 설명으로 옳지 않은 것은?", "c": ["값 영역의 특정 항목을 마우스로 더블클릭하면 해당 데이터에 대한 세부적인 데이터가 새로운 시트에 표시된다.", "데이터 그룹 수준을 확장하거나 축소해서 요약 정보만 표시할 수도 있고 요약된 내용의 세부 데이터를 표시할 수도 있다.", "행을 열로 또는 열을 행으로 이동하여 원본 데이터를 다양한 방식으로 요약하여 표시할 수 있다.", "피벗 테이블과 피벗 차트를 함께 만든 후에 피벗 테이블을 삭제하면 피벗 차트도 자동으로 삭제된다."], "a": 3, "e": "피벗 테이블을 삭제하면 피벗 차트는 일반 차트로 변경될 뿐 자동으로 삭제되지 않습니다.", "tip": "피벗 차트는 일반 차트로 남는다.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 관리·분석 › 피벗 테이블 · 기출 24-04, 25-02, 25-04", "h": 1},
{"id": "S2-077", "t": "03 데이터 관리·분석", "q": "다음 중 피벗 테이블에 대한 설명으로 옳지 않은 것은?", "c": ["원본 데이터가 변경되면 피벗 테이블의 데이터도 자동으로 변경된다.", "외부 데이터를 대상으로 피벗 테이블을 작성할 수 있다.", "피벗 테이블을 작성한 후에 사용자가 새로운 수식을 추가하여 표시할 수 있다.", "많은 양의 자료를 분석하여 다양한 형태로 요약하여 보여주는 기능이다."], "a": 0, "e": "원본이 변경되어도 피벗 테이블은 자동 갱신되지 않으며 [새로 고침]을 실행해야 반영됩니다.", "tip": "원본 변경 후 새로 고침 필요.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 관리·분석 › 피벗 테이블 · 기출 25-05, 26-01"},
{"id": "S2-078", "t": "03 데이터 관리·분석", "q": "다음 중 아래 그림과 같이 목표값 찾기를 설정했을 때, 이에 대한 의미로 옳은 것은?\n제품별 판매현황 : 노트북 B4 = 60, 프린터 C4 = 35, 스캐너 D4 = 15, 평균 E4 = 36.67 (평균 수식)\n목표값 찾기 : 수식 셀 $E$4, 찾는 값 40, 값을 바꿀 셀 $B$4", "c": ["평균이 40이 되려면 노트북 판매량이 얼마가 되어야 하는가?", "노트북 판매량이 40이 되려면 평균이 얼마가 되어야 하는가?", "노트북 판매량을 40으로 변경하였을 때 평균은 얼마가 되어야 하는가?", "평균이 40이 되려면 노트북을 제외한 나머지 제품의 판매량이 얼마가 되어야 하는가?"], "a": 0, "e": "수식 셀(E4 평균)이 찾는 값(40)이 되도록 값을 바꿀 셀(B4 노트북)을 조정합니다.", "tip": "수식 셀 → 목표, 바꿀 셀 → 조정 대상.", "w": ["", "목표값 찾기는 바꿀 셀이 아니라 수식 셀의 결과를 목표로 합니다.", "바꿀 셀 값을 40으로 고정하는 기능이 아닙니다.", "조정 대상은 노트북(B4)만이며 나머지 제품은 바뀌지 않습니다."], "p": "2과목 › 데이터 관리·분석 › 목표값 찾기 · 기출 24-02, 26-03"},
{"id": "S2-079", "t": "03 데이터 관리·분석", "q": "상품 가격이 2,500원짜리인 물건에 대하여 총 판매액이 1,500,000원이 되게 하기 위해서는 판매수량이 얼마나 되어야 하는지 알아보기 위해 사용되는 유용한 기능은?", "c": ["고급 필터", "피벗 테이블", "목표값 찾기", "시나리오"], "a": 2, "e": "결과값(총 판매액)을 정해 놓고 그에 필요한 입력값(판매수량)을 역으로 찾는 기능은 목표값 찾기입니다.", "tip": "결과 → 입력값 역산 = 목표값 찾기.", "w": ["조건에 맞는 데이터를 추출하는 기능입니다.", "데이터를 요약·분석하는 보고서 기능입니다.", "", "여러 입력값 조합의 결과를 저장·비교하는 기능입니다."], "p": "2과목 › 데이터 관리·분석 › 목표값 찾기 · 기출 25-05, 26-02"},
{"id": "S2-080", "t": "03 데이터 관리·분석", "q": "다음 중 시나리오에 관한 설명으로 옳지 않은 것은?", "c": ["하나의 시나리오에 변경 셀을 최대 32개까지 지정할 수 있다.", "요약 보고서나 피벗 테이블 보고서로 시나리오 결과를 작성할 수 있다.", "시나리오 병합을 통하여 다른 통합 문서나 다른 워크시트에 저장된 시나리오를 가져올 수 있다.", "입력된 자료들을 그룹별로 분류하고, 해당 그룹별로 원하는 함수를 이용한 계산 결과를 볼 수 있다."], "a": 3, "e": "그룹별로 분류하여 함수 계산 결과를 보는 기능은 부분합입니다.", "tip": "그룹별 계산 = 부분합.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 관리·분석 › 시나리오 · 기출 25-01, 25-06"},
{"id": "S2-081", "t": "03 데이터 관리·분석", "q": "다음 중 아래 그림의 시나리오 요약 보고서에 대한 설명으로 옳지 않은 것은?\n시나리오 요약 (현재 값 / 초과 / 미만) : 변경 셀 - 달성률 110% / 150% / 75%, 계약금 3,500,000 / 4,300,000 / 2,700,000 / 결과 셀 - 지불금액 5,850,000 / 8,450,000 / 4,025,000", "c": ["'초과'와 '미만' 시나리오에 대한 시나리오 요약 보고서이다.", "'달성률'과 '계약금'의 변화에 따른 '지불금액'의 값을 확인할 수 있다.", "'달성률'과 '계약금'이 이름 정의 되었음을 알 수 있다.", "'지불금액'은 '달성률'과 '계약금'을 참조하는 수식으로 작성되지 않아야 한다."], "a": 3, "e": "결과 셀(지불금액)은 변경 셀(달성률, 계약금)을 참조하는 수식으로 작성되어야 변경에 따른 결과를 볼 수 있습니다.", "tip": "결과 셀 = 변경 셀을 참조하는 수식.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 관리·분석 › 시나리오 요약 · 기출 25-04, 26-03"},
{"id": "S2-082", "t": "03 데이터 관리·분석", "q": "다음 중 [시나리오 추가] 대화상자에 대한 설명으로 옳지 않은 것은?", "c": ["[데이터] → [예측] → [가상 분석] → [시나리오 관리자] 대화상자에서 [추가] 단추를 클릭하면 표시되는 대화상자이다.", "변경 셀을 미리 선택한 후 [시나리오 추가] 대화상자를 열면 셀 주소가 자동으로 입력된다.", "'설명'은 시나리오에 대한 추가적인 설명으로 반드시 입력할 필요는 없다.", "시트 보호가 지정된 경우 시나리오가 표시되지 않도록 하려면 '변경 금지'를 선택한다."], "a": 3, "e": "시트 보호 시 시나리오가 표시되지 않도록 하려면 '숨기기'를 선택합니다. '변경 금지'는 시나리오의 수정을 막는 옵션입니다.", "tip": "숨기기 = 안 보이게, 변경 금지 = 수정 방지.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 관리·분석 › 시나리오 추가 · 기출 26-02"},
{"id": "S2-083", "t": "03 데이터 관리·분석", "q": "다음 중 가상 분석 도구인 [데이터 표]에 대한 설명으로 옳지 않은 것은?", "c": ["테스트할 변수의 수에 따라 변수가 한 개이거나 두 개인 데이터 표를 만들 수 있다.", "데이터 표를 이용하여 입력된 데이터는 부분적으로 수정 또는 삭제할 수 있다.", "워크시트가 다시 계산될 때마다 데이터 표도 변경 여부에 관계없이 다시 계산된다.", "데이터 표의 결과값은 반드시 변화하는 변수를 포함한 수식으로 작성해야 한다."], "a": 1, "e": "데이터 표의 결과는 배열 수식으로 입력되므로 일부 셀만 수정하거나 삭제할 수 없습니다.", "tip": "데이터 표 결과 = 배열 수식.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 관리·분석 › 데이터 표 · 기출 24-01, 24-04, 25-01, 25-02", "h": 1},
{"id": "S2-084", "t": "03 데이터 관리·분석", "q": "다음 중 사용자 지정 목록에 대한 설명으로 옳지 않은 것은?", "c": ["정렬 기준이 셀 색, 조건부 서식 아이콘, 글꼴 색인 경우 사용자 지정 목록을 적용할 수 있다.", "사용자 지정 목록을 만들면 다른 통합 문서에서 사용할 수 있도록 컴퓨터 레지스트리에 추가된다.", "엑셀에서 기본적으로 제공되는 목록은 수정하여 사용할 수 없다.", "사용자 지정 목록에는 텍스트 또는 텍스트와 숫자의 조합 등이 포함될 수 있다."], "a": 0, "e": "사용자 지정 목록은 값(텍스트) 기준 정렬에만 적용되며 셀 색·글꼴 색·아이콘 기준에는 적용할 수 없습니다.", "tip": "목록 정렬은 '값' 기준만.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 관리·분석 › 사용자 지정 목록 · 기출 24-01, 25-01, 25-04", "h": 1},
{"id": "S2-085", "t": "04 매크로", "q": "다음 중 [매크로] 대화상자에 대한 설명으로 옳지 않은 것은? (대화상자 단추 : 실행, 한 단계씩 코드 실행, 편집, 만들기, 삭제, 옵션)", "c": ["[실행] 단추를 클릭하면 선택한 매크로를 실행한다.", "[한 단계씩 코드 실행] 단추를 클릭하면 선택한 매크로의 코드를 한 단계씩 실행할 수 있도록 Visual Basic 편집기를 실행한다.", "[편집] 단추를 클릭하면 선택한 매크로의 명령을 수정할 수 있도록 Visual Basic 편집기를 실행한다.", "[옵션] 단추를 클릭하면 선택한 매크로의 매크로 이름과 설명을 수정할 수 있는 [매크로 옵션] 대화상자를 표시한다."], "a": 3, "e": "[매크로 옵션]에서는 바로 가기 키와 설명을 수정할 수 있으며, 매크로 이름은 수정할 수 없습니다.", "tip": "옵션 = 바로 가기 키·설명.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 매크로 › 매크로 대화상자 · 기출 24-02, 24-03"},
{"id": "S2-086", "t": "04 매크로", "q": "다음 중 [매크로] 대화상자에 대한 설명으로 옳지 않은 것은?", "c": ["매크로 이름을 선택한 후 [실행] 단추를 클릭하면 매크로가 실행된다.", "[한 단계씩 코드 실행] 단추를 클릭하면 Visual Basic Editor에서 매크로 실행과정을 단계별로 확인할 수 있다.", "[만들기] 단추를 클릭하면 빠른 실행 도구 모음에 매크로 실행 명령을 추가할 수 있다.", "[옵션] 단추를 클릭하면 매크로 바로 가기 키를 수정할 수 있다."], "a": 2, "e": "[만들기]는 새 매크로를 Visual Basic Editor에서 직접 작성하는 단추이며 빠른 실행 도구 모음과는 무관합니다.", "tip": "만들기 = VBA로 직접 작성.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 매크로 › 매크로 대화상자 · 기출 25-02"},
{"id": "S2-087", "t": "04 매크로", "q": "다음 중 아래의 '매크로' 대화상자에 대한 설명에서 괄호 안에 들어갈 용어로 옳은 것은?\n'매크로' 대화상자의 ( ㉮ ) 단추는 바로 가기 키나 설명을 변경할 수 있고, ( ㉯ ) 단추는 매크로 이름이나 명령 코드를 수정할 수 있다.", "c": ["㉮ 옵션 - ㉯ 편집", "㉮ 편집 - ㉯ 옵션", "㉮ 매크로 - ㉯ 보기 편집", "㉮ 편집 - ㉯ 매크로 보기"], "a": 0, "e": "바로 가기 키·설명 변경은 [옵션], 명령 코드 수정은 [편집] 단추에서 합니다.", "tip": "옵션 = 키·설명, 편집 = 코드.", "w": ["", "㉮와 ㉯가 서로 바뀌었습니다.", "'매크로'와 '보기 편집'은 매크로 대화상자의 단추 이름이 아닙니다.", "'매크로 보기'는 매크로 대화상자의 단추 이름이 아닙니다."], "p": "2과목 › 매크로 › 매크로 대화상자 · 기출 26-01"},
{"id": "S2-088", "t": "04 매크로", "q": "다음 중 매크로에 대한 설명으로 옳은 것은?", "c": ["매크로의 이름은 문자로 시작하여야 하고, 공백을 포함할 수 있다.", "한 번 작성된 매크로는 삭제할 수 없다.", "매크로 작성을 위해 Visual Basic 언어를 따로 설치해야 한다.", "매크로란 반복적인 작업을 단순화하기 위해 작업과정을 자동화하는 기능이다."], "a": 3, "e": "매크로는 반복적인 작업을 기록해 두었다가 자동으로 실행하게 하는 기능입니다.", "tip": "매크로 = 반복 작업 자동화.", "w": ["매크로 이름에는 공백을 사용할 수 없습니다.", "작성된 매크로는 삭제할 수 있습니다.", "Visual Basic Editor는 엑셀에 포함되어 있어 별도 설치가 필요 없습니다.", ""], "p": "2과목 › 매크로 › 매크로 일반 · 기출 24-02, 24-03"},
{"id": "S2-089", "t": "04 매크로", "q": "다음 중 매크로에 대한 설명으로 옳지 않은 것은?", "c": ["매크로 이름은 대소문자를 구분하지 않으며, 공백이나 마침표를 포함하여 매크로 이름을 설정할 수 있다.", "매크로를 실행할 키 조합(Ctrl 키 조합 바로 가기 키)은 매크로가 포함된 통합 문서가 열려 있는 동안 이와 동일한 기본 엑셀 바로 가기 키를 무시한다.", "매크로를 기록하는 경우 실행하려는 작업을 완료하는데 필요한 모든 단계가 매크로 레코더에 기록되며, 리본에서의 탐색은 기록에 포함되지 않는다.", "엑셀을 사용할 때마다 매크로를 사용할 수 있게 하려면 매크로 기록 시 매크로 저장 위치 목록에서 '개인용 매크로 통합 문서'를 선택한다."], "a": 0, "e": "매크로 이름에는 공백이나 마침표를 사용할 수 없습니다. 첫 글자는 문자이고 나머지는 문자·숫자·밑줄을 사용합니다.", "tip": "이름: 공백·마침표 불가.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 매크로 › 매크로 일반 · 기출 24-01"},
{"id": "S2-090", "t": "04 매크로", "q": "다음 중 매크로 작성에 대한 설명으로 옳은 것은?", "c": ["엑셀에서 지정되어 있는 바로 가기 키를 지정하면 에러가 발생한다.", "매크로 이름은 문자로 시작해야 하므로 숫자로만 구성된 매크로 이름은 만들 수 없다.", "매크로 바로 가기 키를 대문자로 지정하면 [Ctrl]이 자동으로 덧붙는다.", "기록된 매크로를 수정할 수 없으므로 수정하려면 제거 후 다시 만들어야 한다."], "a": 1, "e": "매크로 이름은 문자로 시작해야 하므로 숫자로만 구성된 이름은 만들 수 없습니다.", "tip": "이름 첫 글자는 문자.", "w": ["엑셀 기본 바로 가기 키를 지정해도 오류 없이 매크로 키가 우선합니다.", "", "대문자로 지정하면 [Ctrl]+[Shift]가 함께 적용됩니다.", "기록된 매크로는 Visual Basic Editor에서 수정할 수 있습니다."], "p": "2과목 › 매크로 › 매크로 작성 · 기출 24-04, 25-06"},
{"id": "S2-091", "t": "04 매크로", "q": "다음 중 매크로에 관한 설명으로 옳지 않은 것은?", "c": ["서로 다른 매크로에 동일한 이름을 부여할 수 없다.", "매크로는 반복적인 작업을 자동화하여 복잡한 작업을 단순한 명령으로 실행할 수 있도록 한다.", "매크로 기록 시 사용자의 마우스 동작은 기록되지만 키보드 작업은 기록되지 않는다.", "현재 셀의 위치를 기준으로 매크로가 실행되도록 하려면 '상대 참조로 기록'을 설정한 후 매크로를 기록한다."], "a": 2, "e": "매크로 기록 시 마우스 동작뿐 아니라 키보드 작업도 모두 기록됩니다.", "tip": "마우스·키보드 모두 기록.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 매크로 › 매크로 기록 · 기출 25-04"},
{"id": "S2-092", "t": "04 매크로", "q": "다음 중 매크로에 관한 설명으로 옳지 않은 것은?", "c": ["매크로 이름의 첫 글자는 반드시 문자로 지정해야 합니다.", "서로 다른 매크로에 동일한 이름을 부여할 수 없다.", "현재 셀의 위치를 기준으로 매크로가 실행되도록 하려면 별도의 추가 설정없이 '매크로 기록'을 클릭한 후 매크로를 기록한다.", "매크로 기록 시 사용자의 마우스 동작은 물론 키보드 작업도 모두 기록된다."], "a": 2, "e": "현재 셀 위치 기준으로 실행하려면 '상대 참조로 기록'을 설정한 후 기록해야 합니다.", "tip": "위치 기준 실행 = 상대 참조로 기록.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 매크로 › 매크로 기록 · 기출 25-06"},
{"id": "S2-093", "t": "04 매크로", "q": "다음 중 아래와 같이 설정된 [매크로 기록] 대화상자에 대한 설명으로 옳지 않은 것은?\n(매크로 이름 Macro1, 바로 가기 키 Ctrl+a, 매크로 저장 위치 '개인용 매크로 통합 문서', 설명 비어 있음)", "c": ["매크로 이름은 Macro1이며, 변경하고자 할 경우 [매크로] 대화상자에서만 변경할 수 있다.", "작성된 'Macro1' 매크로는 'Personal.xlsb'에 저장된다.", "설명은 일종의 주석으로 반드시 지정해 주지 않아도 된다.", "작성된 'Macro1' 매크로는 [Ctrl]+[a]를 눌러 실행할 수 있다."], "a": 0, "e": "[매크로 기록] 대화상자에서 매크로 이름을 직접 입력해 바꿀 수 있습니다.", "tip": "이름은 기록 대화상자에서도 변경 가능.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 매크로 › 매크로 기록 · 기출 25-05"},
{"id": "S2-094", "t": "04 매크로", "q": "다음 중 매크로 기록에 관한 설명으로 옳지 않은 것은?", "c": ["바로 가기 키는 소문자, 대문자를 모두 사용할 수 있다.", "매크로 이름에는 공백 문자는 사용할 수 없다.", "바로 가기 키는 [Ctrl]과 함께 사용한다.", "매크로 이름의 첫 글자는 문자나 숫자를 사용한다."], "a": 3, "e": "매크로 이름의 첫 글자는 반드시 문자여야 하며 숫자로 시작할 수 없습니다.", "tip": "이름 첫 글자 = 문자만.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 매크로 › 매크로 기록 · 기출 25-01"},
{"id": "S2-095", "t": "04 매크로", "q": "다음 중 [매크로 기록]에 관한 설명으로 옳지 않은 것은?", "c": ["매크로 이름의 첫 글자는 반드시 문자이어야 하며 나머지는 문자, 숫자, 밑줄 등을 사용할 수 있다.", "공백 및 밑줄로 단어를 구분할 수 있으며 셀 참조가 되는 매크로 이름을 사용할 수 있다.", "매크로 실행의 바로 가기 키는 [Ctrl]과 함께 사용하며 문자로 @나 #과 같은 특수 문자나 숫자는 사용할 수 없다.", "매크로 실행의 바로 가기 키는 매크로가 포함된 통합 문서를 사용하는 동안 이와 동일한 Excel에 기본적으로 지정되어 있는 바로 가기 키는 무시되므로 주의한다."], "a": 1, "e": "매크로 이름에는 공백을 사용할 수 없고, 셀 참조(예: A1)와 같은 이름도 사용할 수 없습니다. 단어 구분은 밑줄(_)로 합니다.", "tip": "공백 불가, 단어 구분은 밑줄.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 매크로 › 매크로 기록 · 기출 26-02"},
{"id": "S2-096", "t": "04 매크로", "q": "다음 중 매크로의 바로 가기 키에 대한 설명으로 옳지 않은 것은?", "c": ["매크로 생성 시 설정한 바로 가기 키는 [매크로] 대화상자의 [옵션]에서 변경할 수 있다.", "기본적으로 바로 가기 키는 [Ctrl]과 조합하여 사용하지만 대문자로 지정하면 [Shift]가 자동으로 덧붙는다.", "바로 가기 키의 조합 문자는 영문자만 가능하고, 바로 가기 키를 설정하지 않아도 매크로를 생성할 수 있다.", "엑셀에서 기본적으로 지정되어 있는 바로 가기 키는 매크로의 바로 가기 키로 지정할 수 없다."], "a": 3, "e": "엑셀 기본 바로 가기 키와 같은 키를 지정할 수 있으며, 이 경우 매크로의 바로 가기 키가 우선합니다.", "tip": "동일 키 지정 시 매크로 우선.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 매크로 › 매크로 바로 가기 키 · 기출 24-01, 24-03, 25-02", "h": 1},
{"id": "S2-097", "t": "04 매크로", "q": "엑셀에서 사용하는 바로 가기 키와 동일한 키로 매크로의 바로 가기 키를 설정한 후 해당 바로 가기 키를 눌렀을 때의 상황으로 옳은 것은?", "c": ["오류 메시지가 표시된 대화상자가 나타난다.", "엑셀의 바로 가기 키가 동작한다.", "매크로의 바로 가기 키가 동작한다.", "아무런 동작도 수행되지 않는다."], "a": 2, "e": "엑셀 기본 바로 가기 키와 충돌하면 매크로의 바로 가기 키가 우선하여 동작합니다.", "tip": "충돌 시 매크로 우선.", "w": ["충돌이 있어도 오류 메시지는 표시되지 않습니다.", "엑셀의 기본 바로 가기 키는 무시됩니다.", "", "매크로의 바로 가기 키가 정상 동작합니다."], "p": "2과목 › 매크로 › 매크로 바로 가기 키 · 기출 25-05"},
{"id": "S2-098", "t": "04 매크로", "q": "다음 중 작성된 매크로를 실행하는 방법으로 옳지 않은 것은?", "c": ["매크로를 지정한 도형을 클릭하여 실행한다.", "'매크로' 대화상자에서 매크로를 선택하여 실행한다.", "매크로를 기록할 때 지정한 바로 가기 키를 이용하여 실행한다.", "매크로를 지정한 워크시트의 셀 자체를 클릭하여 실행한다."], "a": 3, "e": "매크로는 셀에 지정할 수 없고, 도형·단추 등에 지정할 수 있습니다.", "tip": "셀에는 매크로 지정 불가.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 매크로 › 매크로 실행 · 기출 24-04"},
{"id": "S2-099", "t": "04 매크로", "q": "다음 중 매크로의 실행 방법에 관한 설명으로 옳지 않은 것은?", "c": ["실행하려는 셀을 선택한 후 마우스 오른쪽 버튼 메뉴를 이용해 실행할 수 있다.", "양식 도구 모음의 '단추' 버튼을 사용하여 매크로 실행 단추를 만들어 매크로를 실행할 수 있다.", "바로 가기 키를 이용해서 매크로를 실행할 수 있다.", "매크로 이름 상자에서 실행할 매크로 이름을 선택하여 실행할 수 있다."], "a": 0, "e": "셀의 마우스 오른쪽 버튼 메뉴에는 매크로 실행 항목이 없습니다.", "tip": "오른쪽 버튼 메뉴로 매크로 실행 불가.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 매크로 › 매크로 실행 · 기출 25-03"},
{"id": "S2-100", "t": "04 매크로", "q": "다음 중 매크로를 실행하는 방법에 대한 설명으로 옳지 않은 것은?", "c": ["[개발 도구] → [코드] 그룹의 [매크로]를 클릭한 후 매크로를 선택하여 실행한다.", "셀의 바로 가기 메뉴에서 [매크로 지정]을 클릭하여 셀에 매크로를 연결한 후 실행한다.", "매크로를 기록할 때 지정한 바로 가기 키를 눌러 실행한다.", "빠른 실행 도구 모음에 매크로를 선택하여 아이콘으로 추가한 후 아이콘을 클릭하여 실행한다."], "a": 1, "e": "매크로는 도형·단추 등에 지정할 수 있지만 셀에는 지정할 수 없습니다.", "tip": "도형·단추에 매크로 지정.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 매크로 › 매크로 실행 · 기출 25-05"},
{"id": "S2-101", "t": "04 매크로", "q": "다음 중 매크로에 관한 설명으로 옳지 않은 것은?", "c": ["같은 통합 문서 내에서 시트가 다르면 동일한 매크로 이름으로 기록할 수 있다.", "[매크로 기록] 대화상자에서 바로 가기 키 지정 시 영문 대문자를 사용하면 [Shift]가 자동으로 덧붙는다.", "엑셀을 실행할 때마다 매크로를 사용할 수 있게 하려면 [매크로 기록] 대화상자에서 매크로 저장 위치를 '개인용 매크로 통합 문서'로 선택한다.", "통합 문서를 열 때 어떤 상황에서 어떤 매크로를 실행할지 매크로 보안 설정을 변경하여 제어할 수 있다."], "a": 0, "e": "매크로 이름은 같은 통합 문서 안에서 중복될 수 없으며 시트가 달라도 동일한 이름을 쓸 수 없습니다.", "tip": "매크로 이름은 통합 문서에서 유일.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 매크로 › 매크로 설명 · 기출 26-01, 26-02"},
{"id": "S2-102", "t": "05 차트", "q": "다음 중 차트의 범례 설정에 대한 설명으로 옳지 않은 것은?", "c": ["범례 위치는 [범례 서식] 대화상자나 [레이아웃] 탭 [레이블] 그룹에서 쉽게 변경할 수 있다.", "차트에서 범례 또는 범례 항목을 클릭한 후 [Delete]를 누르면 범례를 쉽게 제거할 수 있다.", "기본적으로 범례의 위치는 차트의 다른 구성 요소와 겹치지 않게 표시된다.", "마우스로 범례를 이동하거나 크기를 변경하면 그림 영역의 크기 및 위치는 자동으로 조정된다."], "a": 3, "e": "범례를 이동하거나 크기를 변경해도 그림 영역에는 아무런 변화가 없습니다.", "tip": "범례 이동 ≠ 그림 영역 변화.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 차트 › 차트 범례 · 기출 25-02, 26-03"},
{"id": "S2-103", "t": "05 차트", "q": "아래 그림(세로 막대형 차트 '2021년도 각 점포별 방문객수')을 [데이터 계열 서식] 메뉴를 이용하여 수정하고자 할 때, 다음 중 설명이 옳지 않은 것은?", "c": ["[계열 겹치기]는 -100%에서 100%까지 조절할 수 있다.", "[간격 너비]는 0%에서 500%까지이다.", "[요소마다 다른 색 사용]에 체크 표시를 하면 막대의 색깔이 각각 달라진다.", "[간격 너비]의 숫자를 늘리면 각 막대의 너비가 커진다."], "a": 3, "e": "[간격 너비]는 막대 사이의 간격이므로 숫자를 늘리면 간격이 넓어지고 막대의 너비는 오히려 줄어듭니다.", "tip": "간격 너비 ↑ = 막대 너비 ↓.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 차트 › 데이터 계열 서식 · 기출 24-02, 25-06, 26-03", "h": 1},
{"id": "S2-104", "t": "05 차트", "q": "다음 중 각 차트에 대한 설명으로 옳지 않은 것은?", "c": ["꺾은선형 차트 : 일정 간격에 따라 데이터의 추세를 나타내기에 적합하다.", "원형 차트 : 전체에 대한 각 부분의 관계를 보여주며, 여러 데이터 계열이 각각의 고리로 표시된다.", "방사형 차트 : 각 데이터 요소의 중간 지점에 대한 값의 변화를 보여주며, 여러 데이터 계열의 집계 값을 비교하기에도 용이하다.", "분산형 차트 : 여러 데이터 계열에 있는 숫자 값 사이의 관계를 보여주거나 두 개의 숫자 그룹을 xy 좌표로 이루어진 하나의 계열로 표시한다."], "a": 1, "e": "원형 차트는 한 개의 계열만 표시합니다. 여러 계열이 고리 모양으로 표시되는 것은 도넛형 차트입니다.", "tip": "여러 계열 고리 = 도넛형.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 차트 › 차트 종류 · 기출 24-02, 24-03"},
{"id": "S2-105", "t": "05 차트", "q": "다음 중 각 차트 종류에 대한 설명으로 적절하지 않은 것은?", "c": ["영역형 차트 : 워크시트의 여러 열이나 행에 있는 데이터에서 시간에 따른 변동의 크기를 강조하여 합계 값을 추세와 함께 살펴볼 때 사용된다.", "주식형 차트 : 주식의 거래량과 같은 주가의 흐름을 파악하고자 할 때 사용하며, 3차원 차트를 작성할 수 있다.", "도넛형 차트 : 여러 열이나 행에 있는 데이터에서 전체에 대한 각 부분의 관계를 비율로 나타내어 각 부분을 비교할 때 사용된다.", "분산형 차트 : 여러 데이터 계열에 있는 숫자 값 사이의 관계를 보여 주거나 두 개의 숫자 그룹을 xy 좌표로 이루어진 하나의 계열로 표시할 때 사용된다."], "a": 1, "e": "주식형 차트는 3차원 차트로 작성할 수 없습니다.", "tip": "주식형 = 3차원 불가.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 차트 › 차트 종류 · 기출 25-01"},
{"id": "S2-106", "t": "05 차트", "q": "다음 중 각 차트에 대한 설명으로 옳지 않은 것은?", "c": ["꺾은선형 차트 : 하나의 계열만 갖는 차트로 3차원 차트로 표현할 수 없다.", "방사형 차트 : 각 데이터 요소의 중간 지점에 대한 값의 변화를 보여주며, 여러 데이터 계열의 집계 값을 비교하기에도 용이하다.", "분산형 차트 : 여러 데이터 계열에 있는 숫자 값 사이의 관계를 보여주거나 두 개의 숫자 그룹을 xy 좌표로 이루어진 하나의 계열로 표시한다.", "원형 차트 : 각 항목을 전체에 대한 구성 비율이나 기여도를 나타낼 때 사용한다."], "a": 0, "e": "꺾은선형 차트는 여러 계열을 표시할 수 있고 3차원 꺾은선형 차트도 작성할 수 있습니다.", "tip": "꺾은선형: 여러 계열, 3차원 가능.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 차트 › 차트 종류 · 기출 26-01"},
{"id": "S2-107", "t": "05 차트", "q": "다음 중 차트에 대한 설명으로 옳지 않은 것은?", "c": ["표면형 차트는 두 개의 데이터 집합에서 최적의 조합을 찾을 때 사용한다.", "방사형 차트는 분산형 차트의 한 종류로 데이터 계열 간의 항목 비교에 사용된다.", "분산형 차트는 데이터의 불규칙한 간격이나 묶음을 보여주는 것으로 주로 과학이나 공학용 데이터 분석에 사용된다.", "이중 축 차트는 특정 데이터 계열의 값이 다른 데이터 계열의 값과 현저하게 차이가 나거나 데이터의 단위가 다른 경우 주로 사용한다."], "a": 1, "e": "방사형 차트는 분산형 차트의 한 종류가 아니라 독립된 차트 종류입니다.", "tip": "방사형 ≠ 분산형의 한 종류.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 차트 › 차트 종류 · 기출 25-06"},
{"id": "S2-108", "t": "05 차트", "q": "다음 중 원형 차트에 대한 설명으로 옳지 않은 것은?", "c": ["차트의 각 조각을 분리하거나, 첫째 조각의 각을 조정할 수 있다.", "전체 항목의 합에 대한 각 항목의 비율을 표시할 수 있다.", "여러 개의 데이터 계열을 표현할 수 있다.", "항목의 값들이 항목 합계의 비율로 표시되므로 중요한 요소를 강조할 때 사용한다."], "a": 2, "e": "원형 차트는 하나의 데이터 계열만 표현할 수 있습니다.", "tip": "원형 = 계열 1개.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 차트 › 원형 차트 · 기출 25-05"},
{"id": "S2-109", "t": "05 차트", "q": "다음이 설명하는 차트는 무엇인가?\n• 전체 항목의 합에 대한 각 항목의 비율을 나타내는 차트로, 중요한 요소를 강조할 때 사용한다.\n• 항상 한 개의 데이터 계열만 사용하므로 축이 없다.", "c": ["세로 막대형 차트", "도넛형 차트", "원형 차트", "분산형 차트"], "a": 2, "e": "비율을 나타내고 항상 한 개의 계열만 사용하며 축이 없는 차트는 원형 차트입니다.", "tip": "비율 + 계열 1개 + 축 없음 = 원형.", "w": ["세로 막대형은 항목 간 값을 비교하며 축이 있습니다.", "도넛형은 여러 계열을 표시할 수 있습니다.", "", "분산형은 두 숫자 값의 관계를 보여 주며 축이 있습니다."], "p": "2과목 › 차트 › 차트 종류 판별 · 기출 24-01, 24-04, 25-02", "h": 1},
{"id": "S2-110", "t": "05 차트", "q": "다음 중 하나의 계열만 표시할 수 있는 차트는?", "c": ["세로 막대형", "원형", "방사형", "영역형"], "a": 1, "e": "원형 차트는 하나의 데이터 계열만 표시할 수 있습니다.", "tip": "원형 = 하나의 계열.", "w": ["세로 막대형은 여러 계열을 표시할 수 있습니다.", "", "방사형은 여러 계열을 표시할 수 있습니다.", "영역형은 여러 계열을 표시할 수 있습니다."], "p": "2과목 › 차트 › 차트 종류 판별 · 기출 25-06"},
{"id": "S2-111", "t": "05 차트", "q": "다음과 같이 수량과 실적에 따른 점유율을 확인하는데 가장 알맞은 차트는 무엇인가?\n(순번 1~5 / 수량 35, 40, 42, 58, 33 / 실적 3,500,000, 4,000,000, 4,200,000, 5,800,000, 3,300,000 / 점유율 17%, 19%, 20%, 28%, 16%)", "c": ["도넛형", "분산형", "거품형", "영역형"], "a": 2, "e": "거품형 차트는 X값, Y값과 거품의 크기(세 번째 값)를 함께 표시하므로 수량(X), 실적(Y), 점유율(크기)을 한 번에 보여 줍니다.", "tip": "값이 3개 = 거품형.", "w": ["도넛형은 비율만 표시하고 수량·실적의 위치 관계를 보여 주지 못합니다.", "분산형은 X, Y 두 값의 관계만 표시합니다.", "", "영역형은 시간에 따른 변화량을 강조합니다."], "p": "2과목 › 차트 › 차트 종류 판별 · 기출 26-02"},
{"id": "S2-112", "t": "05 차트", "q": "다음 중 원형 차트를 개선한 것으로 여러 개의 계열을 가지는 차트는?", "c": ["3차원 효과의 원형 차트", "도넛형 차트", "원통형 차트", "원뿔형 차트"], "a": 1, "e": "도넛형 차트는 원형 차트와 비슷하지만 여러 개의 계열을 표시할 수 있습니다.", "tip": "여러 계열 원형 = 도넛형.", "w": ["3차원 효과 원형도 계열은 하나뿐입니다.", "", "원통형은 막대의 모양을 바꾼 막대 계열 차트입니다.", "원뿔형은 막대의 모양을 바꾼 막대 계열 차트입니다."], "p": "2과목 › 차트 › 도넛형 차트 · 기출 26-02"},
{"id": "S2-113", "t": "05 차트", "q": "다음 중 항목 레이블이 월, 분기, 연도와 같이 일정한 간격의 값을 나타내는 경우에 적합한 차트로 일정 간격에 따라 데이터의 추세를 표시하는 데 유용한 것은?", "c": ["원형 차트", "분산형 차트", "꺾은선형 차트", "방사형 차트"], "a": 2, "e": "일정 간격에 따른 데이터의 추세(변화)를 표시하는 데는 꺾은선형 차트가 적합합니다.", "tip": "추세 = 꺾은선형.", "w": ["원형 차트는 전체에 대한 비율을 보여 줍니다.", "분산형은 두 숫자 값 사이의 관계를 보여 줍니다.", "", "방사형은 항목 간 값의 변화를 중심에서 방사형으로 표시합니다."], "p": "2과목 › 차트 › 꺾은선형 차트 · 기출 25-05"},
{"id": "S2-114", "t": "05 차트", "q": "다음 차트에 표시되지 않은 구성 요소는?\n(제목 '국어 성적'인 세로 막대형 차트 / 범례 '국어' 표시 / 가로 축 아래에 데이터 테이블 표시 / 눈금선 표시 / 막대 위에 값 표시 없음)", "c": ["데이터 테이블", "범례", "눈금선", "데이터 레이블"], "a": 3, "e": "차트에는 데이터 테이블, 범례, 눈금선이 있지만 막대 위에 값을 표시하는 데이터 레이블은 없습니다.", "tip": "값이 막대 위에 있어야 데이터 레이블.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 차트 › 차트 구성 요소 · 기출 24-04, 25-04"},
{"id": "S2-115", "t": "05 차트", "q": "다음 중 아래 차트에 대한 설명으로 옳지 않은 것은?\n(표 : 구분 / 남 / 여 / 합계 - 1반 23, 21, 44 / 2반 22, 25, 47 / 3반 20, 17, 37 / 4반 21, 19, 40 / 합계 86, 82, 168)\n(차트 : 가로 항목 1반~4반, 합계 / 계열 '남', '여' / 묶은 세로 막대형 / 세로 값 축의 주 눈금과 보조 눈금이 안쪽으로 표시)", "c": ["표 전체 영역을 데이터 원본으로 사용하여 차트를 작성하였다.", "데이터 계열로 '남'과 '여'가 사용되고 있다.", "세로(값) 축의 [축 서식]에는 주 눈금과 보조 눈금이 '안쪽'으로 표시되도록 설정되었다.", "차트의 종류는 묶은 세로 막대형으로 계열 옵션의 '계열 겹치기'가 적용되었다."], "a": 0, "e": "차트에는 '합계' 열이 계열로 사용되지 않았으므로 표 전체 영역을 데이터 원본으로 사용한 것이 아닙니다.", "tip": "합계 열이 빠져 있다.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 차트 › 차트 해석 · 기출 24-03"},
{"id": "S2-116", "t": "05 차트", "q": "다음 차트에 대한 설명으로 옳지 않은 것은?\n(수당지급 현황도 : 가로 항목 장기홍, 이승연, 김영심 / 막대 계열 근속년수·경력년수 / 꺾은선 계열 수당(보조 세로 축 사용) / 막대와 선에 값 표시 없음 / 가로 축 제목 없음 / 막대끼리 붙지 않고 약간의 간격)", "c": ["데이터 레이블로 값이 표시되어 있다.", "두 개의 차트 종류가 혼합되어 있으며, 값 축이 두 개로 설정된 이중 축 혼합형 차트이다.", "막대 그래프 계열 옵션의 계열 겹치기는 '0%'로 설정되었다.", "기본 가로(항목) 축 제목이 표시되어 있지 않은 차트이다."], "a": 0, "e": "이 차트에는 막대와 선 위에 값(데이터 레이블)이 표시되어 있지 않습니다.", "tip": "그림에 값이 없으면 데이터 레이블 없음.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 차트 › 차트 해석 · 기출 25-03"},
{"id": "S2-117", "t": "05 차트", "q": "다음 중 차트에 대한 설명으로 옳지 않은 것은?", "c": ["기본적으로 워크시트의 행과 열에서 숨겨진 데이터는 차트에 표시되지 않으며 빈 셀은 간격으로 표시된다.", "표에서 특정 셀 한 개를 선택하여 차트를 생성하면 해당 셀을 직접 둘러싸는 표의 데이터 영역이 모두 차트에 표시된다.", "차트를 만들 데이터를 선택한 후 [Alt]+[F1]을 누르면 별도의 차트 시트가 생성된다.", "차트에 두 개 이상의 차트 종류를 사용하여 혼합형 차트를 만들 수도 있다."], "a": 2, "e": "[Alt]+[F1]은 현재 워크시트에 포함된 차트를 만들고, 별도의 차트 시트는 [F11]로 만듭니다.", "tip": "Alt+F1 = 포함 차트, F11 = 차트 시트.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 차트 › 차트 생성 · 기출 25-03"},
{"id": "S2-118", "t": "01 입력·서식·참조", "q": "다음 중 조건부 서식에 대한 설명으로 옳지 않은 것은?", "c": ["조건부 서식에서 사용하는 수식은 등호(=)로 시작해야 한다.", "규칙에 맞는 셀 범위는 해당 규칙에 따라 서식이 지정되고 규칙에 맞지 않는 셀 범위는 서식이 지정되지 않는다.", "조건부 서식이 적용된 후 셀 값이 바뀌어 규칙과 일치하지 않아도 셀 서식 설정은 해제되지 않는다.", "고유 또는 중복 값에 대해서만 서식을 지정할 수도 있다."], "a": 2, "e": "셀 값이 바뀌어 조건에 맞지 않게 되면 조건부 서식은 자동으로 해제됩니다.", "tip": "조건 불만족 시 서식 자동 해제.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 조건부 서식 · 기출 24-03, 25-04"},
{"id": "S2-119", "t": "01 입력·서식·참조", "q": "다음 중 조건부 서식에 대한 설명으로 옳지 않은 것은?", "c": ["조건을 수식으로 입력할 경우 수식 앞에 등호(=)를 반드시 입력해야 한다.", "두 개의 조건을 만족하는 경우 우선순위가 높은 것만 적용된다.", "아이콘 집합을 이용하면 조건 없이 셀의 값에 따라 다양한 모양의 아이콘을 표시할 수 있다.", "조건부 서식에 의해 서식이 설정된 셀에서 값이 변경되어 조건에 만족하지 않을 경우 적용된 서식은 바로 해제된다."], "a": 1, "e": "두 조건이 서로 충돌하지 않으면 모두 적용되며, 충돌하는 서식에 대해서만 우선순위가 높은 것이 적용됩니다.", "tip": "충돌 시에만 우선순위.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 조건부 서식 · 기출 25-03"},
{"id": "S2-120", "t": "01 입력·서식·참조", "q": "조건부 서식에 대한 설명으로 틀린 것은?", "c": ["조건에 맞지 않을 경우에 대한 서식도 함께 지정할 수 있다.", "조건부 서식은 기존의 셀 서식에 우선하여 적용된다.", "조건을 수식으로 입력할 경우 수식 앞에 등호(=)를 반드시 입력해야 한다.", "조건부 서식에 의해 서식이 설정된 셀에서 값이 변경되어 조건에 만족하지 않을 경우 적용된 서식은 바로 해제된다."], "a": 0, "e": "조건부 서식은 조건에 맞는 경우에 대한 서식만 지정하며, 맞지 않는 경우의 서식은 지정할 수 없습니다.", "tip": "조건 만족 시 서식만 지정.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 조건부 서식 · 기출 25-02"},
{"id": "S2-121", "t": "01 입력·서식·참조", "q": "아래 워크시트에서 '생일' 필드와 같이 표시되도록 하는 사용자 지정 서식으로 올바른 것은?\n(표시 예 : 2003-04-03 (목), 2004-01-02 (금), 2002-07-22 (월))", "c": ["yyyy-mm-dd (aaaa)", "yyyy-mm-dd (dddd)", "yyyy-mm-dd (aaa)", "yyyy-mm-dd (ddd)"], "a": 2, "e": "aaa는 한글 요일 약자(목)로 표시됩니다. aaaa는 '목요일', ddd는 영문 약자(Thu), dddd는 영문 전체(Thursday)입니다.", "tip": "aaa = 월, aaaa = 월요일.", "w": ["aaaa는 '목요일'처럼 요일 전체 이름을 표시합니다.", "dddd는 영문 요일 전체 이름(Thursday)을 표시합니다.", "", "ddd는 영문 요일 약자(Thu)를 표시합니다."], "p": "2과목 › 데이터 입력·서식·참조 › 사용자 지정 서식 · 기출 25-03"},
{"id": "S2-122", "t": "01 입력·서식·참조", "q": "다음 아래 워크시트에서의 작업에 대한 설명으로 옳지 않은 것은?\n(B2:C6 영역이 선택된 상태이며 활성 셀은 [B2])", "c": ["[B2] 셀에 데이터를 입력하고 [Shift]+[Enter]를 누르면 셀 포인터가 [B3] 셀로 이동된다.", "[B2] 셀에서 [Enter]를 5번 누르면 셀 포인터가 [C2] 셀로 이동된다.", "[B2] 셀에 데이터를 입력하고 [Ctrl]+[Enter]를 누르면 [B2:C6] 영역에 동일한 데이터가 입력된다.", "[B2] 셀에 데이터를 입력하고 [Alt]+[Enter]를 누르면 셀 안에서 줄 나누기가 수행된다."], "a": 0, "e": "[Shift]+[Enter]는 [Enter]와 반대 방향(위쪽·이전 셀)으로 이동합니다. 아래쪽 [B3]으로 이동하는 것은 [Enter]입니다.", "tip": "Shift+Enter = 반대 방향.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 셀 이동 키 · 기출 26-01"},
{"id": "S2-123", "t": "06 화면·인쇄·시트", "q": "다음 중 창 나누기에 대한 설명으로 옳지 않은 것은?", "c": ["창 나누기를 실행하면 하나의 작업 창은 최대 4개 부분으로 나눌 수 있다.", "첫 행과 첫 열을 제외한 나머지 셀에서 창 나누기를 수행하면 현재 셀의 위쪽과 왼쪽에 창 분할선이 생긴다.", "현재의 창 나누기 상태를 유지하면서 추가로 창 나누기를 지정할 수 있다.", "화면에 표시되는 창 나누기 형태는 인쇄 시 적용되지 않는다."], "a": 2, "e": "이미 창 나누기가 된 상태에서는 추가로 창 나누기를 지정할 수 없습니다.", "tip": "창 나누기는 추가 지정 불가.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 화면·인쇄·시트 관리 › 창 나누기 · 기출 24-02"},
{"id": "S2-124", "t": "06 화면·인쇄·시트", "q": "다음 중 창 나누기에 대한 설명으로 옳지 않은 것은?", "c": ["창 나누기를 실행하면 하나의 작업 창은 최대 4개 부분으로 나눌 수 있다.", "첫 행과 첫 열을 제외한 나머지 셀에서 창 나누기를 수행하면 현재 셀의 위쪽과 왼쪽에 창 분할선이 생긴다.", "창 구분선은 틀 고정 구분선처럼 마우스로 드래그하여 위치를 이동할 수 없다.", "화면에 표시되는 창 나누기 형태는 인쇄 시 적용되지 않는다."], "a": 2, "e": "창 나누기 구분선은 마우스로 드래그하여 위치를 이동할 수 있습니다. (틀 고정 구분선은 이동할 수 없음)", "tip": "나누기 선 이동 가능, 틀 고정 선 불가.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 화면·인쇄·시트 관리 › 창 나누기 · 기출 24-03, 25-03"},
{"id": "S2-125", "t": "06 화면·인쇄·시트", "q": "다음 중 틀 고정 및 창 나누기에 대한 설명으로 옳지 않은 것은?", "c": ["창 나누기는 셀 포인트의 위치에 따라 수직, 수평, 수직·수평 분할이 가능하다.", "화면에 나타나는 창 나누기 형태는 인쇄 시 적용되지 않는다.", "창 나누기 구분선을 제거하려면 [보기] → [창] → [숨기기]를 선택한다.", "첫 행을 고정하려면 셀 포인트의 위치에 상관 없이 [틀 고정] → [첫 행 고정]을 선택한다."], "a": 2, "e": "창 나누기를 해제하려면 [보기] → [창] → [창 나누기]를 다시 클릭(또는 구분선 더블클릭)합니다. [숨기기]는 통합 문서 창을 숨기는 기능입니다.", "tip": "나누기 해제 = 창 나누기 다시 클릭.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 화면·인쇄·시트 관리 › 틀 고정·창 나누기 · 기출 24-04, 25-01, 26-01, 26-02", "h": 1},
{"id": "S2-126", "t": "06 화면·인쇄·시트", "q": "다음은 '창 나누기'와 '틀 고정'에 대한 설명이다. 잘못된 것은?", "c": ["창 구분선을 마우스로 드래그하여 위치를 이동할 수 있다.", "창 나누기는 워크시트를 여러 개의 창으로 분리하는 기능으로 최대 4개로 분할할 수 있다.", "틀 고정을 마우스로 끌어서 위치를 변경할 수 있다.", "메뉴 [창] → [틀 고정]을 선택하면 현재 셀 포인터의 왼쪽, 위쪽에 틀 고정선이 나타난다."], "a": 2, "e": "틀 고정선은 마우스로 끌어서 위치를 변경할 수 없습니다. 위치를 바꾸려면 틀 고정을 해제한 후 다시 설정합니다.", "tip": "틀 고정선 = 이동 불가.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 화면·인쇄·시트 관리 › 틀 고정·창 나누기 · 기출 25-02"},
{"id": "S2-127", "t": "06 화면·인쇄·시트", "q": "다음 중 워크시트의 화면 설정에 대한 설명으로 옳지 않은 것은?", "c": ["창 나누기를 이용하면 서로 떨어져 있는 데이터를 한 화면에 표시할 수 있다.", "여러 개의 통합 문서가 열려 있는 경우 창을 바둑판식, 가로, 세로, 계단식으로 정렬할 수 있다.", "하나의 통합 문서만 열려 있는 경우에는 창 숨기기를 수행할 수 없다.", "틀 고정을 이용하면 데이터의 양이 많은 경우 열이나 행을 고정시켜 셀 포인터의 이동과 상관없이 특정 영역을 항상 표시할 수 있다."], "a": 2, "e": "통합 문서가 하나만 열려 있어도 창 숨기기를 수행할 수 있습니다.", "tip": "창 숨기기는 문서 1개여도 가능.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 화면·인쇄·시트 관리 › 화면 설정 · 기출 26-03"},
{"id": "S2-128", "t": "06 화면·인쇄·시트", "q": "다음 중 '행/열 숨기기' 기능에 대한 설명으로 잘못된 것은?", "c": ["숨겨진 행이나 열이 포함되도록 범위를 지정한 후 행 높이나 열 너비를 조절해도 숨겨진 행이나 열은 화면에 표시되지 않는다.", "[A1] 셀의 행이 숨겨진 경우 이름 상자에 'A1'을 입력하고 [Enter]를 누른 후 [홈] → [셀] → [서식] → [숨기기 및 숨기기 취소] → [행 숨기기 취소]를 선택하면 [A1] 셀이 화면에 표시된다.", "숨겨진 행이나 열은 인쇄 시 출력되지 않는다.", "숨겨진 열이나 행은 정렬 시 이동되지 않는다."], "a": 0, "e": "숨겨진 행·열이 포함되도록 범위를 지정한 후 행 높이나 열 너비를 조절하면 숨겨진 행·열이 화면에 표시되고 같은 크기로 조절됩니다.", "tip": "범위 지정 후 크기 조절 → 숨김 해제.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 화면·인쇄·시트 관리 › 행/열 숨기기 · 기출 26-02, 26-03"},
{"id": "S2-129", "t": "06 화면·인쇄·시트", "q": "다음 중 페이지 나누기에 대한 설명으로 옳지 않은 것은?", "c": ["페이지 나누기는 워크시트를 인쇄할 수 있도록 페이지 단위로 나누는 구분선이다.", "[페이지 나누기 미리 보기] 상태에서 마우스로 페이지 나누기 구분선을 클릭하여 끌면 페이지를 나눌 위치를 조정할 수 있다.", "행 높이와 열 너비를 변경해도 자동 페이지 나누기 구분선의 위치는 변경되지 않는다.", "[페이지 나누기 미리 보기] 상태에서 파선은 자동 페이지 나누기를 나타내고 실선은 사용자 지정 페이지 나누기를 나타낸다."], "a": 2, "e": "행 높이나 열 너비를 변경하면 한 페이지에 들어가는 양이 달라져 자동 페이지 나누기 구분선의 위치도 변경됩니다.", "tip": "크기 변경 → 자동 구분선 이동.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 화면·인쇄·시트 관리 › 페이지 나누기 · 기출 24-01, 24-03, 24-04, 25-01, 25-03, 25-06, 26-01", "h": 1},
{"id": "S2-130", "t": "06 화면·인쇄·시트", "q": "다음 중 '페이지 나누기' 기능에 관한 설명으로 옳지 않은 것은?", "c": ["'페이지 나누기 미리 보기' 상태에서는 데이터의 입력이나 편집을 할 수 없다.", "페이지 구분선을 마우스로 드래그 하여 구분선의 위치를 변경할 수 있다.", "수동으로 삽입된 페이지 나누기는 실선으로 표시되고 자동으로 추가된 페이지 나누기는 파선으로 표시된다.", "인쇄할 데이터가 많아 한 페이지가 넘어가면 자동으로 페이지 구분선이 삽입된다."], "a": 0, "e": "[페이지 나누기 미리 보기] 상태에서도 데이터를 입력하거나 편집할 수 있습니다.", "tip": "미리 보기 상태에서도 편집 가능.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 화면·인쇄·시트 관리 › 페이지 나누기 · 기출 25-04"},
{"id": "S2-131", "t": "06 화면·인쇄·시트", "q": "다음 중 [시트 보호] 기능에 대한 설명으로 옳지 않은 것은?", "c": ["새 워크시트의 모든 셀은 기본적으로 '잠금' 속성이 설정되어 있다.", "워크시트에 있는 셀을 보호하기 위해서는 먼저 셀의 '잠금' 속성을 해제해야 한다.", "시트 보호를 설정하면 셀에 데이터를 입력하거나 수정하려고 했을 때 경고 메시지가 나타난다.", "셀의 '잠금' 속성과 '숨김' 속성은 시트를 보호하기 전까지는 아무런 효과를 내지 못한다."], "a": 1, "e": "셀을 보호하려면 '잠금' 속성을 설정한 상태에서 [시트 보호]를 실행해야 합니다. 잠금을 해제한 셀은 보호되지 않습니다.", "tip": "보호하려면 잠금 유지 + 시트 보호.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 화면·인쇄·시트 관리 › 시트 보호 · 기출 25-02, 26-02, 26-03", "h": 1},
{"id": "S2-132", "t": "06 화면·인쇄·시트", "q": "다음 중 시트 보호와 통합 문서 보호에 대한 설명으로 옳지 않은 것은?", "c": ["시트 보호에서 '잠긴 셀 선택'을 허용하지 않으려면 시트 보호 설정 전 [셀 서식] 대화상자의 [보호] 탭에 '숨김' 항목이 선택되어 있어야 한다.", "시트 보호 시 시트 보호 해제 암호를 지정할 수 있으며, 암호를 설정하지 않으면 모든 사용자가 시트의 보호를 해제하고 보호된 요소를 변경할 수 있다.", "통합 문서 보호는 시트의 삽입, 삭제, 이동, 숨기기, 이름 바꾸기 등의 작업을 할 수 없도록 보호하는 것이다.", "통합 문서 보호는 [검토] 탭 [보호] 그룹에서 '통합 문서 보호'를 클릭하여 실행한다."], "a": 0, "e": "'잠긴 셀 선택' 허용 여부는 [시트 보호] 대화상자에서 해당 항목의 체크를 해제하여 설정합니다. [셀 서식]의 '숨김'은 수식 숨기기 속성입니다.", "tip": "잠긴 셀 선택 = 시트 보호 대화상자 항목.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 화면·인쇄·시트 관리 › 시트·통합 문서 보호 · 기출 24-01"},
{"id": "S2-133", "t": "06 화면·인쇄·시트", "q": "다음 중 워크시트 작업 및 관리에 대한 설명으로 옳지 않은 것은?", "c": ["시트 삭제 작업은 실행을 취소할 수 없다.", "열 너비를 기본값으로 되돌리려면 열 머리글 경계선을 마우스로 더블클릭한다.", "그룹화 된 시트에서 데이터 입력 및 편집 등의 작업을 실행하면 그룹 내 시트에 동일한 작업이 실행된다.", "연속된 시트의 선택은 [Shift]를 사용하면 편리하다."], "a": 1, "e": "열 머리글 경계선을 더블클릭하면 데이터 길이에 맞게 열 너비가 자동 조정됩니다. 기본값 복원은 [홈] → [서식] → [기본 너비]로 합니다.", "tip": "더블클릭 = 자동 맞춤.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 화면·인쇄·시트 관리 › 워크시트 관리 · 기출 24-01, 25-04, 25-06, 26-01", "h": 1},
{"id": "S2-134", "t": "06 화면·인쇄·시트", "q": "다음 중 워크시트 작업 및 관리에 대한 설명으로 옳지 않은 것은?", "c": ["시트 삭제 작업은 실행을 취소할 수 없다.", "[Shift]+[F10]을 누르면 현재 시트의 뒤에 새 워크시트가 삽입된다.", "그룹화 된 시트에서 데이터 입력 및 편집 등의 작업을 실행하면 그룹내 시트에 동일한 작업이 실행된다.", "연속된 시트의 선택은 [Shift]를 사용하면 편리하다."], "a": 1, "e": "새 워크시트를 삽입하는 키는 [Shift]+[F11]입니다. [Shift]+[F10]은 바로 가기 메뉴를 표시합니다.", "tip": "시트 삽입 = Shift+F11.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 화면·인쇄·시트 관리 › 워크시트 관리 · 기출 24-03, 25-03"},
{"id": "S2-135", "t": "06 화면·인쇄·시트", "q": "다음 중 여러 워크시트를 선택하여 그룹으로 설정한 경우에 대한 설명으로 옳지 않은 것은?", "c": ["엑셀 창의 맨 위 제목 표시줄에 '그룹'이라고 표시된다.", "그룹 상태에서 도형이나 차트 등의 그래픽 개체는 삽입되지 않는다.", "그룹 상태에서는 정렬 및 필터 기능을 수행할 수 없다.", "그룹으로 설정된 상태에서 하나의 시트를 선택하고 [이동/복사]를 수행하면 현재 선택된 시트만 [이동/복사]가 수행된다."], "a": 3, "e": "그룹 상태에서 [이동/복사]를 수행하면 그룹으로 묶인 모든 시트가 함께 이동/복사됩니다.", "tip": "그룹 상태 = 모든 시트에 동일 작업.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 화면·인쇄·시트 관리 › 시트 그룹 · 기출 25-06"},
{"id": "S2-136", "t": "06 화면·인쇄·시트", "q": "다음 중 [페이지 설정] 대화상자의 [시트] 탭에 대한 설명으로 옳지 않은 것은?", "c": ["셀에 삽입된 메모나 노트를 시트 끝에 인쇄되도록 설정할 수 있다.", "셀 구분선이나 그림 개체 등은 제외하고 셀에 입력된 데이터만 인쇄되도록 설정할 수 있다.", "워크시트의 행/열 머리글과 눈금선이 인쇄되도록 설정할 수 있다.", "용지 여백과 용지 크기를 설정할 수 있다."], "a": 3, "e": "용지 여백은 [여백] 탭, 용지 크기는 [페이지] 탭에서 설정합니다.", "tip": "여백 = 여백 탭, 용지 크기 = 페이지 탭.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 화면·인쇄·시트 관리 › 페이지 설정 - 시트 탭 · 기출 25-01, 26-01"},
{"id": "S2-137", "t": "06 화면·인쇄·시트", "q": "다음 중 [페이지 설정] 대화상자의 [시트] 탭에 대한 설명으로 옳지 않은 것은?", "c": ["[행/열 머리글]을 선택하면 틀 고정으로 지정된 영역의 왼쪽 열과 위쪽 행이 페이지마다 반복하여 인쇄된다.", "모든 페이지에 반복 인쇄할 인쇄 제목을 지정할 수 있다.", "메모 인쇄 위치를 '시트 끝'으로 지정하면 가장 마지막 시트 끝에 모아서 인쇄된다.", "시트에 표시된 셀 눈금선의 인쇄 여부를 지정할 수 있다."], "a": 0, "e": "[행/열 머리글]은 A, B, C와 1, 2, 3 같은 머리글의 인쇄 여부이며, 페이지마다 반복 인쇄하는 것은 '인쇄 제목'입니다.", "tip": "반복 인쇄 = 인쇄 제목.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "2과목 › 화면·인쇄·시트 관리 › 페이지 설정 - 시트 탭 · 기출 25-05"},
