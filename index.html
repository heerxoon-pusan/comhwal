<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>컴퓨터활용능력 2급 필기 대비 앱</title>
<meta name="description" content="컴퓨터활용능력 2급 필기 기출 문제풀이 - 새 문제 첫 시도 정답 + 재도전 방식">

<style>
:root{
  --bg:#EEF2F5; --surface:#FFFFFF; --ink:#101828; --muted:#5B6676; --line:#D5DCE4;
  --ok:#12805C; --okbg:#E4F5EE; --bad:#B42318; --badbg:#FDECEA;
  --s1:#0F766E; --s2:#4338CA; --s3:#B45309; --btn:#101828; --btnink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E141B; --surface:#16202B; --ink:#E7ECF2; --muted:#93A0B0; --line:#2A3644;
    --ok:#4CC38A; --okbg:#12291F; --bad:#FF8A80; --badbg:#34181A;
    --s1:#2DD4BF; --s2:#A5B4FC; --s3:#FBBF24; --btn:#E7ECF2; --btnink:#0E141B;
  }
}
:root[data-theme="dark"]{
  --bg:#0E141B; --surface:#16202B; --ink:#E7ECF2; --muted:#93A0B0; --line:#2A3644;
  --ok:#4CC38A; --okbg:#12291F; --bad:#FF8A80; --badbg:#34181A;
  --s1:#2DD4BF; --s2:#A5B4FC; --s3:#FBBF24; --btn:#E7ECF2; --btnink:#0E141B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.55;-webkit-text-size-adjust:100%}
#app{max-width:560px;margin:0 auto;padding:20px 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc,var(--ink));outline-offset:2px}
.s1{--acc:var(--s1)}.s2{--acc:var(--s2)}.s3{--acc:var(--s3)}

h1{font-size:1.5rem;font-weight:900;margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
.who{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:16px}
.who b{font-weight:700}
.link{background:none;border:0;padding:6px 4px;color:var(--muted);text-decoration:underline;font-size:.85rem}

.field{display:flex;gap:8px;margin:12px 0 4px}
.field input{flex:1;min-width:0;font:inherit;padding:14px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:12px;padding:14px 20px;font-weight:700;min-height:48px}
.btn.wide{width:100%;margin-top:16px}
.btn.line{background:transparent;color:var(--ink);border:1.5px solid var(--line)}

.subjects{display:grid;gap:12px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-left:8px solid var(--acc);border-radius:14px;padding:16px 16px 14px}
.card .n{font-weight:900;font-size:1.15rem;color:var(--acc)}
.card .t{font-weight:700;margin:2px 0 6px}
.card .m{font-size:.85rem;color:var(--muted)}
.card.done{background:var(--okbg)}
.badge{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--acc);color:var(--surface);margin-top:8px}
.redo{margin-top:4px}

.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.chip{font-weight:700;font-size:.85rem;padding:3px 12px;border-radius:999px;border:1.5px solid var(--acc);color:var(--acc)}
.count{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;display:inline-block}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:999px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.topic{font-size:.85rem;color:var(--muted);margin-bottom:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hot{font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--acc);color:var(--surface)}
.q{white-space:pre-line;font-size:1.2rem;font-weight:700;line-height:1.5;margin:0 0 18px;letter-spacing:-.01em;word-break:keep-all}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:14px 14px;min-height:54px;word-break:keep-all;position:relative;transition:background-color .25s,border-color .25s,opacity .3s,transform .15s;animation:rise .45s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*65ms + 140ms)}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem;font-weight:700;color:var(--muted)}
.choice.ox{justify-content:center;align-items:center;font-weight:700;font-size:1.05rem}
.choice.ok{border-color:var(--ok);background:var(--okbg)}
.choice.ok .k{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.choice.bad{border-color:var(--bad);background:var(--badbg)}
.choice.bad .k{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.choice.dim{opacity:.55}
.fb{margin-top:16px;border-radius:12px;padding:14px 16px;border:1.5px solid}
.fb.ok{border-color:var(--ok);background:var(--okbg)}
.fb.bad{border-color:var(--bad);background:var(--badbg)}
.fb b{display:block;margin-bottom:4px}
.fb.ok b{color:var(--ok)}.fb.bad b{color:var(--bad)}
.fb p{margin:0;font-size:.95rem}
.fb .src{margin-top:6px;font-size:.8rem;color:var(--muted)}

.cert{background:var(--surface);border:2px solid var(--acc);border-radius:18px;padding:22px 18px;text-align:center}
.cert .h{font-weight:700;color:var(--acc);font-size:1rem}
.cert .name{font-size:2.1rem;font-weight:900;margin:8px 0 2px;letter-spacing:-.02em}
.cert .subj{color:var(--muted);margin-bottom:14px}
.cert .score{font-size:3.4rem;font-weight:900;color:var(--acc);line-height:1;font-variant-numeric:tabular-nums}
.cert .score small{font-size:1.2rem;font-weight:700;color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:16px 0}
.stats div{border:1.5px solid var(--line);border-radius:12px;padding:8px}
.stats span{display:block;font-size:.78rem;color:var(--muted)}
.stats b{font-variant-numeric:tabular-nums}
.clock{border:1.5px dashed var(--acc);border-radius:14px;padding:12px 8px;margin-top:6px}
.clock span{display:block;font-size:.78rem;color:var(--muted)}
.clock b{font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.clock .d{font-size:.9rem;font-weight:500;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:6px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.25}}
.code{margin-top:12px;font-size:.85rem;color:var(--muted)}
.code b{color:var(--ink);letter-spacing:.12em}
.actions{display:grid;gap:8px;margin-top:16px}

/* ---------- 애니메이션 ---------- */
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes enterR{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes leaveL{to{opacity:0;transform:translateX(-34px)}}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}38%{transform:translateX(8px)}58%{transform:translateX(-5px)}78%{transform:translateX(3px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--ok)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes kpop{from{transform:scale(.2) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
@keyframes bump{40%{transform:scale(1.4);color:var(--acc)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes certIn{from{opacity:0;transform:scale(.86) translateY(24px)}to{opacity:1;transform:none}}
.rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
.qwrap{animation:enterR .38s cubic-bezier(.2,.7,.2,1) backwards}
.qwrap.leave{animation:leaveL .22s ease-in forwards;pointer-events:none}
.q{animation:rise .5s .05s cubic-bezier(.2,.7,.2,1) backwards}
.choice:active:not(:disabled){transform:scale(.985)}
@media (hover:hover){.choice:not(:disabled):hover{border-color:var(--acc)}.card:hover{transform:translateY(-2px)}}
.card{transition:transform .2s,border-color .2s}
.card:active{transform:scale(.99)}
.choice.ok.picked{animation:pop .5s cubic-bezier(.3,1.5,.5,1),ring .8s ease-out}
.choice.bad.picked{animation:shake .5s}
.choice.ok.late{transition-delay:.3s;animation:ring .9s .3s ease-out}
.choice.ok .k,.choice.bad .k{animation:kpop .4s .05s cubic-bezier(.3,1.6,.5,1) backwards}
.choice.ok.late .k{animation-delay:.35s}
.count.bump{animation:bump .5s}
.fb{animation:rise .42s .05s cubic-bezier(.2,.7,.2,1) backwards}
.nx{animation:rise .42s .2s cubic-bezier(.2,.7,.2,1) backwards}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.fp{position:absolute;display:block;will-change:transform,opacity}
.cert{animation:certIn .7s cubic-bezier(.2,1.15,.3,1) backwards}
.chk{width:68px;height:68px;display:block;margin:0 auto 6px;fill:none;stroke:var(--acc);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.chk circle{stroke-dasharray:145;stroke-dashoffset:145;animation:draw .7s .15s ease-out forwards}
.chk path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .75s ease-out forwards}
.stats div{animation:rise .5s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--j,0)*80ms + 650ms)}
.clock{animation:rise .5s 1.05s cubic-bezier(.2,.7,.2,1) backwards}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .chk circle,.chk path{stroke-dashoffset:0}
}

/* ---------- 신중 풀이 버전 추가 스타일 ---------- */
.stat{margin:0 0 10px;font-weight:700;font-size:.95rem;font-variant-numeric:tabular-nums}
.stat b{display:inline-block}
.stat .dim2{color:var(--muted);font-weight:500;margin:0 2px}
.stat b.bump{animation:bump .5s}
.retry{font-size:.75rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1.5px solid var(--bad);color:var(--bad)}
.notice{margin-top:16px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--bad);background:var(--badbg);font-size:.92rem;animation:rise .42s .02s cubic-bezier(.2,.7,.2,1) backwards}
.notice b{color:var(--bad)}
.fb .part{margin-top:12px}
.fb .part i{display:block;font-style:normal;font-size:.75rem;font-weight:700;color:var(--muted);margin-bottom:2px}
.fb .part p{word-break:keep-all}
.fb b.ans{display:block;margin-bottom:2px;color:var(--ok)}
.fb .tip{margin-top:10px;font-size:.9rem;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px dashed var(--line)}
.intro .msg{font-size:1.15rem;font-weight:700;margin:10px 0 4px;word-break:keep-all;line-height:1.6}
.intro .stats{margin-bottom:4px}
</style>
</head>

<script>
/*BANK_START*/
const BANK = {"1":[{"id": "S1-001", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터의 연산장치에 있는 누산기(Accumulator)에 관한 설명으로 옳은 것은?", "c": ["연산 결과를 일시적으로 기억하는 장치이다.", "명령의 순서를 기억하는 장치이다.", "명령어를 기억하는 장치이다.", "명령을 해독하는 장치이다."], "a": 0, "e": "누산기는 연산장치에서 연산 결과를 일시적으로 보관하는 레지스터입니다.", "tip": "누산기 = 연산 결과 임시 보관.", "w": ["", "프로그램 카운터(PC)의 설명입니다.", "명령 레지스터(IR)의 설명입니다.", "명령 해독기(Decoder)의 설명입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 연산장치·레지스터 · 기출 24-01, 25-01"},
{"id": "S1-002", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터에서 사용하는 각 기억장치의 접근 속도가 빠른 것에서 느린 순서로 옳게 나열된 것은?", "c": ["레지스터 → 캐시 메모리 → 주기억장치 → 보조기억장치", "캐시 메모리 → 레지스터 → 주기억장치 → 보조기억장치", "레지스터 → 캐시 메모리 → 보조기억장치 → 주기억장치", "캐시 메모리 → 레지스터 → 보조기억장치 → 주기억장치"], "a": 0, "e": "CPU 내부 레지스터가 가장 빠르고, 캐시 메모리, 주기억장치(RAM), 보조기억장치(HDD 등) 순으로 느려집니다.", "tip": "레·캐·주·보 (빠른 → 느린).", "w": ["", "캐시 메모리보다 레지스터가 더 빠릅니다.", "보조기억장치가 주기억장치보다 느립니다.", "레지스터가 가장 빠르고, 보조기억장치는 주기억장치보다 느립니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 기억장치 · 기출 24-01, 24-04, 25-01", "h": 1},
{"id": "S1-003", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터에서 사용하는 유니코드(Unicode)에 관한 설명으로 옳은 것은?", "c": ["표현 가능한 문자수는 최대 256자이다.", "에러 검출이나 교정이 가능한 코드이다.", "연산을 빠르게 수행하기 위하여 Zone 비트와 Digit 비트로 구성한다.", "데이터의 처리나 교환을 위하여 1개 문자를 16비트로 표현한다."], "a": 3, "e": "유니코드는 전 세계 문자를 2바이트(16비트)로 표현하는 국제 표준 코드입니다.", "tip": "유니코드 = 16비트, 전 세계 문자.", "w": ["256자는 확장 ASCII 코드의 표현 범위입니다.", "오류 검출·교정은 해밍 코드의 기능입니다.", "Zone·Digit 비트는 BCD 계열 코드의 구성입니다.", ""], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 문자 표현 코드 · 기출 24-01, 25-01"},
{"id": "S1-004", "t": "01 하드웨어·자료 표현", "q": "다음 중 플래시 메모리(Flash Memory)에 관한 설명으로 옳지 않은 것은?", "c": ["정보의 입출력이 자유롭고, 전송 속도가 빠르다.", "비휘발성 기억장치이다.", "트랙 단위로 저장된다.", "전력 소모가 적다."], "a": 2, "e": "플래시 메모리는 트랙 단위가 아니라 블록 단위로 저장·삭제합니다. 트랙 단위 저장은 하드디스크의 방식입니다.", "tip": "플래시 = 블록 단위, HDD = 트랙.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 플래시 메모리 · 기출 24-01, 24-02, 25-05", "h": 1},
{"id": "S1-005", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터에서 사용하는 일반 하드디스크에 비하여 속도가 빠르고 기계적 지연이나 에러의 확률 및 발열·소음이 적으며, 소형화·경량화할 수 있는 하드디스크 대체 저장장치는?", "c": ["DVD", "HDD", "SSD", "ZIP"], "a": 2, "e": "SSD(Solid State Drive)는 플래시 메모리 기반이라 기계적 구동부가 없어 빠르고 조용하며 가볍습니다.", "tip": "SSD = 기계 부품 없는 저장장치.", "w": ["DVD는 광디스크 저장 매체입니다.", "HDD가 바로 비교 대상인 일반 하드디스크입니다.", "", "ZIP은 이동식 자기 디스크 저장 매체입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › SSD · 기출 24-01, 25-05"},
{"id": "S1-006", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터의 롬(ROM)에 기록되어 하드웨어를 제어하며, 하드웨어의 성능 향상을 위해 업그레이드 할 수 있는 마이크로프로그램의 집합을 의미하는 것은?", "c": ["프리웨어(Freeware)", "셰어웨어(Shareware)", "미들웨어(Middleware)", "펌웨어(Firmware)"], "a": 3, "e": "펌웨어는 ROM에 저장되어 하드웨어를 제어하는 소프트웨어로, 업데이트가 가능합니다.", "tip": "ROM 속 소프트웨어 = 펌웨어.", "w": ["무료로 사용·배포하는 소프트웨어입니다.", "기능이나 기간을 제한해 배포하는 소프트웨어입니다.", "운영체제와 응용 프로그램 사이를 연결하는 소프트웨어입니다.", ""], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › ROM·펌웨어 · 기출 24-01, 25-03"},
{"id": "S1-007", "t": "01 하드웨어·자료 표현", "q": "다음 중 디지털 컴퓨터와 아날로그 컴퓨터의 차이점에 관한 설명으로 옳은 것은?", "c": ["디지털 컴퓨터는 전류, 전압, 온도 등 다양한 입력 값을 처리하며, 아날로그 컴퓨터는 숫자 데이터만을 처리한다.", "디지털 컴퓨터는 증폭 회로로 구성되며, 아날로그 컴퓨터는 논리 회로로 구성된다.", "아날로그 컴퓨터는 미분이나 적분 연산을 주로 하며, 디지털 컴퓨터는 산술이나 논리 연산을 주로 한다.", "아날로그 컴퓨터는 범용이며, 디지털 컴퓨터는 특수 목적용으로 많이 사용된다."], "a": 2, "e": "아날로그 컴퓨터는 미분·적분 같은 연속적 연산, 디지털 컴퓨터는 산술·논리 연산을 주로 합니다.", "tip": "아날로그 = 미적분, 디지털 = 산술·논리.", "w": ["입력 값 설명이 서로 바뀌었습니다. 아날로그가 연속적인 물리량을, 디지털이 숫자를 처리합니다.", "구성 회로가 바뀌었습니다. 디지털은 논리 회로, 아날로그는 증폭 회로입니다.", "", "용도가 바뀌었습니다. 디지털이 범용, 아날로그가 특수 목적용입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 컴퓨터 분류 · 기출 24-01, 25-06, 26-01", "h": 1},
{"id": "S1-008", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터에서 사용되는 바이트(Byte)에 대한 설명으로 옳지 않은 것은?", "c": ["1바이트는 8비트로 구성된다.", "일반적으로 영문자나 숫자는 1Byte로 한 글자를 표현하고, 한글 및 한자는 2Byte로 한 글자를 표현한다.", "1바이트는 컴퓨터에서 각종 명령을 처리하는 기본 단위이다.", "1바이트로는 256가지의 정보를 표현할 수 있다."], "a": 2, "e": "컴퓨터에서 명령을 처리하는 기본 단위는 워드(Word)입니다. 바이트는 문자를 표현하는 기본 단위입니다.", "tip": "바이트 = 문자 단위, 워드 = 명령 처리 단위.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 자료 단위 · 기출 24-03, 25-06, 26-01", "h": 1},
{"id": "S1-009", "t": "01 하드웨어·자료 표현", "q": "다음 중 자료의 구성 단위에 대한 설명으로 옳지 않은 것은?", "c": ["데이터베이스(Database)는 관련된 데이터 파일들의 집합을 말한다.", "워드(Word)는 컴퓨터에서 한 번에 처리할 수 있는 명령 단위를 나타낸다.", "니블(Nibble)은 4개의 비트가 모여 1개의 니블을 구성한다.", "비트(Bit)는 정보의 최소 단위이며, 5비트가 모여 1바이트(Byte)가 된다."], "a": 3, "e": "8비트가 모여 1바이트가 됩니다.", "tip": "비트 8개 = 1바이트, 4개 = 니블.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 자료 구성 단위 · 기출 24-03, 25-02"},
{"id": "S1-010", "t": "01 하드웨어·자료 표현", "q": "다음 중 1GB(Giga Byte)에 해당하는 것은?", "c": ["1024 Bytes", "1024 × 1024 Bytes", "1024 × 1024 × 1024 Bytes", "1024 × 1024 × 1024 × 1024 Bytes"], "a": 2, "e": "1KB = 1024B, 1MB = 1024KB, 1GB = 1024MB 이므로 1GB = 1024 × 1024 × 1024 Bytes 입니다.", "tip": "KB→MB→GB→TB 모두 1024배씩.", "w": ["1024 Bytes는 1KB입니다.", "1024 × 1024 Bytes는 1MB입니다.", "", "1024의 4제곱 Bytes는 1TB입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 1GB · 기출 25-04"},
{"id": "S1-011", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터의 연산 속도 단위로 가장 빠른 것은?", "c": ["1ms", "1㎲", "1ns", "1ps"], "a": 3, "e": "ms(10⁻³초) > ㎲(10⁻⁶) > ns(10⁻⁹) > ps(10⁻¹²) > fs(10⁻¹⁵) > as(10⁻¹⁸) 순으로 빨라집니다.", "tip": "밀·마·나·피·펨·아 (느림 → 빠름).", "w": ["1ms는 10⁻³초로 가장 느립니다.", "1㎲는 10⁻⁶초입니다.", "1ns는 10⁻⁹초입니다.", ""], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 연산 속도 단위 · 기출 24-03, 26-01"},
{"id": "S1-012", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터의 연산 속도 단위로 가장 빠른 것은?", "c": ["1ps", "1fs", "1as", "1ns"], "a": 2, "e": "as(아토초, 10⁻¹⁸초)가 가장 빠른 단위입니다. ns < ps < fs < as 순으로 빨라집니다.", "tip": "아토(as)가 가장 작은 시간 단위.", "w": ["1ps는 10⁻¹²초입니다.", "1fs는 10⁻¹⁵초입니다.", "", "1ns는 10⁻⁹초로 가장 느립니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 연산 속도 단위 · 기출 25-03"},
{"id": "S1-013", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터 하드디스크의 연결 방식인 SATA(Serial ATA)에 관한 설명으로 옳지 않은 것은?", "c": ["병렬 인터페이스 방식이다.", "핫 플러그인 기능을 지원한다.", "CMOS에서 지정하면 자동으로 Master와 Slave가 지정된다.", "데이터 전송 속도가 빠르다."], "a": 0, "e": "SATA는 이름 그대로 직렬(Serial) 인터페이스 방식입니다. 병렬 방식은 기존의 IDE(PATA)입니다.", "tip": "Serial ATA = 직렬.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › SATA · 기출 25-03, 26-01"},
{"id": "S1-014", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터에서 사용하는 USB 장치에 관한 설명으로 옳지 않은 것은?", "c": ["주변장치를 127개까지 연결할 수 있다.", "컴퓨터의 전원이 켜진 상태에서도 장치를 연결하거나 제거할 수 있다.", "기존의 직렬, 병렬, PS/2 포트 등을 하나의 포트로 대체하기 위한 범용 직렬 버스이다.", "한 번에 8비트의 데이터가 동시에 전송되는 방식을 사용한다."], "a": 3, "e": "USB는 직렬 전송 방식으로 데이터를 한 비트씩 순차적으로 전송합니다.", "tip": "USB = Universal Serial Bus(직렬).", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › USB · 기출 24-02, 25-01"},
{"id": "S1-015", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터에서 사용하는 하드디스크의 파티션에 대한 설명으로 옳지 않은 것은?", "c": ["하나의 물리적인 하드디스크를 여러 개의 파티션으로 나눌 수 있다.", "파티션을 나눈 후에 하드디스크를 사용하기 위해서는 포맷을 해야 한다.", "하나의 하드디스크 내의 모든 파티션에는 동일한 운영체제만 설치할 수 있다.", "하나의 파티션에는 한 가지 파일 시스템만을 설치할 수 있다."], "a": 2, "e": "파티션마다 서로 다른 운영체제를 설치할 수 있습니다(멀티 부팅).", "tip": "파티션별로 OS를 따로 설치 가능.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 하드디스크 파티션 · 기출 25-04, 26-01"},
{"id": "S1-016", "t": "01 하드웨어·자료 표현", "q": "다음 중 하드디스크 용량이 부족할 경우의 해결 방법으로 옳지 않은 것은?", "c": ["USB 파일 정리", "휴지통 파일 정리", "디스크 정리 수행", "Windows 기능 제거"], "a": 0, "e": "USB 메모리의 파일을 정리해도 하드디스크의 용량은 늘어나지 않습니다.", "tip": "하드디스크 안에서 확보해야 한다.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 하드디스크 관리 · 기출 25-04"},
{"id": "S1-017", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터가 취급하는 데이터의 형태에 따라 분류한 컴퓨터가 아닌 것은?", "c": ["하이브리드 컴퓨터", "데스크톱 컴퓨터", "아날로그 컴퓨터", "디지털 컴퓨터"], "a": 1, "e": "취급하는 데이터 형태에 따라 디지털·아날로그·하이브리드 컴퓨터로 분류합니다. 데스크톱은 크기·용도에 따른 분류입니다.", "tip": "데이터 형태 3종: 디지털·아날로그·하이브리드.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 컴퓨터 분류 · 기출 25-02"},
{"id": "S1-018", "t": "01 하드웨어·자료 표현", "q": "다음 중 의류, 시계, 안경 등 사람이 몸에 착용하고 다닐 수 있는 컴퓨터를 의미하는 것은?", "c": ["슈퍼 컴퓨터", "미니 컴퓨터", "웨어러블 컴퓨터", "메인 프레임"], "a": 2, "e": "웨어러블(Wearable) 컴퓨터는 몸에 착용하여 사용하는 컴퓨터입니다.", "tip": "입는 컴퓨터 = 웨어러블.", "w": ["초고속 대용량 연산용 컴퓨터입니다.", "중형 규모의 다중 사용자용 컴퓨터입니다.", "", "대형 범용 컴퓨터로 대규모 업무 처리에 사용됩니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 컴퓨터 분류 · 기출 25-06"},
{"id": "S1-019", "t": "01 하드웨어·자료 표현", "q": "다음 중 주기억장치에 대한 설명으로 가장 옳지 않은 것은?", "c": ["주기억장치는 비휘발성 메모리로 대용량의 데이터와 프로그램을 영구적으로 보관하는데 사용된다.", "ROM에는 주로 기본 입/출력 시스템(BIOS), 글자 폰트, 자가 진단 프로그램(POST) 등이 저장되어 있다.", "주기억장치는 CPU가 직접 접근하여 데이터를 처리할 수 있는 기억장치로 현재 수행되는 프로그램과 데이터를 저장하고 있다.", "RAM(Random Access Memory)은 DRAM과 SRAM으로 구분된다."], "a": 0, "e": "주기억장치의 RAM은 전원이 꺼지면 내용이 사라지는 휘발성입니다. 영구 보관은 보조기억장치의 역할입니다.", "tip": "RAM = 휘발성, 영구 보관 = 보조기억장치.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 주기억장치 · 기출 26-02"},
{"id": "S1-020", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터의 기억장치에 관한 설명으로 옳은 것은?", "c": ["캐시 메모리 : CPU와 주기억장치 사이에서 컴퓨터의 처리 속도를 향상시키기 위한 것", "가상 메모리 : 주기억장치에 저장된 정보에 접근할 때 주소 대신 기억된 정보의 내용의 일부를 이용하여 직접 접근하는 장치", "연관 메모리 : 보조기억장치의 일부를 주기억장치처럼 사용하는 메모리 관리 기법", "버퍼 메모리 : EEPROM의 일종으로, 전력 소모가 적고, 데이터 전송 속도가 빠른 비휘발성 메모리"], "a": 0, "e": "캐시 메모리는 CPU와 주기억장치 사이의 속도 차이를 줄여 처리 속도를 높입니다.", "tip": "캐시 = CPU와 RAM 사이의 속도 보완.", "w": ["", "내용으로 접근하는 방식은 연관 메모리의 설명입니다.", "보조기억장치를 주기억장치처럼 쓰는 기법은 가상 메모리입니다.", "EEPROM의 일종인 비휘발성 메모리는 플래시 메모리의 설명입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 캐시·가상·연관 메모리 · 기출 25-02"},
{"id": "S1-021", "t": "01 하드웨어·자료 표현", "q": "다음 중 프로그램이 실행될 때 발생하는 메인 메모리 부족 문제를 보완하기 위해 하드디스크의 일부를 메인 메모리처럼 사용하게 하는 메모리 관리 기법을 의미하는 것은?", "c": ["캐시 메모리", "디스크 캐시", "연관 메모리", "가상 메모리"], "a": 3, "e": "가상 메모리는 보조기억장치(하드디스크)의 일부를 주기억장치처럼 사용하는 기법입니다.", "tip": "메모리 부족 → 디스크를 메모리처럼 = 가상 메모리.", "w": ["CPU와 주기억장치 사이의 속도 차이를 줄이는 고속 메모리입니다.", "디스크 자료를 메모리에 미리 읽어 두어 디스크 접근을 줄이는 기법입니다.", "저장된 내용(값)으로 접근하는 메모리입니다.", ""], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 가상 메모리 · 기출 24-02, 25-01"},
{"id": "S1-022", "t": "01 하드웨어·자료 표현", "q": "컴퓨터에서 데이터를 주고받는 통로를 버스라고 한다. 다음 중 버스에 대한 설명으로 옳지 않은 것은?", "c": ["내부 버스는 CPU 내부에서 레지스터 간의 데이터 전송에 사용된다.", "외부 버스는 CPU와 주변장치 간의 데이터 전송에 사용되는 통로로, 제어 버스, 주소 버스, 데이터 버스로 나누어진다.", "데이터 버스는 각 장치별로 필요한 데이터가 전달되는 통로이다.", "주소 버스는 제어장치의 제어 신호가 각 장치로 전달되는 통로이다."], "a": 3, "e": "제어 신호를 전달하는 통로는 제어 버스입니다. 주소 버스는 기억장치의 위치(주소)를 지정하는 통로입니다.", "tip": "제어 신호 = 제어 버스, 위치 = 주소 버스.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 버스 · 기출 25-02"},
{"id": "S1-023", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터 시스템에서 사용하는 채널(Channel)에 관한 설명으로 옳지 않은 것은?", "c": ["주변장치에 대한 제어 권한을 CPU로 부터 넘겨받아 CPU 대신 입출력을 관리한다.", "입출력 작업이 끝나면 CPU에게 인터럽트 신호를 보낸다.", "CPU와 주기억장치의 속도 차이를 해결하기 위하여 사용된다.", "채널에는 셀렉터(Selector), 멀티플랙서(Multiplexer), 블록 멀티플랙서(Block Multiplexer) 등이 있다."], "a": 2, "e": "CPU와 주기억장치의 속도 차이를 해결하는 것은 캐시 메모리입니다. 채널은 CPU 대신 입출력을 전담합니다.", "tip": "채널 = 입출력 전담, 속도 차 해결 = 캐시.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 입출력 채널 · 기출 25-04"},
{"id": "S1-024", "t": "01 하드웨어·자료 표현", "q": "다음은 인터럽트(Interrupt)에 대한 설명이다. 잘못된 것은?", "c": ["CPU에게 어떠한 신호를 보내면 처리하고 있던 일을 잠시 보류하고, 신호를 파악하여 정해진 인터럽트 루틴에 따라 처리한다.", "인터럽트에는 외부 인터럽트, 내부 인터럽트, 소프트웨어 인터럽트의 3가지 종류가 있다.", "일반적으로 소프트웨어 인터럽트를 트랩(Trap)이라고도 부른다.", "외부 인터럽트는 입·출력장치, 타이밍 장치, 전원 등의 외부적인 요인에 의해 발생한다."], "a": 2, "e": "트랩(Trap)은 내부 인터럽트(프로그램 오류 등으로 발생)를 가리키는 이름입니다.", "tip": "트랩 = 내부 인터럽트.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 인터럽트 · 기출 25-06"},
{"id": "S1-025", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터의 문자 표현 코드인 ASCII 코드의 특징으로 옳은 것은?", "c": ["BCD 코드를 확장한 코드로 대형 컴퓨터에서 사용한다.", "확장 ASCII 코드는 8비트를 사용하여 256가지의 문자를 표현한다.", "2진화 10진 코드라고도 하며, 하나의 문자를 4개의 Zone 비트와 4개의 Digit 비트로 표현한다.", "에러 검출 및 교정이 가능한 코드로 2비트의 에러 검출 코드가 포함되어 있다."], "a": 1, "e": "확장 ASCII는 8비트(2⁸ = 256)로 256가지 문자를 표현합니다. 표준 ASCII는 7비트(128가지)입니다.", "tip": "표준 7비트, 확장 8비트.", "w": ["BCD 코드를 확장한 코드는 EBCDIC입니다.", "", "2진화 10진 코드는 BCD이며 Zone·Digit 구조의 설명입니다.", "에러 검출·교정이 가능한 코드는 해밍 코드입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 문자 표현 코드 · 기출 25-02"},
{"id": "S1-026", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터에서 사용하는 ASCII 코드에 관한 설명으로 옳은 것은?", "c": ["패리티 비트를 이용하여 오류 검출과 오류 교정이 가능하다.", "표준 ASCII 코드는 3개의 존 비트와 4개의 디지트 비트로 구성되며, 주로 대형 컴퓨터의 범용 코드로 사용된다.", "표준 ASCII 코드는 7비트를 사용하여 영문 대소문자, 숫자, 문장 부호, 특수 제어 문자 등을 표현한다.", "확장 ASCII 코드는 8비트를 사용하며 멀티미디어 데이터 표현에 적합하도록 확장된 코드표이다."], "a": 2, "e": "표준 ASCII는 7비트로 128가지(영문 대소문자, 숫자, 문장 부호, 제어 문자)를 표현합니다.", "tip": "표준 ASCII = 7비트 128자.", "w": ["패리티 비트는 오류 검출만 가능하며 교정은 해밍 코드가 담당합니다.", "존 비트 3개와 디지트 비트 4개로 구성되는 코드는 아니며 대형 컴퓨터용은 EBCDIC입니다.", "", "확장 ASCII는 8비트로 그래픽·특수 문자를 추가한 코드표이며 멀티미디어 표현용이 아닙니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 문자 표현 코드 · 기출 26-02"},
{"id": "S1-027", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터에서 문자 데이터를 표현하는 방법으로 옳지 않은 것은?", "c": ["EBCDIC", "Unicode", "ASCII", "Hamming Code"], "a": 3, "e": "해밍 코드는 오류를 검출하고 교정하는 코드이며 문자 표현 코드가 아닙니다.", "tip": "해밍 = 오류 검출·교정 코드.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 문자 표현 코드 · 기출 25-05, 26-02"},
{"id": "S1-028", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터에서 사용하는 레이저 프린터에 관한 설명으로 옳지 않은 것은?", "c": ["회전하는 드럼에 토너를 묻혀서 인쇄하는 방식이다.", "인쇄 해상도가 높으며 복사기와 같은 원리를 사용한다.", "비충격식이라 비교적 인쇄 소음이 적고 인쇄 속도가 빠르다.", "인쇄 방식에는 드럼식, 체인식, 밴드식 등이 있다."], "a": 3, "e": "드럼식·체인식·밴드식은 충격식 라인 프린터의 인쇄 방식입니다. 레이저 프린터는 비충격식입니다.", "tip": "체인·밴드 = 충격식 라인 프린터.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 프린터 · 기출 24-03, 25-06"},
{"id": "S1-029", "t": "01 하드웨어·자료 표현", "q": "다음 중 컴퓨터에 디스크를 연결하는 전용 인터페이스 방식에 해당되지 않는 것은?", "c": ["USB", "SCSI", "EIDE", "IDE"], "a": 0, "e": "디스크 전용 인터페이스는 IDE, EIDE, SCSI, SATA 등입니다. USB는 범용 직렬 버스입니다.", "tip": "디스크 전용: IDE·EIDE·SCSI·SATA.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 디스크 인터페이스 · 기출 25-04"},
{"id": "S1-030", "t": "01 하드웨어·자료 표현", "q": "다음 중 바이오스에 내장된 램(RAM)의 일종으로, 시스템의 날짜와 시간, 부팅 순서, 전원 관리, PnP 설정 등의 내용을 확인하거나 수정할 수 있는 것은?", "c": ["HDMI", "POST", "CMOS", "RAID"], "a": 2, "e": "CMOS는 날짜·시간, 부팅 순서, 전원 관리 등 시스템 설정을 저장하는 메모리입니다.", "tip": "설정 저장 = CMOS.", "w": ["HDMI는 영상·음성을 하나의 케이블로 전송하는 디지털 포트입니다.", "POST는 전원을 켜면 컴퓨터가 스스로 이상 유무를 검사하는 과정입니다.", "", "RAID는 여러 개의 하드디스크를 하나처럼 관리하는 기술입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › BIOS·CMOS · 기출 26-03"},
{"id": "S1-031", "t": "01 하드웨어·자료 표현", "q": "다음 중 영상신호와 음향신호를 압축하지 않고 통합하여 전송하는 고선명 멀티미디어 인터페이스로, S-비디오, 컴포지트 등의 아날로그 케이블보다 고품질의 음향 및 영상을 감상할 수 있는 것은?", "c": ["HDMI", "DVI", "USB", "IEEE-1394"], "a": 0, "e": "HDMI는 영상과 음향을 하나의 케이블로 비압축 디지털 전송하는 고선명 멀티미디어 인터페이스입니다.", "tip": "영상 + 음향 한 케이블 = HDMI.", "w": ["", "DVI는 영상 신호만 전송하는 디지털 영상 인터페이스입니다.", "USB는 범용 직렬 버스로 주변장치 연결용입니다.", "IEEE-1394는 고속 직렬 버스(파이어와이어)입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 영상 인터페이스 · 기출 26-02"},
{"id": "S1-032", "t": "01 하드웨어·자료 표현", "q": "전원을 켰을 때 화면이 표시되지 않을 경우 확인해야 할 다음 사항 중 가장 거리가 먼 것은?", "c": ["연결된 네트워크 연결장치에 장애가 있는지를 확인한다.", "키보드의 키 중에 [CapsLock]이나 [NumLock]을 누를 때 키보드에서 해당되는 표시등이 들어오는지 확인한다.", "모니터와 그래픽 카드가 올바르게 연결되어 있는지를 확인한다.", "모니터와 본체에 전원이 올바르게 공급되었는지를 확인한다."], "a": 0, "e": "화면이 나오지 않는 문제와 네트워크 장비는 관련이 거리가 멉니다.", "tip": "화면 문제 = 모니터·그래픽 카드·전원.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 컴퓨터 하드웨어·자료 표현 › 하드웨어 점검 · 기출 25-05"},
{"id": "S1-033", "t": "02 소프트웨어·운영체제", "q": "다음 중 자료 처리 방식의 발달 과정으로 옳은 것은?", "c": ["일괄 처리 시스템 - 분산 처리 시스템 - 실시간 처리 시스템", "분산 처리 시스템 - 실시간 처리 시스템 - 일괄 처리 시스템", "실시간 처리 시스템 - 일괄 처리 시스템 - 분산 처리 시스템", "일괄 처리 시스템 - 실시간 처리 시스템 - 분산 처리 시스템"], "a": 3, "e": "처리 방식은 일괄 처리 → 실시간 처리 → 분산 처리 순으로 발달했습니다.", "tip": "일 → 실 → 분.", "w": ["분산 처리는 가장 나중에 나온 방식이므로 맨 앞에 올 수 없습니다.", "실시간 처리가 맨 앞에 오면 발달 순서가 맞지 않습니다. 가장 먼저는 일괄 처리입니다.", "분산 처리는 마지막이고 일괄 처리가 첫 번째입니다.", ""], "p": "1과목 › 소프트웨어·운영체제·언어 › 처리 방식 · 기출 24-02, 25-04"},
{"id": "S1-034", "t": "02 소프트웨어·운영체제", "q": "다음 중 데이터가 발생되는 즉시 처리되어 결과를 바로 확인할 수 있는 시스템으로, 은행이나 여행사의 좌석 예약 조회 서비스 등에 이용되는 것은?", "c": ["실시간 처리 시스템", "일괄 처리 시스템", "분산 처리 시스템", "시분할 시스템"], "a": 0, "e": "실시간 처리 시스템은 데이터가 발생하는 즉시 처리하여 결과를 바로 알려 줍니다.", "tip": "즉시 처리 = 실시간.", "w": ["", "데이터를 모았다가 한꺼번에 처리하는 방식입니다.", "여러 컴퓨터가 작업을 나누어 처리하는 방식입니다.", "한 시스템을 여러 사용자가 시간을 나눠 동시에 쓰는 방식입니다."], "p": "1과목 › 소프트웨어·운영체제·언어 › 실시간 처리 · 기출 25-01"},
{"id": "S1-035", "t": "02 소프트웨어·운영체제", "q": "다음 중 운영체제의 운용 방식으로 옳지 않은 것은?", "c": ["일괄 처리는 컴퓨터에 입력하는 데이터를 일정량 모았다가 한꺼번에 처리하는 시스템으로, 오프라인으로만 사용한다.", "시분할 시스템은 한 대의 시스템을 여러 사용자가 동시에 사용하는 시스템이다.", "실시간 처리 시스템은 처리할 데이터가 생겨날 때마다 바로 처리하는 시스템이다.", "분산 처리 시스템은 지역적으로 분산된 여러 대의 컴퓨터를 연결하여 작업을 분담하여 처리하는 시스템이다."], "a": 0, "e": "일괄 처리는 오프라인뿐 아니라 온라인으로도 사용할 수 있으므로 '오프라인으로만'은 틀린 표현입니다.", "tip": "'~만'이라는 단정 표현을 의심.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 소프트웨어·운영체제·언어 › 운영체제 운용 방식 · 기출 25-05"},
{"id": "S1-036", "t": "02 소프트웨어·운영체제", "q": "다음의 특성들을 갖는 분산 시스템 모델은 어느 것인가?\n• 정보를 제공하는 컴퓨터와 정보를 제공받는 컴퓨터로 구성되어 있다.\n• 정보를 제공받는 컴퓨터와 제공하는 컴퓨터 모두 처리 능력을 가지고 있다.", "c": ["주/종속 시스템(Master/Slave System)", "동배간 처리 시스템(Peer To Peer System)", "호스트 기반(Host Based) 시스템", "클라이언트/서버 시스템(Client/Server System)"], "a": 3, "e": "서비스를 제공하는 서버와 제공받는 클라이언트로 구성되고 양쪽 모두 처리 능력을 가지는 모델은 클라이언트/서버 시스템입니다.", "tip": "제공자 + 이용자 구성 = 클라이언트/서버.", "w": ["한쪽(주)이 다른 쪽(종속)을 제어하는 구조입니다.", "모든 컴퓨터가 서버와 클라이언트 역할을 동등하게 수행합니다.", "중앙 호스트가 처리하고 단말기는 입출력만 담당합니다.", ""], "p": "1과목 › 소프트웨어·운영체제·언어 › 분산 시스템 모델 · 기출 25-03"},
{"id": "S1-037", "t": "02 소프트웨어·운영체제", "q": "프로그램에 대한 다음 설명 중 가장 옳지 않은 것은?", "c": ["프로그램을 작성하기 위해 사용하는 언어를 기계어(Machine Language)라고 한다.", "컴퓨터가 인식하는 명령어를 논리적으로 순서에 맞게 나열하여 모아놓은 것을 프로그램이라 한다.", "컴퓨터 명령어를 이용하여 프로그램을 작성하는 작업을 프로그래밍(Programming)이라 한다.", "프로그램을 작성하는 사람을 프로그래머(Programmer)라 한다."], "a": 0, "e": "프로그램을 작성하기 위해 사용하는 언어는 프로그래밍 언어입니다. 기계어는 컴퓨터가 직접 이해하는 언어입니다.", "tip": "작성용 언어 = 프로그래밍 언어.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 소프트웨어·운영체제·언어 › 프로그램 개념 · 기출 25-05"},
{"id": "S1-038", "t": "02 소프트웨어·운영체제", "q": "다음 설명에 해당하는 프로그래밍 언어는?\n• 인터프리터 방식으로 실행되는 언어이다.\n• 다양한 라이브러리를 통해 빅데이터 분석 및 처리를 효율적으로 수행할 수 있다.\n• 스크립트 언어로서, 간결하고 읽기 쉬운 문법을 제공하며, 자동화 작업에도 많이 사용된다.", "c": ["JAVA", "Perl", "Python", "C#"], "a": 2, "e": "Python은 인터프리터 방식의 스크립트 언어로 간결한 문법과 풍부한 라이브러리로 데이터 분석·자동화에 많이 쓰입니다.", "tip": "빅데이터 분석 + 간결한 문법 = Python.", "w": ["JAVA는 컴파일 후 JVM에서 실행되는 객체지향 언어입니다.", "Perl은 텍스트 처리에 강한 스크립트 언어이나 설명의 핵심(데이터 분석)과 거리가 있습니다.", "", "C#은 마이크로소프트의 객체지향 언어입니다."], "p": "1과목 › 소프트웨어·운영체제·언어 › 프로그래밍 언어 · 기출 26-01"},
{"id": "S1-039", "t": "02 소프트웨어·운영체제", "q": "다음 중 프로그래밍 언어가 아닌 것은?", "c": ["SPSS", "UNIX", "LISP", "COBOL"], "a": 1, "e": "UNIX는 운영체제입니다. LISP(인공지능), COBOL(사무용)은 프로그래밍 언어입니다.", "tip": "UNIX = 운영체제.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 소프트웨어·운영체제·언어 › 프로그래밍 언어 · 기출 25-03"},
{"id": "S1-040", "t": "02 소프트웨어·운영체제", "q": "다음 중 추상화, 캡슐화, 상속성, 다형성 등의 특징을 지니고 있으며, 크고 복잡한 프로그램 구축이 어려운 절차형 언어의 문제점을 해결하기 위해 개발된 프로그래밍 기법은?", "c": ["구조적 프로그래밍", "객체지향 프로그래밍", "비주얼 프로그래밍", "하향식 프로그래밍"], "a": 1, "e": "캡슐화·상속성·다형성은 객체지향 프로그래밍의 대표 특징입니다.", "tip": "캡슐화·상속·다형성 = 객체지향.", "w": ["명령문의 순차·선택·반복 구조로 프로그램을 작성하는 기법입니다.", "", "그래픽 환경에서 아이콘 등으로 프로그램을 작성하는 기법입니다.", "큰 문제를 작은 문제로 나누어 해결하는 설계 기법입니다."], "p": "1과목 › 소프트웨어·운영체제·언어 › 객체지향 언어 · 기출 24-02"},
{"id": "S1-041", "t": "02 소프트웨어·운영체제", "q": "다음 중 웹 프로그래밍 언어에 속하지 않는 것은?", "c": ["LISP", "JSP", "PHP", "ASP"], "a": 0, "e": "LISP는 인공지능 분야의 언어입니다. JSP, PHP, ASP는 웹 프로그래밍 언어입니다.", "tip": "웹 언어: JSP·PHP·ASP.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 소프트웨어·운영체제·언어 › 웹 프로그래밍 언어 · 기출 24-01"},
{"id": "S1-042", "t": "02 소프트웨어·운영체제", "q": "다음 중 인터넷 홈페이지 제작 언어로 옳지 않은 것은?", "c": ["DHTML", "ASP", "JAVA", "AIDA"], "a": 3, "e": "AIDA는 홈페이지 제작 언어가 아닙니다(광고 효과 모델 용어).", "tip": "AIDA = 광고 이론.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 소프트웨어·운영체제·언어 › 웹 제작 언어 · 기출 26-02"},
{"id": "S1-043", "t": "02 소프트웨어·운영체제", "q": "다음 중 차세대 웹 표준으로 텍스트와 하이퍼링크를 이용한 문서 작성 중심으로 구성된 기존 표준에 비디오, 오디오 등의 다양한 부가 기능을 추가하여 최신 멀티미디어 콘텐츠를 ActiveX 없이도 웹 서비스로 제공할 수 있는 언어는?", "c": ["XML", "VRML", "HTML5", "JSP"], "a": 2, "e": "HTML5는 플러그인 없이 비디오·오디오 등 멀티미디어를 지원하는 차세대 웹 표준입니다.", "tip": "ActiveX 없이 멀티미디어 = HTML5.", "w": ["XML은 사용자가 태그를 정의하는 확장 가능한 마크업 언어입니다.", "VRML은 3차원 가상 공간을 표현하는 언어입니다.", "", "JSP는 서버 측 웹 프로그래밍 언어입니다."], "p": "1과목 › 소프트웨어·운영체제·언어 › HTML5 · 기출 25-04"},
{"id": "S1-044", "t": "02 소프트웨어·운영체제", "q": "다음 중 유틸리티 프로그램에 대한 설명으로 적절하지 않은 것은?", "c": ["다수의 작업이나 목적에 대하여 적용되는 편리한 서비스 프로그램이나 루틴을 말한다.", "컴퓨터의 동작에 필수적이고, 컴퓨터를 이용하는 주목적에 대한 일부 특정 작업을 수행하는 소프트웨어들을 가리킨다.", "컴퓨터 하드웨어, 운영체제, 응용 소프트웨어를 관리하는 데 도움을 주도록 설계된 프로그램을 의미한다.", "Windows에서 제공하는 유틸리티 프로그램으로는 메모장, 그림판, 계산기 등을 예로 들 수 있다."], "a": 1, "e": "유틸리티는 컴퓨터 동작에 필수적인 프로그램이 아니라 관리·편의를 돕는 보조 프로그램입니다.", "tip": "유틸리티 = 필수 아님, 편의 도구.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 소프트웨어·운영체제·언어 › 유틸리티 프로그램 · 기출 24-01, 25-01, 26-01", "h": 1},
{"id": "S1-045", "t": "02 소프트웨어·운영체제", "q": "다음 중 컴퓨터 소프트웨어 배포와 관련하여 셰어웨어(Shareware)에 관한 설명으로 옳은 것은?", "c": ["정상 대가를 지불하고 사용하는 소프트웨어이다.", "특정 기능이나 사용 기간에 제한을 두고 무료로 배포하는 소프트웨어이다.", "개발자가 소스를 공개한 소프트웨어이다.", "배포 이전의 테스트 버전의 소프트웨어이다."], "a": 1, "e": "셰어웨어는 기능이나 사용 기간을 제한하여 무료로 배포하고 이후 구매를 유도합니다.", "tip": "셰어웨어 = 제한 + 구매 유도.", "w": ["정상 대가를 지불하고 사용하는 것은 상용 소프트웨어입니다.", "", "소스를 공개한 소프트웨어는 오픈 소스(공개 소프트웨어)입니다.", "배포 전 테스트 버전은 알파·베타 버전입니다."], "p": "1과목 › 소프트웨어·운영체제·언어 › 소프트웨어 배포 · 기출 24-02, 24-04, 25-05", "h": 1},
{"id": "S1-046", "t": "02 소프트웨어·운영체제", "q": "컴퓨터 소프트웨어 배포와 관련하여 특정 기능 또는 기간을 제한하여 공개하고, 사용한 후에 사용자의 구매를 유도하는 소프트웨어는?", "c": ["알파(Alpha) 버전", "패치(Patch) 버전", "프리웨어(Freeware)", "셰어웨어(Shareware)"], "a": 3, "e": "특정 기능이나 기간을 제한하여 공개하고 구매를 유도하는 소프트웨어는 셰어웨어입니다.", "tip": "제한 후 구매 유도 = 셰어웨어.", "w": ["베타테스트 전에 회사 내에서 테스트하는 프로그램입니다.", "배포된 프로그램의 오류 수정·성능 향상을 위한 프로그램입니다.", "무료로 사용·배포가 가능한 소프트웨어입니다.", ""], "p": "1과목 › 소프트웨어·운영체제·언어 › 소프트웨어 배포 · 기출 25-03, 26-03"},
{"id": "S1-047", "t": "02 소프트웨어·운영체제", "q": "다음 중 버전에 따른 소프트웨어에 대한 설명으로 옳지 않은 것은?", "c": ["트라이얼 버전(Trial Version)은 특정한 하드웨어나 소프트웨어를 구매하였을 때 무료로 주는 프로그램이다.", "베타 버전(Beta Version)은 소프트웨어의 정식 발표 전 테스트를 위하여 사용자들에게 무료로 배포하는 시험용 프로그램이다.", "데모 버전(Demo Version)은 정식 프로그램을 홍보하기 위해 사용기간이나 기능을 제한하여 배포하는 프로그램이다.", "패치 버전(Patch Version)은 이미 제작하여 배포된 프로그램의 오류 수정이나 성능 향상을 위해 프로그램의 일부 파일을 변경해 주는 프로그램이다."], "a": 0, "e": "구매 시 무료로 끼워 주는 프로그램은 번들(Bundle)입니다. 트라이얼 버전은 일정 기간·횟수 동안 시험 사용하는 버전입니다.", "tip": "무료 증정 = 번들, 시험 사용 = 트라이얼.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 소프트웨어·운영체제·언어 › 버전별 소프트웨어 · 기출 26-02"},
{"id": "S1-048", "t": "02 소프트웨어·운영체제", "q": "개발자의 장소에서 사용자가 개발자 앞에서 행하는 테스트 기법으로, 통제된 환경에서 오류와 사용상의 문제점을 사용자와 개발자가 함께 확인하는 것은?", "c": ["베타 테스트", "알파 테스트", "번들 테스트", "데모 테스트"], "a": 1, "e": "알파 테스트는 개발자 장소에서 사용자가 개발자 앞에서 수행하는 테스트입니다.", "tip": "알파 = 개발자 장소, 베타 = 사용자 환경.", "w": ["베타 테스트는 사용자 환경에서 개발자 없이 수행하는 테스트입니다.", "", "번들은 제품 구매 시 함께 제공하는 프로그램을 뜻합니다.", "데모는 홍보를 위해 기능을 제한해 배포하는 버전입니다."], "p": "1과목 › 소프트웨어·운영체제·언어 › 소프트웨어 테스트 · 기출 26-02"},
{"id": "S1-049", "t": "02 소프트웨어·운영체제", "q": "다음 중 가전제품, PDA 등에 사용되는 임베디드 운영체제로 가장 적절한 것은?", "c": ["IIS", "Java", "윈도우 CE", "유닉스"], "a": 2, "e": "윈도우 CE는 가전제품, PDA 등 소형 기기에 내장되는 임베디드 운영체제입니다.", "tip": "임베디드 OS = 윈도우 CE.", "w": ["IIS는 마이크로소프트의 웹 서버 프로그램입니다.", "Java는 프로그래밍 언어입니다.", "", "유닉스는 서버·워크스테이션용 범용 운영체제입니다."], "p": "1과목 › 소프트웨어·운영체제·언어 › 임베디드 운영체제 · 기출 25-04"},
{"id": "S1-050", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10의 인쇄 기능에 대한 설명으로 옳은 것은?", "c": ["기본 프린터를 2대 이상 지정할 수 있다.", "프린터 속성 창에서 공급 용지의 종류, 공유, 포트 등을 설정할 수 있다.", "인쇄 대기 중인 작업은 취소시킬 수 없다.", "인쇄 중인 작업은 취소할 수는 없으나 잠시 중단시킬 수 있다."], "a": 1, "e": "프린터 속성 창에서 용지 종류, 공유, 포트 등을 설정할 수 있습니다.", "tip": "속성 창 = 용지·공유·포트.", "w": ["기본 프린터는 1대만 지정할 수 있습니다.", "", "인쇄 대기 중인 작업도 취소할 수 있습니다.", "인쇄 중인 작업도 취소하거나 일시 중지할 수 있습니다."], "p": "1과목 › Windows 10 › 인쇄 기능 · 기출 26-02, 26-03"},
{"id": "S1-051", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10의 인쇄 기능에 대한 설명으로 옳지 않은 것은?", "c": ["기본 프린터란 인쇄 시 특정 프린터를 지정하지 않아도 자동으로 인쇄되는 프린터를 말한다.", "프린터 속성 창에서 공급용지의 종류, 공유, 포트 등을 설정할 수 있다.", "인쇄 대기 중인 작업은 취소시킬 수 있다.", "인쇄 중인 작업은 취소할 수는 없으나 잠시 중단시킬 수 있다."], "a": 3, "e": "인쇄 중인 작업도 취소할 수 있고 일시 중지도 할 수 있습니다.", "tip": "인쇄 작업은 취소·일시 중지 모두 가능.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › Windows 10 › 인쇄 기능 · 기출 24-03, 24-04, 25-01", "h": 1},
{"id": "S1-052", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10에서 프린터 설치에 관한 설명으로 옳지 않은 것은?", "c": ["네트워크 프린터를 선택한 경우에는 연결할 프린터의 포트를 지정한다.", "[설정] → [장치] → [프린터 및 스캐너]에서 '프린터 또는 스캐너 추가'를 클릭하여 프린터를 추가한다.", "설치할 프린터 유형은 로컬 프린터와 Bluetooth, 무선 또는 네트워크 검색 가능 프린터 등에서 하나를 선택할 수 있다.", "컴퓨터에 설치된 여러 대의 프린터 중에 현재 설치 중인 프린터를 기본 프린터로 설정할 것인지 선택한다."], "a": 0, "e": "포트를 지정하는 것은 로컬 프린터를 설치할 때입니다. 네트워크 프린터는 연결 경로로 추가합니다.", "tip": "포트 지정 = 로컬 프린터.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › Windows 10 › 프린터 설치 · 기출 24-01, 24-03, 25-01, 26-02", "h": 1},
{"id": "S1-053", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10에서 프린터 설치에 관한 설명으로 옳지 않은 것은?", "c": ["설치할 프린터 유형은 로컬 프린터와 Bluetooth, 무선 또는 네트워크 검색 가능 프린터 등에서 하나를 선택할 수 있다.", "표준 사용자 계정으로는 네트워크 프린터를 설치할 수 없고 로컬 프린터만 설치할 수 있다.", "컴퓨터에 설치된 여러 대의 프린터 중에 현재 설치 중인 프린터를 기본 프린터로 설정할 것인지 선택한다.", "[설정] → [장치] → [프린터 및 스캐너]에서 '프린터 또는 스캐너 추가'를 클릭하여 프린터를 추가한다."], "a": 1, "e": "표준 사용자 계정으로도 네트워크 프린터를 설치할 수 있습니다.", "tip": "계정 종류로 설치 가능 유형이 갈리지 않는다.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › Windows 10 › 프린터 설치 · 기출 26-01"},

{"id": "S1-072", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10의 작업 표시줄 설정에 대한 설명으로 옳지 않은 것은?", "c": ["아이콘의 보기 형식이나 정렬 방식을 설정할 수 있다.", "데스크톱 모드에서 작업 표시줄 자동 숨기기를 설정할 수 있다.", "화면에서 작업 표시줄의 위치를 왼쪽, 위쪽, 오른쪽, 아래쪽 중에서 설정할 수 있다.", "작업 표시줄이 꽉 차면 같은 앱은 그룹으로 묶어서 하나의 단추로 표시되도록 할 수 있다."], "a": 0, "e": "아이콘 보기 형식·정렬 방식은 바탕 화면에서 설정하며 작업 표시줄 설정이 아닙니다.", "tip": "보기·정렬은 바탕 화면 기능.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › Windows 10 › 작업 표시줄 설정 · 기출 26-01"},
{"id": "S1-073", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10의 작업 표시줄 설정에 대한 설명으로 옳지 않은 것은?", "c": ["자주 사용하는 앱을 작업 표시줄에 표시할 수 있다.", "데스크톱 모드에서 작업 표시줄 자동 숨기기를 설정할 수 있다.", "화면에서 작업 표시줄의 위치를 왼쪽, 위쪽, 오른쪽, 아래쪽 중에서 설정할 수 있다.", "작업 표시줄이 꽉 차면 같은 앱은 그룹으로 묶어서 하나의 단추로 표시되도록 할 수 있다."], "a": 0, "e": "작업 표시줄 설정에는 자주 사용하는 앱을 자동으로 표시하는 항목이 없습니다(앱은 사용자가 직접 고정).", "tip": "고정은 사용자가 직접.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › Windows 10 › 작업 표시줄 설정 · 기출 25-05"},
{"id": "S1-074", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10에서 [작업 표시줄]의 바로 가기 메뉴에 있는 [도구 모음]에서 선택할 수 없는 것은?", "c": ["바탕 화면", "링크", "새 도구 모음", "알림 영역"], "a": 3, "e": "도구 모음에서 선택할 수 있는 것은 주소, 링크, 바탕 화면, 새 도구 모음입니다. 알림 영역은 해당하지 않습니다.", "tip": "도구 모음: 주소·링크·바탕 화면·새 도구 모음.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › Windows 10 › 도구 모음 · 기출 24-04, 25-04"},
{"id": "S1-075", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10에서 작업 표시줄의 바로 가기 메뉴에서 설정할 수 있는 항목으로 옳지 않은 것은?", "c": ["계단식 창 배열", "창 가로 정렬 보기", "모든 작업 표시줄 잠금", "아이콘 자동 정렬"], "a": 3, "e": "아이콘 자동 정렬은 바탕 화면 바로 가기 메뉴([보기])의 항목입니다.", "tip": "자동 정렬 = 바탕 화면 메뉴.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › Windows 10 › 작업 표시줄 바로 가기 메뉴 · 기출 24-02, 25-03"},
{"id": "S1-076", "t": "03 Windows 10", "q": "다음 중 작업 표시줄의 바로 가기 메뉴에서 선택할 수 없는 항목은?", "c": ["작업 표시줄에 피플 표시", "터치 키보드 단추 표시", "작업 보기 단추 표시", "개인 설정 표시"], "a": 3, "e": "작업 표시줄 바로 가기 메뉴에는 '개인 설정 표시' 항목이 없습니다(작업 표시줄 설정이 있음).", "tip": "메뉴에 없는 항목: 개인 설정 표시.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › Windows 10 › 작업 표시줄 바로 가기 메뉴 · 기출 26-01"},
{"id": "S1-077", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10 작업 표시줄의 점프 목록 사용에 대한 설명으로 옳지 않은 것은?", "c": ["프로그램의 점프 목록을 보려면 작업 표시줄의 프로그램 아이콘을 마우스 오른쪽 단추로 클릭한다.", "점프 목록에서 항목을 열려면 프로그램의 점프 목록에서 해당 항목을 클릭한다.", "점프 목록에 항목을 고정하려면 프로그램의 점프 목록에서 항목을 가리킨 다음 압정 아이콘을 클릭한다.", "점프 목록에서 항목을 제거하려면 프로그램의 점프 목록에서 항목을 가리킨 다음 [Delete]를 누른다."], "a": 3, "e": "점프 목록의 항목은 [Delete] 키로 제거하지 않고, 항목을 마우스 오른쪽 단추로 눌러 '이 목록에서 제거'를 선택합니다.", "tip": "제거 = 오른쪽 클릭 메뉴.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › Windows 10 › 점프 목록 · 기출 24-04, 25-02, 26-02", "h": 1},
{"id": "S1-078", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10에서 작업 표시줄의 [검색 상자]에 대한 설명으로 옳지 않은 것은?", "c": ["검색 항목은 모두, 앱, 문서, 웹, 동영상, 설정, 전자 메일, 폴더 등이다.", "작업 표시줄의 바로 가기 메뉴에서 [검색]을 선택하여 검색 상자를 표시하거나 숨길 수 있다.", "검색된 앱을 선택하여 바로 실행할 수 있다.", "[⊞]+[F]를 누르면 검색 상자로 포커스가 옮겨진다."], "a": 3, "e": "검색 상자로 이동하는 키는 [⊞]+[S]입니다. [⊞]+[F]는 피드백 허브 앱을 실행합니다.", "tip": "검색 = Win+S.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › Windows 10 › 검색 상자 · 기출 26-02, 26-03"},
{"id": "S1-079", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10의 [폴더 옵션]에서 설정할 수 있는 작업에 해당되지 않는 것은?", "c": ["숨김 파일 및 폴더를 표시할 수 있다.", "색인된 위치에서는 파일 이름 뿐만 아니라 내용도 검색하도록 설정할 수 있다.", "숨긴 파일 및 폴더의 숨김 속성을 일괄 해제할 수 있다.", "파일이나 폴더를 한 번 클릭해서 열 것인지, 두 번 클릭해서 열 것인지를 설정할 수 있다."], "a": 2, "e": "숨김 속성의 일괄 해제는 폴더 옵션이 아니라 각 파일·폴더의 속성에서 해제합니다.", "tip": "폴더 옵션은 '표시' 여부만 설정.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › Windows 10 › 폴더 옵션 · 기출 25-02"},
{"id": "S1-080", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10에서 외부로부터의 불법적인 해킹 등의 위협 요소로부터 컴퓨터를 보호하는 역할을 하는 것은 무엇인가?", "c": ["Windows Update", "Windows Defender 방화벽", "BitLocker", "Malware"], "a": 1, "e": "Windows Defender 방화벽은 외부의 불법 침입(해킹)으로부터 컴퓨터를 보호합니다.", "tip": "방화벽 = 외부 침입 차단.", "w": ["Windows Update는 보안 패치와 기능 업데이트를 제공합니다.", "", "BitLocker는 드라이브를 암호화하는 기능입니다.", "Malware는 악성 소프트웨어를 뜻합니다."], "p": "1과목 › Windows 10 › Windows Defender 방화벽 · 기출 25-02"},
{"id": "S1-081", "t": "03 Windows 10", "q": "다음 중 파일 삭제 시 파일이 [휴지통]에 임시 보관되어 복원이 가능한 경우는?", "c": ["바탕 화면에 있는 파일을 [휴지통]으로 드래그 앤 드롭하여 삭제한 경우", "USB 메모리에 저장되어 있는 파일을 [Delete]로 삭제한 경우", "네트워크 드라이브의 파일을 바로 가기 메뉴의 [삭제]를 클릭하여 삭제한 경우", "[휴지통]의 크기를 0%로 설정한 후 파일 탐색기 안의 파일을 삭제한 경우"], "a": 0, "e": "하드디스크의 파일을 휴지통으로 끌어 놓아 삭제하면 휴지통에 보관되어 복원할 수 있습니다.", "tip": "USB·네트워크 삭제 = 복원 불가.", "w": ["", "USB 메모리의 파일은 휴지통을 거치지 않고 바로 삭제됩니다.", "네트워크 드라이브의 파일은 휴지통을 거치지 않고 삭제됩니다.", "휴지통 크기가 0%이면 파일이 휴지통에 보관되지 않습니다."], "p": "1과목 › Windows 10 › 휴지통 · 기출 25-02"},
{"id": "S1-082", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10의 [휴지통]에 관한 설명으로 옳지 않은 것은?", "c": ["[휴지통 비우기]를 실행한 파일은 [휴지통]에서 다시 복구할 수 있다.", "[휴지통]에 있는 파일의 아이콘을 정렬하여 표시할 수 있다.", "[휴지통]에 있는 파일을 바탕 화면 또는 다른 폴더에 끌어놓기를 하여 파일을 복구할 수 있다.", "[휴지통]에 있는 파일을 더블클릭하면 '속성' 창이 표시된다."], "a": 0, "e": "[휴지통 비우기]를 실행하면 파일이 영구 삭제되어 복구할 수 없습니다.", "tip": "비우기 = 영구 삭제.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › Windows 10 › 휴지통 · 기출 25-06"},
{"id": "S1-083", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10에서 하드디스크를 포맷하기 위한 [포맷] 창에서 설정 가능한 항목으로 옳지 않은 것은?", "c": ["볼륨 레이블 입력", "파티션 제거", "파일 시스템 선택", "빠른 포맷 선택"], "a": 1, "e": "[포맷] 창에서는 파티션을 제거할 수 없습니다. 파티션 제거는 디스크 관리에서 수행합니다.", "tip": "포맷 창: 레이블·파일 시스템·빠른 포맷.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › Windows 10 › 디스크 포맷 · 기출 25-06"},
{"id": "S1-084", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10에서 '컴퓨터 이름'을 변경하는 방법으로 옳은 것은?", "c": ["[제어판] - [장치 관리자]에서 '시스템 설정'을 더블클릭", "[제어판] - [사용자 계정]에서 '계정 관리'를 더블클릭", "[제어판] - [시스템 및 보안] - [시스템]을 클릭", "[제어판] - [시스템 및 보안] - [관리 도구]를 클릭"], "a": 2, "e": "[제어판] - [시스템 및 보안] - [시스템]에서 컴퓨터 이름을 변경할 수 있습니다.", "tip": "컴퓨터 이름 = 시스템 및 보안 → 시스템.", "w": ["장치 관리자는 하드웨어 장치를 관리하는 도구입니다.", "사용자 계정은 계정 관리용이며 컴퓨터 이름과 무관합니다.", "", "관리 도구는 시스템 관리 도구 모음을 보여 줍니다."], "p": "1과목 › Windows 10 › 컴퓨터 이름 변경 · 기출 25-06"},
{"id": "S1-085", "t": "03 Windows 10", "q": "다음 중 파일이나 폴더를 복사하거나 이동하는 방법으로 옳지 않은 것은?", "c": ["폴더를 마우스로 선택한 후 동일한 드라이브의 다른 폴더로 끌어서 놓으면 이동이 된다.", "USB에 저장되어 있는 파일을 마우스로 선택한 후 바탕 화면으로 끌어서 놓으면 복사가 된다.", "파일을 마우스로 선택한 후 [Ctrl]을 누른 채 같은 드라이브의 다른 폴더로 끌어서 놓으면 복사가 된다.", "폴더를 마우스로 선택한 후 [Alt]를 누른 채 같은 드라이브의 다른 폴더로 끌어서 놓으면 이동이 된다."], "a": 3, "e": "[Alt]를 누른 채 끌어 놓으면 바로 가기가 만들어집니다. 이동은 [Shift], 복사는 [Ctrl]입니다.", "tip": "Ctrl=복사, Shift=이동, Alt=바로 가기.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › Windows 10 › 파일·폴더 복사/이동 · 기출 24-04, 25-03"},

{"id": "S1-089", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10의 [디스크 정리]에 관한 설명으로 옳은 것은?", "c": ["디스크에 분산되어 있는 저장 파일들을 연속된 공간에 저장하여 디스크 접근 속도를 향상시킨다.", "디스크의 원본 데이터에 대한 손실에 대비하여 외부 저장장치에 데이터를 저장한다.", "디스크의 전체 크기와 사용 가능한 공간이 늘어난다.", "불필요한 파일들을 삭제하여 디스크의 여유 공간을 확보한다."], "a": 3, "e": "디스크 정리는 임시 파일 등 불필요한 파일을 삭제해 여유 공간을 확보합니다.", "tip": "디스크 정리 = 불필요한 파일 삭제.", "w": ["연속된 공간에 모아 속도를 높이는 것은 조각 모음입니다.", "외부 저장장치에 보관하는 것은 백업입니다.", "전체 크기는 변하지 않고 사용 가능한 공간만 늘어납니다.", ""], "p": "1과목 › Windows 10 › 디스크 정리 · 기출 25-05"},

{"id": "S1-096", "t": "03 Windows 10", "q": "다음 중 한글 Windows 10에서 '명령 프롬프트' 창을 표시하기 위해 '실행' 창에 입력해야 하는 것은?", "c": ["cmd", "command", "ping", "tracert"], "a": 0, "e": "[실행] 창에 cmd를 입력하면 명령 프롬프트 창이 열립니다.", "tip": "명령 프롬프트 = cmd.", "w": ["", "command는 과거 DOS 시절의 명령어입니다.", "ping은 네트워크 연결 상태를 확인하는 명령입니다.", "tracert는 목적지까지의 경로를 추적하는 명령입니다."], "p": "1과목 › Windows 10 › 명령 프롬프트 · 기출 24-04, 25-01"},
{"id": "S1-097", "t": "04 인터넷·네트워크", "q": "다음 중 인터넷 주소 체계인 IPv6에 대한 설명으로 옳은 것은?", "c": ["주소는 8비트씩 16개 부분으로 총 128비트로 구성되어 있다.", "주소를 네트워크 부분의 길이에 따라 A클래스에서 E클래스까지 총 5단계로 구분한다.", "IPv4와의 호환성은 낮으나 IPv4에 비해 품질 보장은 용이하다.", "주소의 한 부분이 0으로만 연속되는 경우 연속된 0은 ':'으로 생략하여 표시할 수 있다."], "a": 3, "e": "IPv6는 0이 연속되는 부분을 '::'로 생략해 표시할 수 있습니다.", "tip": "0 연속 → '::' 생략.", "w": ["IPv6는 16비트씩 8개 부분(총 128비트)입니다.", "A~E 클래스 구분은 IPv4의 방식입니다.", "IPv6는 IPv4와의 호환성이 뛰어납니다.", ""], "p": "1과목 › 인터넷·네트워크 › IPv6 · 기출 24-01, 26-03"},
{"id": "S1-098", "t": "04 인터넷·네트워크", "q": "다음 중 인터넷 주소 체계인 IPv6에 대한 설명으로 옳지 않은 것은?", "c": ["주소는 16비트씩 8개 부분으로 총 128비트로 구성되어 있다.", "IPv6의 주소는 유니캐스트, 애니캐스트, 멀티캐스트 3종류의 형태로 분류한다.", "IPv4와의 호환성은 낮으나 IPv4에 비해 품질 보장은 용이하다.", "주소에 0이 연속되는 경우 0을 생략하고 ':' 형태로 표시할 수 있다."], "a": 2, "e": "IPv6는 IPv4와의 호환성이 뛰어나고 주소 확장성·융통성·연동성이 좋습니다.", "tip": "IPv6 = 호환성 우수.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 인터넷·네트워크 › IPv6 · 기출 24-04, 25-03"},
{"id": "S1-099", "t": "04 인터넷·네트워크", "q": "다음 중 IPv6 주소체계에 대한 설명으로 옳지 않은 것은?", "c": ["총 128비트로 구성되어 있다.", "각 부분은 세미콜론으로 구분한다.", "각 부분은 16진수로 표현한다.", "8개 부분으로 구성되어 있다."], "a": 1, "e": "IPv6의 각 부분은 콜론(:)으로 구분합니다. (IPv4는 점(.)으로 구분)", "tip": "IPv6 = 콜론, IPv4 = 점.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 인터넷·네트워크 › IPv6 · 기출 26-01"},
{"id": "S1-100", "t": "04 인터넷·네트워크", "q": "다음 중 인터넷 주소 체계에 대한 설명으로 옳지 않은 것은?", "c": ["인터넷 연결을 위해서는 IP 주소 또는 도메인 네임 중 하나를 배정받아야 하며, 인터넷에 연결된 컴퓨터의 고유 주소는 도메인 네임으로 이는 IP 주소와 동일하다.", "국제 인터넷 주소 관리기구는 ICANN이며, 한국에서는 한국인터넷진흥원(KISA)에서 관리하고 있다.", "현재는 인터넷 주소 체계인 IPv4 주소와 IPv6 주소가 함께 사용되고 있으며, IPv6 주소가 점차 확대되고 있다.", "IPv6는 IPv4와의 호환성이 뛰어나고, 128비트의 주소를 사용하여 주소 부족 문제 및 보안문제를 해결할 수 있다."], "a": 0, "e": "IP 주소와 도메인 네임은 서로 매핑되는 개념일 뿐 동일하지 않습니다. 인터넷 연결에 반드시 필요한 고유 주소는 IP 주소입니다.", "tip": "필수 = IP 주소, 도메인은 편의용.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 인터넷·네트워크 › 인터넷 주소 체계 · 기출 24-03, 25-01, 26-03", "h": 1},
{"id": "S1-101", "t": "04 인터넷·네트워크", "q": "다음 중 인터넷에서 사용하는 도메인 네임에 대한 설명으로 옳지 않은 것은?", "c": ["숫자로 구성된 IP주소를 사람들이 기억하고 이해하기 쉽도록 문자열로 만든 주소이다.", "우리나라에서 도메인 네임을 관리하는 기관은 KISA이다.", "인터넷의 모든 도메인 네임은 전 세계적으로 유일하게 존재해야 한다.", "도메인 네임을 사용자가 컴퓨터에서 임의로 설정하여 사용할 수 있다."], "a": 3, "e": "도메인 네임은 공식 기관을 통해 등록해야 하며 사용자가 임의로 설정해 사용할 수 없습니다.", "tip": "도메인은 등록해야 사용 가능.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 인터넷·네트워크 › 도메인 네임 · 기출 24-03, 24-04, 25-02", "h": 1},
{"id": "S1-102", "t": "04 인터넷·네트워크", "q": "다음 중 인터넷에서 사용하는 주소에 관한 설명으로 옳지 않은 것은?", "c": ["전 세계의 모든 IP 주소는 동일하다.", "도메인 네임(Domain Name)은 숫자로 된 IP 주소를 사람이 이해하기 쉬운 문자 형태로 표현한 것이다.", "IPv6은 IPv4의 주소 부족 문제를 해결하기 위하여 개발되었다.", "IPv4 주소는 8비트씩 4부분, 총 32비트로 구성된다."], "a": 0, "e": "IP 주소는 인터넷에 연결된 컴퓨터마다 고유하며 전 세계에서 중복될 수 없습니다.", "tip": "IP 주소 = 고유.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 인터넷·네트워크 › IP 주소 · 기출 24-04"},
{"id": "S1-103", "t": "04 인터넷·네트워크", "q": "다음 중 인터넷에 대한 설명으로 적절하지 않은 것은?", "c": ["URL은 인터넷 상에 있는 각종 자원의 위치를 나타내는 표준 주소 체계이다.", "인터넷은 TCP/IP 프로토콜을 통해 연결된 상업용 네트워크로 중앙통제기구인 InterNIC에 의해 운영된다.", "IP 주소는 인터넷에 연결된 모든 컴퓨터 자원을 구분하기 위한 고유의 주소이다.", "www는 웹 브라우저를 통해 인터넷을 효과적으로 사용할 수 있게 하는 서비스이다."], "a": 1, "e": "인터넷은 중앙통제기구 없이 자율적으로 운영됩니다. InterNIC는 주소 등록·관리 기관이었을 뿐입니다.", "tip": "인터넷 = 중앙 통제 없음.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 인터넷·네트워크 › 인터넷 일반 · 기출 25-01, 26-02"},
{"id": "S1-104", "t": "04 인터넷·네트워크", "q": "다음 중 인터넷을 수동으로 연결하기 위하여 지정해야 할 TCP/IP 구성 요소로 옳지 않은 것은?", "c": ["IP 주소", "서브넷 마스크", "어댑터 주소", "DNS 서버 주소"], "a": 2, "e": "수동 설정 항목은 IP 주소, 서브넷 마스크, 기본 게이트웨이, DNS 서버 주소입니다.", "tip": "IP·서브넷·게이트웨이·DNS.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 인터넷·네트워크 › TCP/IP 설정 · 기출 24-04, 25-06"},
{"id": "S1-105", "t": "04 인터넷·네트워크", "q": "다음 중 네트워크와 관련하여 Ping 서비스에 대한 설명으로 옳은 것은?", "c": ["원격으로 다른 컴퓨터를 사용할 수 있는 서비스이다.", "인터넷이 정상적으로 연결되었는지 확인하는 서비스이다.", "인터넷 서버까지의 경로를 추적하는 서비스이다.", "특정 시스템을 사용하고 있는 사용자 정보를 알아보는 서비스이다."], "a": 1, "e": "Ping은 상대 컴퓨터까지 네트워크 연결이 정상인지 확인합니다.", "tip": "Ping = 연결 확인.", "w": ["원격 접속 서비스는 텔넷(Telnet)입니다.", "", "경로 추적은 tracert(Traceroute)입니다.", "사용자 정보 조회는 finger 서비스입니다."], "p": "1과목 › 인터넷·네트워크 › Ping · 기출 25-01"},
{"id": "S1-106", "t": "04 인터넷·네트워크", "q": "다음 중 인터넷을 이용한 전자우편에 관한 설명으로 옳지 않은 것은?", "c": ["인터넷에 접속하여 사용자들끼리 서로 편지를 주고받을 수 있는 서비스를 말한다.", "전자우편 주소는 '사용자ID@호스트 주소'의 형식으로 이루어진다.", "일반적으로 SMTP는 메일을 수신하는 용도로, MIME는 송신하는 용도로 사용되는 프로토콜이다.", "POP3를 이용하면 전자메일 클라이언트를 통해 전자 메일을 받아 볼 수 있다."], "a": 2, "e": "SMTP는 메일 송신용, POP3는 수신용 프로토콜이며 MIME은 멀티미디어 첨부를 인코딩하는 규약입니다.", "tip": "SMTP = 송신, POP3 = 수신.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 인터넷·네트워크 › 전자우편 · 기출 24-02"},
{"id": "S1-107", "t": "04 인터넷·네트워크", "q": "다음 중 전자우편(E-mail)에 대한 설명으로 옳지 않은 것은?", "c": ["SMTP는 송신자가 작성한 메일을 수신자의 계정에 전송하는 역할을 담당하는 프로토콜이다.", "전자우편을 통해 한 사람이 동시에 여러 사람에게 동일한 전자우편을 보낼 수 있다.", "POP3는 멀티미디어 파일의 내용을 확인하고 실행시켜주는 프로토콜이다.", "불특정 다수에게 대량으로 보내는 광고성 메일을 스팸 메일이라 한다."], "a": 2, "e": "POP3는 메일 서버에서 메일을 가져오는 수신 프로토콜입니다. 멀티미디어 확장은 MIME입니다.", "tip": "POP3 = 받아오기.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 인터넷·네트워크 › 전자우편 · 기출 24-03, 25-03"},
{"id": "S1-108", "t": "04 인터넷·네트워크", "q": "다음 중 인터넷을 통한 전자우편에 관한 설명으로 옳지 않은 것은?", "c": ["메일 계정이 있는 사용자 간 편지를 주고받을 수 있는 서비스를 말한다.", "MIME은 멀티미디어 등의 다양한 형식의 전자우편을 주고받기 위한 인터넷 메일 규약이다.", "메일을 주고받을 때는 송신자와 수신자의 컴퓨터가 동시에 켜져 있는 상태로 인터넷에 연결되어 있어야만 가능하다.", "편지를 보낼 때는 컴퓨터에서 SMTP를 이용하여 메일을 상대방에게 전송한다."], "a": 2, "e": "메일은 서버의 우편함에 저장되므로 수신자의 컴퓨터가 꺼져 있어도 보낼 수 있습니다.", "tip": "전자우편 = 서버 저장 후 전달.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 인터넷·네트워크 › 전자우편 · 기출 25-05"},
{"id": "S1-109", "t": "04 인터넷·네트워크", "q": "다음 중 전자우편 서비스에 대한 설명으로 옳지 않은 것은?", "c": ["baram@wind.co.kr에서 @의 앞부분은 E-mail 주소의 ID이고, @의 뒷부분은 메일 서버의 호스트 이름이다.", "POP3는 2진 파일의 전자우편을 호스트의 우편함에서 가져오기 위하여 사용한다.", "SMTP는 TCP/IP 호스트의 우편함에 ASCII 문자 메시지를 전송해 준다.", "MIME은 일반 문자열 데이터의 전송을 위해 문자열을 기호화하는 데 사용된다."], "a": 3, "e": "MIME은 이진 파일(멀티미디어) 등을 ASCII 문자로 변환(인코딩)해 전송하는 규약입니다.", "tip": "MIME = 바이너리를 문자로 인코딩.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 인터넷·네트워크 › 전자우편 · 기출 25-04"},
{"id": "S1-110", "t": "04 인터넷·네트워크", "q": "다음 중 전자우편에서 사용하는 POP3 프로토콜에 관한 설명으로 옳은 것은?", "c": ["이메일을 전송할 때 필요로 하는 프로토콜이다.", "원격 서버에 접속하여 이메일을 사용자 컴퓨터로 가져오기 위한 프로토콜이다.", "멀티미디어 이메일을 주고 받기 위한 프로토콜이다.", "이메일의 회신과 전체 회신을 가능하게 하는 프로토콜이다."], "a": 1, "e": "POP3는 메일 서버에서 이메일을 사용자 컴퓨터로 가져오는 수신 프로토콜입니다.", "tip": "POP3 = 수신.", "w": ["이메일 전송은 SMTP의 역할입니다.", "", "멀티미디어 이메일 지원은 MIME의 설명입니다.", "회신 기능은 프로토콜이 아니라 메일 프로그램의 기능입니다."], "p": "1과목 › 인터넷·네트워크 › POP3 · 기출 26-03"},
{"id": "S1-111", "t": "04 인터넷·네트워크", "q": "다음 중 전자우편과 관련하여 스팸(SPAM)에 관한 설명으로 옳은 것은?", "c": ["바이러스를 유포시키는 행위이다.", "수신인이 원하지 않는 메시지나 정보를 일방적으로 보내는 행위이다.", "다른 사용자의 개인 정보를 허락없이 가져가는 행위이다.", "고의로 컴퓨터 파일상의 데이터를 파괴시키는 행위이다."], "a": 1, "e": "스팸은 수신자가 원하지 않는 광고성 메시지를 일방적으로 보내는 행위입니다.", "tip": "스팸 = 원치 않는 일방 발송.", "w": ["바이러스 유포는 악성코드 배포 행위입니다.", "", "개인 정보 탈취는 피싱·해킹의 일종입니다.", "데이터 파괴는 악성코드·해킹 행위입니다."], "p": "1과목 › 인터넷·네트워크 › 스팸 · 기출 25-06, 26-03"},
{"id": "S1-112", "t": "04 인터넷·네트워크", "q": "다음 중 WWW(World Wide Web)에 대한 설명으로 잘못된 것은?", "c": ["멀티미디어 형식의 정보를 제공한다.", "HTTP 프로토콜을 사용하는 하이퍼텍스트 기반으로 되어 있다.", "웹 페이지는 서버에서 정보를 제공하고 클라이언트에서 웹 브라우저를 통해 정보를 검색하고 제공받는다.", "HTML은 웹 페이지와 웹 브라우저 사이에서 하이퍼텍스트 문서를 전송하기 위해 사용하는 프로토콜이다."], "a": 3, "e": "하이퍼텍스트 문서를 전송하는 프로토콜은 HTTP입니다. HTML은 웹 문서를 작성하는 마크업 언어입니다.", "tip": "전송 = HTTP, 작성 = HTML.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 인터넷·네트워크 › WWW · 기출 25-04, 26-02"},
{"id": "S1-113", "t": "04 인터넷·네트워크", "q": "다음 중 웹 브라우저의 기능에 관한 설명으로 옳지 않은 것은?", "c": ["'설정'에서 멀티미디어 편집기를 선택할 수 있다.", "전자우편을 보내거나 FTP 서버에 접속할 수 있다.", "웹 페이지를 사용자 컴퓨터에 저장하거나 인쇄할 수 있다.", "자주 방문하는 웹 사이트 주소를 관리할 수 있다."], "a": 0, "e": "웹 브라우저의 설정에는 멀티미디어 편집기를 선택하는 기능이 없습니다.", "tip": "브라우저 = 열람 도구, 편집기 아님.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 인터넷·네트워크 › 웹 브라우저 · 기출 24-02, 25-02"},
{"id": "S1-114", "t": "04 인터넷·네트워크", "q": "다음 중 웹 브라우저의 기능에 관한 설명으로 옳지 않은 것은?", "c": ["웹 페이지를 사용자 컴퓨터에 저장하거나 인쇄할 수 있다.", "HTML 문서나 PDF 문서를 확인할 수 있다.", "자주 방문하는 웹 사이트 주소를 관리할 수 있다.", "방문한 웹 사이트를 편집할 수 있다."], "a": 3, "e": "웹 브라우저로 방문한 웹 사이트를 편집(수정)할 수는 없습니다.", "tip": "브라우저로 사이트 편집 불가.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 인터넷·네트워크 › 웹 브라우저 · 기출 24-01, 26-01"},
{"id": "S1-115", "t": "04 인터넷·네트워크", "q": "다음 중 사용자의 기본 설정을 사이트가 인식하도록 하거나, 사용자가 웹 사이트로 이동할 때마다 로그인해야 하는 번거로움을 생략할 수 있도록 사용자 환경을 향상시키는 것은?", "c": ["쿠키(Cookie)", "즐겨찾기(Favorites)", "히스토리(History)", "웹 서비스(Web Service)"], "a": 0, "e": "쿠키는 사용자의 설정·로그인 정보 등을 저장해 다음 방문 시 활용하게 하는 작은 파일입니다.", "tip": "로그인 유지·설정 기억 = 쿠키.", "w": ["", "즐겨찾기는 자주 가는 사이트 주소를 저장하는 기능입니다.", "히스토리는 방문한 사이트 목록 기록입니다.", "웹 서비스는 네트워크를 통해 제공되는 서비스 방식입니다."], "p": "1과목 › 인터넷·네트워크 › 쿠키 · 기출 25-06"},
{"id": "S1-116", "t": "04 인터넷·네트워크", "q": "다음 중 인터넷을 이용한 자체 검색 기능은 가지고 있지 않으나, 한 번의 검색어 입력으로 다른 검색 엔진에 검색을 의뢰해 그 결과만 보여주는 검색 엔진은?", "c": ["하이브리드 검색 엔진", "메타 검색 엔진", "주제별 검색 엔진", "키워드 검색 엔진"], "a": 1, "e": "메타 검색 엔진은 자체 DB 없이 다른 검색 엔진에 질의하여 결과를 모아 보여줍니다.", "tip": "자체 검색 X, 대리 검색 = 메타.", "w": ["주제별과 키워드 방식을 결합한 검색 엔진입니다.", "", "주제(카테고리)별로 분류해 찾는 검색 엔진입니다.", "검색어(키워드)를 직접 입력해 찾는 검색 엔진입니다."], "p": "1과목 › 인터넷·네트워크 › 검색 엔진 · 기출 25-06"},
{"id": "S1-117", "t": "04 인터넷·네트워크", "q": "다음 중 사물 인터넷(IoT)에 대한 설명으로 옳지 않은 것은?", "c": ["IoT 구성품 가운데 디바이스는 빅데이터를 수집하며, 클라우드와 AI는 수집된 빅데이터를 저장하고 분석한다.", "IoT는 인터넷 기반으로 다양한 사물, 사람, 공간을 긴밀하게 연결하고 상황을 분석, 예측, 판단해서 지능화된 서비스를 자율 제공하는 제반 인프라 및 융복합 기술이다.", "현재는 사물을 단순히 연결시켜 주는 단계에서 수집된 데이터를 분석해 스스로 사물에 의사결정을 내리는 단계로 발전하고 있다.", "IoT 네트워크를 이용할 경우 통신 비용이 절감되는 효과가 있으며, 정보 보안 기술의 적용이 용이해진다."], "a": 3, "e": "사물이 인터넷에 연결될수록 보안 위협이 늘어 정보 보안 기술을 적용하기가 오히려 어려워집니다.", "tip": "IoT = 보안이 큰 과제.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 인터넷·네트워크 › 사물 인터넷 · 기출 24-02, 25-04, 26-01", "h": 1},
{"id": "S1-118", "t": "04 인터넷·네트워크", "q": "다음 중 모든 사물을 네트워크로 연결하여 인간과 사물, 사물과 사물 간에 언제 어디서나 서로 소통할 수 있게 하는 새로운 정보 통신 환경을 의미하는 것은?", "c": ["클라우드 컴퓨팅(Cloud Computing)", "RSS(Rich Site Summary)", "IoT(Internet of Things)", "빅 데이터(Big Data)"], "a": 2, "e": "사물 인터넷(IoT)은 모든 사물을 인터넷으로 연결해 상호 소통하게 하는 환경입니다.", "tip": "사물 + 연결 = IoT.", "w": ["컴퓨팅 자원을 빌려 쓰는 서비스 방식입니다.", "웹 사이트 콘텐츠 갱신 정보를 제공하는 기술입니다.", "", "기존 방식으로 처리하기 어려운 방대한 데이터 집합입니다."], "p": "1과목 › 인터넷·네트워크 › 사물 인터넷 · 기출 25-06"},
{"id": "S1-119", "t": "04 인터넷·네트워크", "q": "지리적으로 분산된 컴퓨터를 초고속 인터넷망으로 연결하여 공유함으로써 하나의 고성능 컴퓨터처럼 활용하는 기술을 의미하는 것은?", "c": ["클라우드 컴퓨팅(Cloud Computing)", "그리드 컴퓨팅(Grid Computing)", "사물 인터넷(Internet of Things)", "빅 데이터(Big Data)"], "a": 1, "e": "그리드 컴퓨팅은 분산된 컴퓨터 자원을 하나의 고성능 컴퓨터처럼 활용하는 기술입니다.", "tip": "분산 자원 결합 = 그리드.", "w": ["하드웨어·소프트웨어 자원을 빌려 쓰고 요금을 내는 방식입니다.", "", "사물을 네트워크로 연결해 소통하게 하는 환경입니다.", "방대한 양의 데이터 집합을 가리킵니다."], "p": "1과목 › 인터넷·네트워크 › 그리드 컴퓨팅 · 기출 26-03"},
{"id": "S1-120", "t": "04 인터넷·네트워크", "q": "다음 중 인트라넷(Intranet)에 관한 설명으로 옳은 것은?", "c": ["핸드폰, 노트북 등과 같은 단말장치의 근거리 무선 접속을 지원하기 위한 통신 기술이다.", "인터넷 기술과 통신 규약을 기업 내의 전자우편, 전자 결재 등과 같은 정보시스템에 적용한 것이다.", "납품업체나 고객업체 등 관련 있는 기업들 간의 원활한 통신을 위한 시스템이다.", "분야별 공통의 관심사를 가진 인터넷 사용자들이 서로의 의견을 주고받을 수 있게 하는 서비스이다."], "a": 1, "e": "인트라넷은 인터넷 기술을 기업 내부 정보시스템에 적용한 사설망입니다.", "tip": "인트라넷 = 기업 내부용 인터넷.", "w": ["근거리 무선 접속 기술은 블루투스입니다.", "", "관련 기업 간 통신 시스템은 엑스트라넷입니다.", "공통 관심사 사용자 간 의견 교환 서비스는 뉴스그룹입니다."], "p": "1과목 › 인터넷·네트워크 › 인트라넷 · 기출 25-04"},
{"id": "S1-121", "t": "04 인터넷·네트워크", "q": "핸드폰, PDA, 노트북과 같은 휴대 가능한 장치들 간의 근거리 무선 통신을 가능하게 해주는 통신 방식은?", "c": ["WiFi", "BlueTooth", "LAN", "VAN"], "a": 1, "e": "블루투스는 휴대 기기 간 근거리 무선 통신을 지원하는 방식입니다.", "tip": "기기 간 근거리 무선 = 블루투스.", "w": ["WiFi는 무선 랜(무선 인터넷) 접속 방식입니다.", "", "LAN은 근거리 통신망입니다.", "VAN은 부가가치 통신망입니다."], "p": "1과목 › 인터넷·네트워크 › 무선 통신 · 기출 24-03, 25-01"},
{"id": "S1-122", "t": "04 인터넷·네트워크", "q": "다음 중 라디오와 같이 한 쪽은 송신만, 다른 한 쪽은 수신만 가능한 정보 전송 방식은?", "c": ["단방향 통신", "반이중 통신", "전이중 통신", "양방향 통신"], "a": 0, "e": "단방향 통신은 한쪽은 송신만, 다른 쪽은 수신만 가능한 방식입니다(라디오·TV).", "tip": "라디오 = 단방향.", "w": ["", "반이중은 양방향이지만 동시에 송수신할 수 없습니다(무전기).", "전이중은 동시에 양방향 송수신이 가능합니다(전화).", "양방향 통신은 서로 송수신이 모두 가능한 방식입니다."], "p": "1과목 › 인터넷·네트워크 › 정보 전송 방식 · 기출 25-06"},
{"id": "S1-123", "t": "04 인터넷·네트워크", "q": "다음 중 정보 사회의 특징으로 적절하지 않은 것은?", "c": ["정보처리 기술의 발달로 사회의 변화 속도가 빨라졌다.", "사이버 공간상에 새로운 인간관계와 문화가 형성되었다.", "통신 기술의 발달로 시간과 공간의 제약에서 벗어나게 되었다.", "컴퓨터를 통한 정보 처리 기술의 발달로 인해 정보의 양이 감소하였다."], "a": 3, "e": "정보 사회에서는 정보의 양이 폭발적으로 증가합니다.", "tip": "정보 사회 = 정보량 증가.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 인터넷·네트워크 › 정보 사회 · 기출 24-02"},
{"id": "S1-124", "t": "04 인터넷·네트워크", "q": "TCP/IP 프로토콜은 OSI 7계층 중에서 어느 계층에 속하는가?", "c": ["트랜스포트 계층/네트워크 계층", "네트워크 계층/물리 계층", "물리 계층/트랜스포트 계층", "세션 계층/프레젠테이션 계층"], "a": 0, "e": "TCP는 트랜스포트(전송) 계층, IP는 네트워크 계층에 속합니다.", "tip": "TCP = 전송 계층, IP = 네트워크 계층.", "w": ["", "IP는 네트워크 계층이지만 TCP는 물리 계층이 아닙니다.", "TCP/IP는 물리 계층과 트랜스포트 계층에 걸치지 않습니다.", "세션·프레젠테이션은 응용 쪽 상위 계층입니다."], "p": "1과목 › 인터넷·네트워크 › 프로토콜 계층 · 기출 25-05"},
{"id": "S1-125", "t": "04 인터넷·네트워크", "q": "다음은 무엇에 대한 설명인가?\n네트워크를 통하여 전송되는 데이터 프레임은 목적지 컴퓨터의 IP 주소 외에도 네트워크 카드의 물리적인 주소인 MAC 주소를 가지고 있어야 하는데, 컴퓨터의 IP 주소만 알고 MAC 주소를 모르는 경우, IP 주소로부터 MAC 주소를 알아내는 프로토콜", "c": ["TCP", "IP", "ARP", "ICMP"], "a": 2, "e": "ARP는 IP 주소로 MAC(물리) 주소를 알아내는 프로토콜입니다.", "tip": "IP → MAC = ARP.", "w": ["TCP는 신뢰성 있는 전송을 담당하는 프로토콜입니다.", "IP는 패킷의 주소 지정과 경로 설정을 담당합니다.", "", "ICMP는 오류 및 제어 메시지를 전달하는 프로토콜입니다."], "p": "1과목 › 인터넷·네트워크 › ARP · 기출 25-04"},
{"id": "S1-126", "t": "04 인터넷·네트워크", "q": "다음의 장치 중에서 자료가 전송될 최적의 길을 찾아주는 역할을 하며, 네트워크 내의 정보가 다른 네트워크에서도 충분히 읽히도록 해주는 장치는?", "c": ["반복기(Repeater)", "허브(Hub)", "라우터(Router)", "LAN 카드"], "a": 2, "e": "라우터는 목적지까지의 최적 경로를 설정하여 서로 다른 네트워크를 연결합니다.", "tip": "최적 경로 = 라우터.", "w": ["반복기는 약해진 신호를 증폭·재생합니다.", "허브는 여러 컴퓨터를 연결하는 집선 장치입니다.", "", "LAN 카드는 컴퓨터를 네트워크에 연결하는 어댑터입니다."], "p": "1과목 › 인터넷·네트워크 › 네트워크 장비 · 기출 24-02, 25-05"},
{"id": "S1-127", "t": "04 인터넷·네트워크", "q": "다음 중 네트워크 장비인 브리지(Bridge)에 대한 설명으로 옳은 것은?", "c": ["서로 독립적으로 동작하면서 같은 프로토콜을 사용하는 두 LAN을 연결하는 네트워크 장치이다.", "인터넷에 접속할 때 반드시 필요한 장비로, 가장 최적의 경로를 설정하여 전송하는 장치이다.", "주로 LAN에서 다른 네트워크에 데이터를 보내거나 다른 네트워크로부터 데이터를 받아들이는 출입구 역할을 하는 장치이다.", "네트워크를 구성할 때 한꺼번에 여러 대의 컴퓨터를 연결하는 장치이다."], "a": 0, "e": "브리지는 같은 프로토콜을 사용하는 두 개의 LAN을 연결하는 장치입니다.", "tip": "브리지 = 같은 프로토콜의 LAN 연결.", "w": ["", "최적 경로 설정은 라우터의 설명입니다.", "출입구 역할은 게이트웨이의 설명입니다.", "여러 대 컴퓨터를 한꺼번에 연결하는 것은 허브의 설명입니다."], "p": "1과목 › 인터넷·네트워크 › 네트워크 장비 · 기출 25-02"},
{"id": "S1-128", "t": "04 인터넷·네트워크", "q": "다음 중 근거리 통신망(LAN)에 관한 설명으로 옳지 않은 것은?", "c": ["비교적 전송 거리가 짧아 에러 발생률이 낮다.", "반이중 방식의 통신을 한다.", "자원 공유를 목적으로 컴퓨터들을 상호 연결한다.", "프린터, 보조기억장치 등 주변장치들을 쉽게 공유할 수 있다."], "a": 1, "e": "LAN은 양방향 동시 송수신이 가능한 전이중 방식 통신을 합니다.", "tip": "LAN = 전이중.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 인터넷·네트워크 › LAN · 기출 24-02, 24-04, 25-05", "h": 1},
{"id": "S1-129", "t": "04 인터넷·네트워크", "q": "다음 중 정보 통신 장비와 관련하여 리피터(Repeater)에 관한 설명으로 옳은 것은?", "c": ["적절한 전송 경로를 선택하여 데이터를 전달하는 장비이다.", "프로토콜이 다른 네트워크를 결합하는 장비이다.", "감쇠된 전송 신호를 증폭하여 다음 구간으로 전달하는 장비이다.", "같은 프로토콜을 사용하는 독립적인 2개의 근거리 통신망에 상호 접속하는 장비이다."], "a": 2, "e": "리피터는 거리에 따라 약해진(감쇠된) 신호를 증폭·재생하여 전달합니다.", "tip": "리피터 = 신호 증폭·재생.", "w": ["전송 경로 선택은 라우터의 설명입니다.", "프로토콜이 다른 네트워크를 결합하는 장비는 게이트웨이입니다.", "", "같은 프로토콜의 두 LAN을 접속하는 장비는 브리지입니다."], "p": "1과목 › 인터넷·네트워크 › 리피터 · 기출 24-03"},
{"id": "S1-130", "t": "04 인터넷·네트워크", "q": "다음 중 정보 통신을 위한 디지털 방식의 통신 선로에서 전송 신호를 증폭하거나 재생하고 전달하는 중계 장치로 옳은 것은?", "c": ["게이트웨이(Gateway)", "모뎀(Modem)", "리피터(Repeater)", "라우터(Router)"], "a": 2, "e": "신호를 증폭·재생해 전달하는 중계 장치는 리피터입니다.", "tip": "증폭·재생 = 리피터.", "w": ["게이트웨이는 서로 다른 네트워크의 출입구 역할을 합니다.", "모뎀은 디지털·아날로그 신호를 변환합니다.", "", "라우터는 최적의 경로를 설정해 전송합니다."], "p": "1과목 › 인터넷·네트워크 › 리피터 · 기출 26-01, 26-03"},
{"id": "S1-131", "t": "04 인터넷·네트워크", "q": "다음 중 정보통신에서 네트워크 관련 장비에 대한 설명으로 옳지 않은 것은?", "c": ["라우터 : 네트워크 구성을 위해 꼭 필요한 장비로, 정보 전송을 위한 최적의 경로를 찾아 통신망에 연결하는 장치", "허브 : 네트워크를 구성할 때, 여러 대의 컴퓨터를 연결하고, 각 회선을 통합 관리하는 장치", "브리지 : 정보통신을 위한 디지털 방식의 통신 선로에서 전송 신호를 증폭하거나 재생하고 전달하는 중계 장치", "게이트웨이 : 한 네트워크에서 다른 네트워크로 들어가는 입구 역할을 하는 장치로 근거리 통신망(LAN)과 같은 하나의 네트워크를 다른 네트워크와 연결할 때 사용되는 장치"], "a": 2, "e": "신호를 증폭·재생하여 전달하는 중계 장치는 리피터입니다. 브리지는 같은 프로토콜의 두 LAN을 연결합니다.", "tip": "증폭·재생 = 리피터, 연결 = 브리지.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 인터넷·네트워크 › 네트워크 장비 · 기출 26-02"},
{"id": "S1-132", "t": "04 인터넷·네트워크", "q": "다음 설명에 해당하는 데이터 통신망을 무엇이라 하는가?\n• 통신사업자의 대용량 회선을 임대하여 다수의 저속 회선으로 분할한다.\n• 전화 교환, 패킷 교환, 전용 회선의 각 서비스망을 구성한다.\n• 회선의 재판매를 목적으로 하는 회선 대여업이라 할 수 있다.", "c": ["종합정보 통신망(ISDN)", "부가가치 통신망(VAN)", "광대역 통신망(WAN)", "광대역 종합정보 통신망(B-ISDN)"], "a": 1, "e": "통신 회선을 임대해 부가 서비스를 제공하는 망은 부가가치 통신망(VAN)입니다.", "tip": "회선 임대·재판매 = VAN.", "w": ["ISDN은 음성·데이터 등을 디지털 방식으로 통합 전송하는 망입니다.", "", "WAN은 넓은 지역을 연결하는 통신망입니다.", "B-ISDN은 광대역 전송을 지원하는 종합정보 통신망입니다."], "p": "1과목 › 인터넷·네트워크 › 데이터 통신망 · 기출 25-03"},
{"id": "S1-133", "t": "04 인터넷·네트워크", "q": "다음 중 무선 랜(WLAN) 시스템을 구성하기 위한 주요 구성 요소에 해당하지 않는 것은?", "c": ["AP(Access Point)", "리피터(Repeater)", "무선 랜카드", "안테나(Antenna)"], "a": 1, "e": "무선 랜 구성 요소는 AP, 무선 랜카드, 안테나 등입니다. 리피터는 해당하지 않습니다.", "tip": "무선 랜: AP·랜카드·안테나.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 인터넷·네트워크 › 무선 랜 · 기출 25-02"},
{"id": "S1-134", "t": "04 인터넷·네트워크", "q": "다음 중 통신 기술의 이용 현황을 올바르게 설명한 것은?", "c": ["NFC - 노트북을 핫스팟을 이용하여 연결한다.", "BlueTooth - 출·퇴근을 태그를 이용하여 관리한다.", "WiFi - 헤드폰과 핸드폰을 연결한다.", "RFID - 도서관에서 도서 대출/반납 시 태그를 이용하여 도서의 출납을 실시간으로 확인한다."], "a": 3, "e": "RFID는 전자 태그로 사물 정보를 인식하며 도서 대출·반납, 출입 통제 등에 활용됩니다.", "tip": "태그 사용 = RFID.", "w": ["NFC는 핫스팟 연결이 아니라 근거리 무선 통신(결제·출입 등)입니다.", "BlueTooth는 기기 간 무선 연결에 쓰이며 태그 관리 용도가 아닙니다.", "WiFi는 무선 인터넷 접속에 주로 쓰입니다.", ""], "p": "1과목 › 인터넷·네트워크 › 통신 기술 활용 · 기출 26-03"},
{"id": "S1-135", "t": "04 인터넷·네트워크", "q": "라디오 주파수 인식 기술로서 IC 칩과 무선을 통해 식품, 동물, 사물 등 다양한 개체의 정보를 관리할 수 있는 차세대 인식 기술을 무엇이라 하는가?", "c": ["RFID", "바코드", "유비쿼터스", "DMB"], "a": 0, "e": "RFID는 IC 칩과 무선 통신을 이용해 다양한 개체의 정보를 인식·관리하는 기술입니다.", "tip": "IC 칩 + 무선 인식 = RFID.", "w": ["", "바코드는 광학 방식으로 읽는 막대 코드입니다.", "유비쿼터스는 언제 어디서나 네트워크에 접속하는 환경입니다.", "DMB는 디지털 멀티미디어 방송입니다."], "p": "1과목 › 인터넷·네트워크 › RFID · 기출 25-05"},
{"id": "S1-136", "t": "05 정보 보안", "q": "다음은 악성코드에 대한 설명이다. 옳지 않은 것은?", "c": ["파일 감염 바이러스는 대부분 메모리에 상주하며, 프로그램 파일을 감염시킨다.", "웜(Worm)은 자신의 명령어를 다른 프로그램 파일의 일부분에 복사하여 컴퓨터를 오동작하게 하는 종속형 컴퓨터 악성코드이다.", "트로이 목마는 겉으로 보기에 정상적인 프로그램인 것 같으나 악성코드를 숨겨두어 시스템을 공격한다.", "매크로 바이러스는 프로그램에서 어떤 작업을 자동화하기 위해 정의한 내부 프로그래밍 언어를 사용하여 데이터 파일을 감염시킨다."], "a": 1, "e": "웜은 다른 파일에 기생하지 않고 스스로 복제·전파하는 독립형 악성코드입니다.", "tip": "웜 = 독립형.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 악성코드 · 기출 25-03, 26-01"},
{"id": "S1-137", "t": "05 정보 보안", "q": "다음 중 컴퓨터 바이러스에 대한 설명으로 가장 적절하지 않은 것은?", "c": ["사용자가 인지하지 못한 사이 자가복제를 통해 다른 정상적인 프로그램을 감염시켜 해당 프로그램이나 다른 데이터 파일 등을 파괴한다.", "보통 소프트웨어 형태로 감염되나 메일이나 첨부 파일은 감염의 확률이 매우 적다.", "인터넷의 공개 자료실에 있는 파일을 다운로드하여 설치할 때 감염될 수 있다.", "온라인 채팅이나 인스턴트 메신저 프로그램을 통해서 전파되기도 한다."], "a": 1, "e": "이메일과 첨부 파일은 바이러스의 주요 감염 경로이며 감염 확률이 높습니다.", "tip": "메일 첨부 = 대표 감염 경로.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 컴퓨터 바이러스 · 기출 25-06"},
{"id": "S1-138", "t": "05 정보 보안", "q": "다음 중 랜섬웨어에 대한 설명으로 옳지 않은 것은?", "c": ["최근에 사용하던 파일들이 갑자기 보이지 않는다.", "시스템 복원이 불가능하고 금전을 요구하는 문구가 화면에 표시된다.", "파일의 확장자가 변경된다.", "개인 파일이 암호화 된다."], "a": 0, "e": "랜섬웨어는 파일을 지우거나 숨기지 않고 그대로 두되 암호화하고 확장자를 바꿔 열지 못하게 합니다.", "tip": "파일은 그대로 + 암호화.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 랜섬웨어 · 기출 26-03"},
{"id": "S1-139", "t": "05 정보 보안", "q": "다음 중 네트워크 주변을 지나다니는 패킷을 엿보면서 계정(ID)과 비밀번호를 알아내는 보안 위협 행위는?", "c": ["스니핑(Sniffing)", "스푸핑(Spoofing)", "백도어(Back Door)", "키로거(Key Logger)"], "a": 0, "e": "스니핑은 네트워크 패킷을 엿보아 정보를 가로채는 행위입니다.", "tip": "엿보기(도청) = 스니핑.", "w": ["", "스푸핑은 신뢰할 수 있는 대상으로 위장해 속이는 행위입니다.", "백도어는 인증 없이 접근할 수 있도록 몰래 만든 통로입니다.", "키로거는 키보드 입력을 기록해 빼내는 프로그램입니다."], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 스니핑 · 기출 24-03, 25-05"},
{"id": "S1-140", "t": "05 정보 보안", "q": "다음 중 데이터 보안 침해 형태 중 하나인 변조에 대한 설명으로 옳은 것은?", "c": ["데이터가 정상적으로 전송되는 것을 방해하는 것이다.", "데이터가 전송되는 도중에 몰래 엿보거나 정보를 유출하는 것이다.", "전송된 데이터를 다른 내용으로 바꾸는 것이다.", "데이터를 다른 사람이 송신한 것처럼 꾸미는 것이다."], "a": 2, "e": "변조(수정)는 전송된 데이터의 내용을 다른 내용으로 바꾸는 행위입니다.", "tip": "변조 = 내용 바꾸기.", "w": ["데이터 전송을 방해하는 것은 가로막기(중단)입니다.", "전송 중 몰래 엿보는 것은 가로채기입니다.", "", "다른 송신자인 것처럼 꾸미는 것은 위조입니다."], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 데이터 보안 침해 · 기출 25-03"},
{"id": "S1-141", "t": "05 정보 보안", "q": "다음 중 정보 보안을 위협하는 형태에 대한 설명으로 옳은 것은?", "c": ["스니핑(Sniffing) : 검증된 사람이 네트워크를 통해 데이터를 보낸 것처럼 데이터를 변조하여 접속을 시도한다.", "피싱(Phishing) : 적절한 사용자 동의 없이 사용자 정보를 수집하는 프로그램을 설치하여 사생활을 침해한다.", "스푸핑(Spoofing) : 실제로는 악성 코드로 행동하지 않으면서 겉으로는 악성 코드인 것처럼 가장한다.", "키로거(Key Logger) : 키보드 상의 키 입력 캐치 프로그램을 이용하여 개인 정보를 빼낸다."], "a": 3, "e": "키로거는 키 입력을 가로채는 프로그램으로 개인 정보를 빼냅니다.", "tip": "키로거 = 키 입력 탈취.", "w": ["①의 설명은 스푸핑에 가깝고, 스니핑은 패킷을 엿보는 행위입니다.", "②의 설명은 스파이웨어에 가깝고, 피싱은 가짜 사이트로 정보를 낚는 행위입니다.", "스푸핑은 신뢰할 수 있는 대상으로 위장하는 것이며 악성 코드 흉내와 다릅니다.", ""], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 보안 위협 형태 · 기출 26-02"},
{"id": "S1-142", "t": "05 정보 보안", "q": "다음 중 정보 보안을 위협하는 유형에 대한 설명으로 옳지 않은 것은?", "c": ["가로막기는 데이터의 정상적인 전달을 막아 흐름을 방해하는 행위이다.", "수정은 전송된 데이터가 원래의 데이터가 아닌 다른 내용으로 바꾸는 행위이다.", "가로채기는 송신된 데이터가 수신지까지 가는 회선을 절단하는 행위이다.", "위조는 다른 송신자로부터 데이터가 송신된 것처럼 꾸미는 행위이다."], "a": 2, "e": "회선을 절단하여 전달을 막는 것은 가로막기입니다. 가로채기는 전송 중인 데이터를 몰래 빼내는 행위입니다.", "tip": "절단 = 가로막기, 엿보기 = 가로채기.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 보안 위협 유형 · 기출 25-04"},
{"id": "S1-143", "t": "05 정보 보안", "q": "다음 중 정보 보안을 위해 필요한 조치 방법으로 가장 거리가 먼 것은?", "c": ["방화벽(Firewall)을 설치하여 네트워크를 관리한다.", "중요한 데이터는 암호화하여 관리한다.", "불법적인 접근에 대한 접근 통제 도구를 개발하여 사용한다.", "불법적인 접근을 방지하기 위해 DNS의 설정을 변경한다."], "a": 3, "e": "DNS 설정 변경은 정보 보안 조치와 거리가 멉니다. DNS는 도메인과 IP를 변환하는 서비스입니다.", "tip": "보안 = 방화벽·암호화·접근 통제.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 정보 보안 조치 · 기출 26-01"},
{"id": "S1-144", "t": "05 정보 보안", "q": "해커를 유인하기 위해 의도적으로 취약한 서버를 만들어 이를 모니터링하는 시스템으로 공격자의 공격 경로와 공격 수법을 알아내기 위한 목적으로 사용하는 것은?", "c": ["VPN(Virtual Private Network)", "허니팟(Honeypot)", "침입 탐지 시스템(IDS)", "방화벽(Firewall)"], "a": 1, "e": "허니팟은 일부러 취약하게 만든 미끼 시스템으로 공격자의 수법을 관찰합니다.", "tip": "미끼 서버 = 허니팟.", "w": ["VPN은 공중망에서 사설망처럼 안전하게 통신하는 기술입니다.", "", "IDS는 침입을 탐지하여 알리는 시스템입니다.", "방화벽은 외부 침입을 차단하는 시스템입니다."], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 허니팟 · 기출 25-03"},
{"id": "S1-145", "t": "05 정보 보안", "q": "다음 중 여러 대의 컴퓨터를 일제히 동작시켜 대량의 데이터를 한 곳의 서버 컴퓨터에 집중적으로 전송시킴으로써 특정 서버가 정상적으로 동작하지 못하게 하는 공격 방식은?", "c": ["스니핑(Sniffing)", "분산 서비스 거부(DDoS)", "백도어(Back Door)", "해킹(Hacking)"], "a": 1, "e": "DDoS는 다수의 컴퓨터로 서버에 과부하를 일으켜 서비스를 마비시키는 공격입니다.", "tip": "여러 대가 동시에 과부하 = DDoS.", "w": ["스니핑은 패킷을 엿보는 행위입니다.", "", "백도어는 몰래 만든 접근 통로입니다.", "해킹은 불법 침입을 통칭하는 용어입니다."], "p": "1과목 › 정보 보안·컴퓨터 범죄 › DDoS · 기출 24-01"},
{"id": "S1-146", "t": "05 정보 보안", "q": "다음 중 컴퓨터 범죄의 예방 방법으로 가장 적절하지 않은 것은?", "c": ["시스템에 방화벽을 구성하여 사용한다.", "다운로드 받은 파일은 백신 프로그램으로 검사한 후 사용한다.", "게시판에 업로드된 프로그램은 안전하므로 다운로드해서 바로 사용한다.", "백신 프로그램은 수시로 업데이트한다."], "a": 2, "e": "게시판에 올라온 프로그램도 악성코드가 포함될 수 있으므로 검사 후 사용해야 합니다.", "tip": "출처 불명 파일은 항상 검사.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 컴퓨터 범죄 예방 · 기출 24-01, 24-02, 25-01", "h": 1},
{"id": "S1-147", "t": "05 정보 보안", "q": "다음 중 컴퓨터 범죄 예방에 대한 설명으로 옳지 않은 것은?", "c": ["해킹 방지를 위해 패스워드는 가급적 변경하지 않는다.", "정보 누출이나 해킹 방지를 위해 방화벽 체제를 정비한다.", "암호는 가급적이면 알파벳과 숫자, 특수문자 등을 섞어서 만든다.", "지속적인 해킹 감시 및 접근 통제 도구를 개발한다."], "a": 0, "e": "패스워드는 주기적으로 변경하는 것이 좋습니다.", "tip": "비밀번호는 주기적 변경.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 컴퓨터 범죄 예방 · 기출 24-04"},
{"id": "S1-148", "t": "05 정보 보안", "q": "다음 중 컴퓨터 범죄에 해당하지 않는 것은?", "c": ["전자문서의 불법 복사", "전산망을 이용한 개인 정보 유출", "컴퓨터 시스템 해킹을 통한 중요 정보의 위조 또는 변조", "인터넷 쇼핑몰 상품 가격 비교표 작성"], "a": 3, "e": "상품 가격 비교표 작성은 정상적인 업무 활동이며 범죄가 아닙니다.", "tip": "불법·침해 행위만 범죄.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 컴퓨터 범죄 · 기출 25-04, 26-01"},
{"id": "S1-149", "t": "05 정보 보안", "q": "다음 중 컴퓨터 범죄 예방과 대책에 관한 설명으로 옳지 않은 것은?", "c": ["해킹 여부를 정기적으로 검사한다.", "의심이 가는 이메일은 열어서 내용을 확인하고 삭제한다.", "백신 프로그램을 설치하고 자동 업데이트 기능을 설정한다.", "회원 가입한 사이트의 패스워드를 주기적으로 변경한다."], "a": 1, "e": "의심스러운 이메일은 열어 보지 말고 바로 삭제해야 합니다.", "tip": "의심 메일은 열지 말고 삭제.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 컴퓨터 범죄 예방 · 기출 26-02"},
{"id": "S1-150", "t": "05 정보 보안", "q": "다음 중 컴퓨터를 관리하는 효율적인 방법으로 옳지 않은 것은?", "c": ["컴퓨터를 이동하거나 부품을 교체할 경우에는 전원을 끄고 작업하는 것이 바람직하다.", "시스템에 문제가 발생하면 시스템을 재부팅하고 하드디스크의 모든 파티션을 제거한다.", "정기적으로 최신 바이러스 백신 프로그램을 사용하여 바이러스 감염을 방지하며, 중요한 데이터는 백업하여 둔다.", "가급적 불필요한 프로그램은 설치하지 않도록 하며, 정기적으로 시스템을 점검한다."], "a": 1, "e": "문제가 생겼다고 모든 파티션을 제거하면 데이터가 모두 사라집니다. 적절한 점검·복구를 먼저 해야 합니다.", "tip": "파티션 제거 = 데이터 삭제.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 컴퓨터 관리 · 기출 24-04, 25-01"},
{"id": "S1-151", "t": "05 정보 보안", "q": "다음 중 컴퓨터 보안과 관련된 기술에 해당하지 않은 것은?", "c": ["인증(Authentication)", "암호화(Encryption)", "방화벽(Firewall)", "브리지(Bridge)"], "a": 3, "e": "브리지는 같은 프로토콜의 두 LAN을 연결하는 네트워크 장치이며 보안 기술이 아닙니다.", "tip": "브리지 = 네트워크 장치.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 정보 보안·컴퓨터 범죄 › 보안 기술 · 기출 26-03"},
{"id": "S1-152", "t": "06 멀티미디어·그래픽", "q": "다음 중 멀티미디어의 특징에 대한 설명으로 옳지 않은 것은?", "c": ["다양한 아날로그 데이터를 디지털 데이터로 변환하여 통합 처리한다.", "정보 제공자와 사용자 간의 상호 작용에 의해 데이터가 전달된다.", "미디어별 파일 형식이 획일화되어 멀티미디어의 제작이 용이해진다.", "텍스트, 그래픽, 사운드, 동영상 등의 여러 미디어를 통합 처리한다."], "a": 2, "e": "멀티미디어는 미디어별로 다양한 파일 형식이 존재하며, 그에 맞게 제작합니다.", "tip": "파일 형식은 획일화되어 있지 않다.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "1과목 › 멀티미디어·그래픽 › 멀티미디어 · 기출 24-03, 26-03"},
{"id": "S1-153", "t": "06 멀티미디어·그래픽", "q": "다음 중 멀티미디어에 대한 설명으로 옳지 않은 것은?", "c": ["멀티미디어용 소프트웨어는 주로 도스용을 많이 사용한다.", "멀티미디어란 텍스트, 그래픽, 사운드 그리고 애니메이션 등으로 구현된 영상의 통합을 의미한다.", "멀티미디어 정보를 저장하기 위하여 하드디스크, CD-ROM, 광디스크 등을 사용한다.", "다중 매체로서 여러 가지 유형의 정보를 다룬다."], "a": 0, "e": "멀티미디어용 소프트웨어는 도스가 아닌 Windows 같은 그래픽 환경에서 주로 사용합니다.", "tip": "멀티미디어 = 그래픽 환경(Windows).", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 멀티미디어·그래픽 › 멀티미디어 · 기출 25-03"},
{"id": "S1-154", "t": "06 멀티미디어·그래픽", "q": "다음 중 애니메이션에서의 모핑(Morphing) 기법에 대한 설명으로 옳은 것은?", "c": ["종이에 그린 그림을 셀룰로이드에 그대로 옮긴 뒤 채색하고 촬영하는 기법이다.", "2개의 이미지나 3차원 모델 간에 부드럽게 연결하여 서서히 변하는 모습을 보여주는 기법이다.", "키 프레임을 이용하여 애니메이션을 만드는 기법이다.", "점토를 사용하여 애니메이션을 만드는 기법이다."], "a": 1, "e": "모핑은 두 이미지(또는 3D 모델) 사이를 부드럽게 변형시켜 서서히 변하는 모습을 보여줍니다.", "tip": "A → B 서서히 변환 = 모핑.", "w": ["셀 애니메이션의 설명입니다.", "", "키 프레임 애니메이션의 설명입니다.", "클레이메이션의 설명입니다."], "p": "1과목 › 멀티미디어·그래픽 › 모핑 · 기출 24-02, 25-01, 26-03", "h": 1},
{"id": "S1-155", "t": "06 멀티미디어·그래픽", "q": "다음 중 아래에서 설명하는 그래픽 기법은?\n컴퓨터 프로그램을 이용하여 3차원 애니메이션을 만드는 과정으로 사물 모형에 명암과 색상을 추가하여 사실감을 더해 주는 작업이다.", "c": ["안티앨리어싱(Anti-Aliasing)", "렌더링(Rendering)", "인터레이싱(Interlacing)", "메조틴트(Mezzotint)"], "a": 1, "e": "렌더링은 3차원 모형에 명암과 색상을 입혀 사실감을 더하는 작업입니다.", "tip": "명암·색상으로 사실감 = 렌더링.", "w": ["안티앨리어싱은 계단 현상을 줄여 경계선을 부드럽게 하는 기법입니다.", "", "인터레이싱은 이미지를 단계적으로 점점 선명하게 보여 주는 방식입니다.", "메조틴트는 이미지에 점·선 등의 질감 효과를 주는 필터링 기법으로 사실감 추가와는 다릅니다."], "p": "1과목 › 멀티미디어·그래픽 › 렌더링 · 기출 24-03, 25-05, 26-01", "h": 1},
{"id": "S1-156", "t": "06 멀티미디어·그래픽", "q": "다음 중 비트맵 이미지를 확대하였을 때 이미지의 경계선이 매끄럽지 않고 계단 형태로 나타나는 현상을 의미하는 용어는?", "c": ["앨리어싱(aliasing)", "디더링(dithering)", "렌더링(rendering)", "모델링(modeling)"], "a": 0, "e": "앨리어싱은 비트맵 이미지를 확대할 때 경계선이 계단처럼 보이는 현상입니다.", "tip": "계단 현상 = 앨리어싱.", "w": ["", "디더링은 제한된 색상을 섞어 다양한 색을 표현하는 기법입니다.", "렌더링은 3D 모형에 명암·색상을 입혀 사실감을 높이는 작업입니다.", "모델링은 3D 물체의 형상을 만드는 작업입니다."], "p": "1과목 › 멀티미디어·그래픽 › 앨리어싱 · 기출 25-06"},
{"id": "S1-157", "t": "06 멀티미디어·그래픽", "q": "다음 중 이미지의 가장자리가 톱니 모양으로 표현되는 계단 현상을 없애기 위하여 경계선을 부드럽게 해주는 필터링 기술은?", "c": ["디더링(Dithering)", "안티앨리어싱(Antialiasing)", "렌더링(Rendering)", "모핑(Morphing)"], "a": 1, "e": "안티앨리어싱은 경계선을 부드럽게 처리하여 계단 현상을 줄입니다.", "tip": "계단 제거 = 안티앨리어싱.", "w": ["디더링은 색상 수를 늘려 보이게 하는 기법입니다.", "", "렌더링은 3D 모형에 사실감을 입히는 작업입니다.", "모핑은 한 이미지를 다른 이미지로 서서히 변환하는 기법입니다."], "p": "1과목 › 멀티미디어·그래픽 › 안티앨리어싱 · 기출 25-02"},
{"id": "S1-158", "t": "06 멀티미디어·그래픽", "q": "다음 중 그래픽 데이터의 표현에서 벡터(Vector) 방식에 관한 설명으로 옳은 것은?", "c": ["점과 점을 연결하는 직선 또는 곡선을 이용하여 이미지를 표현한다.", "이미지를 확대하면 테두리에 계단 현상과 같은 앨리어싱이 발생한다.", "래스터 방식이라고도 하며 화면 표시 속도가 빠르다.", "많은 픽셀로 정교하고 다양한 색상을 표시할 수 있다."], "a": 0, "e": "벡터 방식은 점·선·곡선의 좌표와 수식으로 이미지를 표현합니다.", "tip": "벡터 = 수식·좌표.", "w": ["", "확대 시 계단 현상이 생기는 것은 비트맵 방식입니다.", "래스터 방식은 비트맵 방식의 다른 이름입니다.", "많은 픽셀로 정교하게 표현하는 것은 비트맵 방식입니다."], "p": "1과목 › 멀티미디어·그래픽 › 벡터 그래픽 · 기출 26-02"},
{"id": "S1-159", "t": "06 멀티미디어·그래픽", "q": "다음 중 그래픽 데이터 형식에 관한 설명으로 옳지 않은 것은?", "c": ["BMP : Windows 운영체제의 표준 비트맵 파일 형식으로 압축하여 저장하므로 파일의 크기가 작은 편이다.", "GIF : 인터넷 표준 그래픽 형식으로 8비트 컬러를 사용하여 최대 256 색상까지만 표현할 수 있으며, 애니메이션 표현이 가능하다.", "JPEG : 사진과 같은 선명한 정지 영상 압축 기술에 대한 국제 표준으로 주로 인터넷에서 그림 전송에 사용된다.", "PNG : 트루 컬러의 지원과 투명색 지정이 가능하다."], "a": 0, "e": "BMP는 압축하지 않고 저장하므로 파일 크기가 큰 편입니다.", "tip": "BMP = 무압축·대용량.", "w": ["", "옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 멀티미디어·그래픽 › 그래픽 데이터 형식 · 기출 24-02, 24-04"},
{"id": "S1-160", "t": "06 멀티미디어·그래픽", "q": "다음 중 JPEG 표준에 대한 설명으로 옳지 않은 것은?", "c": ["손실 압축 기법과 무손실 압축 기법이 있지만 특허 문제나 압축률 등의 이유로 무손실 압축 방식은 잘 쓰이지 않는다.", "JPEG 표준을 사용하는 파일 형식에는 jpg, jpeg, jpe 등의 확장자를 사용한다.", "파일 크기가 작아 웹 상에서 사진 같은 이미지를 보관하고 전송하는데 사용한다.", "문자, 선, 세밀한 격자 등 고주파 성분이 많은 이미지의 변환에서는 GIF나 PNG에 비해 품질이 매우 우수하다."], "a": 3, "e": "JPEG는 문자·선·세밀한 격자 등 고주파 성분이 많은 이미지에서는 GIF·PNG보다 품질이 떨어집니다.", "tip": "JPEG = 사진용, 문자·선은 약함.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "1과목 › 멀티미디어·그래픽 › JPEG · 기출 25-03"},
{"id": "S1-161", "t": "06 멀티미디어·그래픽", "q": "다음 중 오디오 데이터와 관련된 용어에 해당하지 않는 것은?", "c": ["시퀀싱(Sequencing)", "인터레이싱(Interlacing)", "PCM(Pulse Code Modulation)", "샘플링(Sampling)"], "a": 1, "e": "인터레이싱은 이미지를 단계적으로 표시하는 방식으로 오디오와 관련이 없습니다.", "tip": "인터레이싱 = 이미지.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 멀티미디어·그래픽 › 오디오 데이터 · 기출 25-04"},
{"id": "S1-162", "t": "06 멀티미디어·그래픽", "q": "다음 중 멀티미디어와 관련하여 동영상 전문가 그룹에 의해서 제안된 비디오 또는 오디오 압축에 관한 일련의 표준으로 옳은 것은?", "c": ["XML", "SVG", "JPEG", "MPEG"], "a": 3, "e": "MPEG은 동영상 전문가 그룹(Moving Picture Experts Group)이 제안한 비디오·오디오 압축 표준입니다.", "tip": "동영상 전문가 = MPEG.", "w": ["XML은 확장 가능한 마크업 언어입니다.", "SVG는 벡터 이미지 형식입니다.", "JPEG는 정지 영상 압축 표준입니다.", ""], "p": "1과목 › 멀티미디어·그래픽 › 동영상 압축 · 기출 25-02"},
{"id": "S1-163", "t": "06 멀티미디어·그래픽", "q": "다음 중 멀티미디어 파일을 다운 받을 때 지연시간을 줄이기 위해 데이터를 다운로드 받으면서 재생할 수 있는 기술로 옳은 것은?", "c": ["CSS 기술", "스트리밍 기술", "가상현실 기술", "매핑 기술"], "a": 1, "e": "스트리밍은 파일을 모두 내려받기 전에 받으면서 바로 재생하는 기술입니다.", "tip": "받으면서 재생 = 스트리밍.", "w": ["CSS는 웹 문서의 스타일을 지정하는 언어입니다.", "", "가상현실은 3D로 현실처럼 구현하는 기술입니다.", "매핑은 3D 물체 표면에 질감 이미지를 입히는 기법입니다."], "p": "1과목 › 멀티미디어·그래픽 › 스트리밍 · 기출 25-02"},
{"id": "S1-164", "t": "06 멀티미디어·그래픽", "q": "다음 중 컴퓨터를 이용한 가상 현실(Virtual Reality)에 관한 설명으로 옳은 것은?", "c": ["고화질 영상을 제작하여 텔레비전에 나타내는 기술이다.", "고도의 컴퓨터 그래픽 기술과 3차원 기법을 통하여 현실의 세계처럼 구현하는 기술이다.", "여러 영상을 통합하여 2차원 그래픽으로 표현하는 기술이다.", "복잡한 데이터를 단순화시켜 컴퓨터 화면에 나타내는 기술이다."], "a": 1, "e": "가상 현실은 컴퓨터 그래픽과 3차원 기법으로 현실처럼 느끼게 하는 기술입니다.", "tip": "가상 현실 = 3차원 + 현실처럼.", "w": ["고화질 영상 방송 기술의 설명입니다.", "", "2차원이 아니라 3차원 그래픽으로 구현합니다.", "데이터 시각화에 가까운 설명입니다."], "p": "1과목 › 멀티미디어·그래픽 › 가상 현실 · 기출 24-02, 25-05, 26-02", "h": 1},
{"id": "S1-165", "t": "06 멀티미디어·그래픽", "q": "다음 중 실감미디어에 대한 설명으로 옳지 않은 것은?", "c": ["홀로그램 - 기록 매체에 레이저와 같이 간섭성이 있는 광원을 이용하여 간섭 패턴을 기록한 결과물로, 광원을 이용하여 재생하면 3차원 영상으로 표현된다.", "증강현실 - 가상 세계에서 일상 생활이나 경제적 활동이 가능하며, 사용자를 대신하는 캐릭터에서 가상 세계에서의 사회적 책임과 의무를 요구하고 있다.", "가상현실 - 다양한 장치를 통해 컴퓨터가 만들어낸 가상세계에서 여러 다른 경험을 체험할 수 있도록 한 모든 기술을 말한다.", "혼합현실 - 가상현실과 현실 세계를 합쳐, 현실의 물리적인 객체와 가상의 객체가 상호 작용할 수 있는 환경을 구현하는 기술이다."], "a": 1, "e": "②의 설명은 메타버스입니다. 증강현실은 현실 세계 위에 가상 정보를 겹쳐 보여주는 기술입니다.", "tip": "가상 세계 활동 = 메타버스, 현실 + 가상 정보 = 증강현실.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 멀티미디어·그래픽 › 실감미디어 · 기출 24-01"},
{"id": "S1-166", "t": "06 멀티미디어·그래픽", "q": "다음 중 AR/VR을 위한 핵심 기술이 아닌 것은?", "c": ["인터렉션(Interaction)", "스트리밍(Streaming)", "렌더링(Rendering)", "트래킹(Tracking)"], "a": 1, "e": "AR/VR 핵심 기술은 인터렉션, 렌더링, 트래킹 등입니다. 스트리밍은 해당하지 않습니다.", "tip": "AR/VR = 인터렉션·렌더링·트래킹.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 멀티미디어·그래픽 › AR/VR 기술 · 기출 26-02"},
{"id": "S1-167", "t": "06 멀티미디어·그래픽", "q": "다음 중 하이퍼텍스트(Hypertext)에 대한 설명으로 옳지 않은 것은?", "c": ["하이퍼텍스트는 텍스트가 링크로 연결되어 있는 문서이다.", "동영상, 그래픽 등의 정보를 연결해 놓은 멀티미디어 형식이다.", "사용자가 하이퍼링크(Hyperlink)를 클릭함으로써 원하는 데이터를 찾을 수 있다.", "하이퍼텍스트는 사용자의 의도에 따라 문서를 읽는 순서가 결정되는 비선형 구조이다."], "a": 1, "e": "동영상·그래픽까지 연결한 멀티미디어 형식은 하이퍼미디어입니다. 하이퍼텍스트는 텍스트 중심입니다.", "tip": "텍스트 연결 = 하이퍼텍스트, 멀티미디어 연결 = 하이퍼미디어.", "w": ["옳은 설명입니다.", "", "옳은 설명입니다.", "옳은 설명입니다."], "p": "1과목 › 멀티미디어·그래픽 › 하이퍼텍스트 · 기출 25-06"}],
"2":[{"id": "S2-001", "t": "01 입력·서식·참조", "q": "셀에 데이터를 입력하던 중 [Alt]+[Enter]를 누르면 어떻게 되는가?", "c": ["다음 입력할 셀로 이동된다.", "데이터가 삭제된다.", "같은 셀 내에서 줄 바꿈이 된다.", "아무 일도 일어나지 않는다."], "a": 2, "e": "[Alt]+[Enter]는 같은 셀 안에서 줄을 바꿉니다.", "tip": "Alt+Enter = 셀 안 줄 바꿈.", "w": ["[Enter]나 [Tab]을 누르면 다음 셀로 이동합니다.", "입력을 취소하려면 [Esc]를 누릅니다.", "", "줄 바꿈이 수행됩니다."], "p": "2과목 › 데이터 입력·서식·참조 › 셀 입력 · 기출 25-05, 26-03"},
{"id": "S2-002", "t": "01 입력·서식·참조", "q": "다음 중 날짜 및 시간 데이터에 관한 설명으로 옳지 않은 것은?", "c": ["날짜 데이터를 입력할 때 년도와 월만 입력하면 일자는 자동으로 해당 월의 1일로 입력된다.", "셀에 '4/9'를 입력하고 [Enter]를 누르면 셀에는 '4월 9일'로 표시된다.", "날짜 및 시간 데이터의 텍스트 맞춤은 기본 왼쪽 맞춤으로 표시된다.", "[Ctrl]+[;]을 누르면 시스템의 오늘 날짜, [Ctrl]+[Shift]+[;]을 누르면 현재 시간이 입력된다."], "a": 2, "e": "날짜·시간 데이터는 숫자로 취급되어 기본적으로 오른쪽 맞춤으로 표시됩니다.", "tip": "날짜·시간 = 숫자 → 오른쪽 정렬.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 날짜·시간 입력 · 기출 24-04, 25-03, 25-05, 25-06, 26-03", "h": 1},
{"id": "S2-003", "t": "01 입력·서식·참조", "q": "다음 중 날짜 및 시간 데이터에 관한 설명으로 옳지 않은 것은?", "c": ["날짜를 입력할 때 일을 입력하지 않으면 자동으로 해당 월의 1일로 입력된다.", "셀에 4/9를 입력하고 [Enter]를 누르면 셀에 4월 9일로 표시된다.", "날짜 및 시간 데이터는 자동으로 오른쪽을 기준으로 정렬된다.", "[Ctrl]+[;]를 누르면 시스템의 현재 시간, [Ctrl]+[Shift]+[;]를 누르면 오늘 날짜가 입력된다."], "a": 3, "e": "[Ctrl]+[;]는 오늘 날짜, [Ctrl]+[Shift]+[;]는 현재 시간입니다. 설명이 서로 바뀌었습니다.", "tip": "날짜 = Ctrl+;, 시간 = Ctrl+Shift+;.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 입력·서식·참조 › 날짜·시간 입력 · 기출 25-04"},
{"id": "S2-004", "t": "01 입력·서식·참조", "q": "다음 중 데이터 입력에 대한 설명으로 옳지 않은 것은?", "c": ["셀 안에서 줄 바꿈을 하려면 [Alt]+[Enter]를 누른다.", "한 행을 블록 설정한 상태에서 [Enter]를 누르면 블록 내의 셀이 오른쪽 방향으로 순차적으로 선택되어 행 단위로 데이터를 쉽게 입력할 수 있다.", "여러 셀에 숫자나 문자 데이터를 한 번에 입력하려면 여러 셀이 선택된 상태에서 데이터를 입력한 후 바로 [Shift]+[Enter]를 누른다.", "열의 너비가 좁아 입력된 날짜 데이터 전체를 표시하지 못하는 경우 셀의 너비에 맞춰 '#'이 반복 표시된다."], "a": 2, "e": "여러 셀에 같은 데이터를 한 번에 입력하려면 [Ctrl]+[Enter]를 누릅니다. [Shift]+[Enter]는 위쪽 셀로 이동합니다.", "tip": "동시 입력 = Ctrl+Enter.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 데이터 입력 · 기출 24-02, 25-03"},
{"id": "S2-005", "t": "01 입력·서식·참조", "q": "다음 중 데이터 입력에 대한 설명으로 옳지 않은 것은?", "c": ["데이터를 입력하는 도중에 입력을 취소하려면 [Esc]를 누른다.", "셀 안에서 줄을 바꾸어 데이터를 입력하려면 [Alt]+[Enter]를 누른다.", "텍스트, 텍스트/숫자 조합, 날짜, 시간 데이터는 셀에 입력하는 처음 몇 자가 해당 열의 기존 내용과 일치하면 자동으로 입력된다.", "여러 셀에 동일한 데이터를 입력하려면 해당 셀을 범위로 지정하여 데이터를 입력한 후 [Ctrl]+[Enter]를 누른다."], "a": 2, "e": "자동 완성은 텍스트 또는 텍스트와 숫자의 조합에만 적용되며 숫자·날짜·시간 데이터에는 적용되지 않습니다.", "tip": "자동 완성 = 문자 중심.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "", "옳은 설명입니다."], "p": "2과목 › 데이터 입력·서식·참조 › 데이터 입력 · 기출 25-02"},
{"id": "S2-006", "t": "01 입력·서식·참조", "q": "다음 중 아래 그림과 같이 소수점 자동 삽입의 소수점 위치를 3으로 설정한 상태에서 숫자 5를 입력하였을 때 화면에 표시되는 결과로 옳은 것은?\n(Excel 옵션 - 고급 - 편집 옵션: '소수점 자동 삽입' 체크, 소수점 위치 3)", "c": ["0.005", "3", "5", "5.000"], "a": 0, "e": "소수점 자동 삽입을 3으로 설정하면 입력한 숫자의 오른쪽에서 3자리 앞에 소수점이 삽입되어 5는 0.005가 됩니다.", "tip": "위치 3 → 5는 0.005.", "w": ["", "소수점 위치 값 자체가 입력되는 것이 아닙니다.", "소수점을 직접 입력하지 않는 한 5가 그대로 입력되지 않습니다.", "5.000이 아니라 5를 3자리 아래로 내려 0.005가 됩니다."], "p": "2과목 › 데이터 입력·서식·참조 › 소수점 자동 삽입 · 기출 24-01"},
{"id": "S2-007", "t": "01 입력·서식·참조", "q": "다음 중 워크시트에 \"(tel)\"을 입력하면 자동으로 \"☎\"로 변경되어 입력되도록 하는 기능은?", "c": ["자동 완성 기능", "자동 고침 기능", "맞춤법 검사 기능", "자동 교정 기능"], "a": 1, "e": "자동 고침은 미리 정해 둔 글자를 입력하면 지정한 문자로 자동 변환합니다.", "tip": "(tel) → ☎ = 자동 고침.", "w": ["자동 완성은 입력 중인 앞 글자와 같은 항목을 제시합니다.", "", "맞춤법 검사는 철자 오류를 찾아 줍니다.", "'자동 교정'은 엑셀의 기능 이름이 아닙니다."], "p": "2과목 › 데이터 입력·서식·참조 › 자동 고침 · 기출 24-02, 25-02"},
{"id": "S2-008", "t": "01 입력·서식·참조", "q": "다음 중 '셀 항목 자동 완성' 기능에 대한 설명으로 옳지 않은 것은?", "c": ["숫자 또는 날짜만으로 구성된 내용에는 적용되지 않는다.", "[파일] → [옵션] → [고급] 탭의 '편집 옵션' 항목에서 '셀 내용을 자동 완성'이 설정되어 있어야 실행된다.", "나머지 글자가 자동으로 채워진 항목을 그대로 입력하려면 [Enter]를 입력한다.", "한글이나 영어로만 구성된 항목에 적용되는 기능이다."], "a": 3, "e": "한글·영어뿐 아니라 텍스트와 숫자가 섞인 항목에도 적용됩니다(숫자·날짜만 있는 항목은 제외).", "tip": "문자 + 숫자 조합도 가능.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 입력·서식·참조 › 자동 완성 · 기출 25-06"},
{"id": "S2-009", "t": "01 입력·서식·참조", "q": "다음 중 한자와 특수문자 입력에 대한 설명으로 옳지 않은 것은?", "c": ["한자로 변환할 한글을 입력한 후 [한자]를 누른다.", "두 글자 이상의 단어를 한자로 변환할 때는 단어를 입력하고, 커서를 단어 앞이나 뒤에 놓은 다음 [한자]를 누른다.", "한글 입력 상태에서 한글 자음을 입력하고 [한자]를 누른다.", "한글 입력 상태에서 한글 모음을 입력하고 [한자]를 누른다."], "a": 3, "e": "한글 자음을 입력하고 [한자]를 누르면 특수문자 목록이 나타나지만, 모음에는 이런 기능이 없습니다.", "tip": "자음 + 한자 = 특수문자.", "w": ["옳은 설명입니다.", "옳은 설명입니다.", "옳은 설명입니다.", ""], "p": "2과목 › 데이터 입력·서식·참조 › 한자 입력 · 기출 26-01"},
{"id": "S2-010", "t": "01 입력·서식·참조", "q": "다음 중 채우기 핸들에 대한 설명으로 옳은 것은?", "c": ["문자와 숫자가 혼합된 셀의 채우기 핸들을 [Ctrl]을 누른 채 드래그하면 동일한 내용으로 복사된다.", "숫자가 입력된 첫 번째 셀과 두 번째 셀을 범위로 설정한 후 채우기 핸들을 드래그하면 두 번째 셀의 값이 복사된다.", "숫자가 입력된 셀에서 [Ctrl]을 누른 채 채우기 핸들을 오른쪽으로 드래그하면 숫자가 1씩 감소한다.", "사용자 지정 목록에 지정된 목록 데이터의 첫 번째 항목을 입력하고 [Ctrl]을 누른 채 채우기 핸들을 드래그하면 목록 데이터가 입력된다."], "a": 0, "e": "문자와 숫자가 섞인 셀은 기본 드래그 시 숫자가 1씩 증가하고, [Ctrl]을 누르면 동일한 내용이 복사됩니다.", "tip": "문자+숫자: 기본 증가, Ctrl 복사.", "w": ["", "두 셀을 범위로 지정하면 두 값의 차이만큼 증가하는 연속 데이터가 채워집니다.", "숫자 셀을 [Ctrl]과 함께 끌면 1씩 증가합니다(감소가 아님).", "사용자 지정 목록은 [Ctrl]을 누르면 목록이 아닌 같은 값이 복사됩니다."], "p": "2과목 › 데이터 입력·서식·참조 › 채우기 핸들 · 기출 24-01, 25-06, 26-01, 26-02", "h": 1},
